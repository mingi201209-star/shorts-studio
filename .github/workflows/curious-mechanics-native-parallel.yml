name: Curious Mechanics native parallel production
on:
  push:
    branches: [exp/curious-mechanics-production-20261029]
    paths: [.github/workflows/curious-mechanics-native-parallel.yml]
permissions:
  contents: read
concurrency:
  group: curious-mechanics-native-pilot
  cancel-in-progress: false
env:
  RENDERER_SOURCE_SHA256: e6f3da8e73bbcecc54454b4d3a7407d4e7949ac93689a49eb289f123772dd797
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include:
          - {variant: C, start: 91, end: 120}
