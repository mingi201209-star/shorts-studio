          - {variant: C, start: 871, end: 900}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 30 contiguous absolute original frames
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-${{ matrix.variant }}.json --start ${{ matrix.start }} --end ${{ matrix.end }} --out "$RUNNER_TEMP/rumble" 2>&1 | tee "$RUNNER_TEMP/rumble/render.log"
      - name: Native shard QA and lossless intermediate
        run: |
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_shard_artifact.py --out "$RUNNER_TEMP/rumble" --manifest examples/experiments/curious-mechanics-${{ matrix.variant }}.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-native-${{ matrix.variant }}-${{ matrix.start }}
          path: ${{ runner.temp }}/rumble/
          if-no-files-found: error
          retention-days: 7
