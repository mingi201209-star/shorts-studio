name: breath-ab-render

on:
  push:
    branches: [exp/tts-subtle-breathing]
    paths:
      - 'shorts_studio/**'
      - 'tests/**'
      - 'scripts/build_hydroplaning_states.py'
      - 'scripts/build_breath_ab.py'
      - '.github/workflows/breath-ab-render.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render and vision dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'
      - name: Full regression
        run: pytest -q
      - name: Build hydroplaning production (shared visual track for A/B)
        run: |
          set -o pipefail
          python scripts/build_hydroplaning_states.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf 2>&1 | tee hydroplaning-generator.log
      - name: Derive A (baseline) / B (subtle breath) manifests
        run: python scripts/build_breath_ab.py
      - name: Render A (baseline, no breaths)
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/hydroplaning_breath_a.json 2>&1 | tee a-render.log
          mkdir -p ab
          cp dist/final.mp4 ab/A_baseline.mp4
          cp dist/qa_report.json ab/A_baseline_qa_report.json
          ffmpeg -y -i dist/final.mp4 -vn -acodec pcm_s16le -ar 24000 ab/A_baseline_audio.wav
      - name: Render B (subtle breath)
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          rm -rf build dist
          python -m shorts_studio render examples/hydroplaning_breath_b.json 2>&1 | tee b-render.log
          cp dist/final.mp4 ab/B_subtle_breath.mp4
          cp dist/qa_report.json ab/B_subtle_breath_qa_report.json
          ffmpeg -y -i dist/final.mp4 -vn -acodec pcm_s16le -ar 24000 ab/B_subtle_breath_audio.wav
          # Breath placement metadata from the actual B render (which scenes/gaps got a breath).
          find build -name '*.timing.json' -exec sh -c 'echo "=== {} ==="; python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d.get(\"breaths\", []), ensure_ascii=False))" {}' \; > ab/B_breath_placements.txt
      - name: Compare A vs B (objective acoustic diagnostics)
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          def probe(path):
              out = subprocess.run(["ffmpeg", "-i", str(path)], capture_output=True, text=True).stderr
              m = re.search(r"Duration:\s*(\d+):(\d+):(\d+\.\d+)", out)
              h, mnt, s = m.groups()
              duration = int(h) * 3600 + int(mnt) * 60 + float(s)
              vol = subprocess.run(["ffmpeg", "-i", str(path), "-af", "volumedetect", "-f", "null", "-"],
                                    capture_output=True, text=True).stderr
              mean_m = re.search(r"mean_volume:\s*(-?[\d.]+) dB", vol)
              max_m = re.search(r"max_volume:\s*(-?[\d.]+) dB", vol)
              return {
                  "duration_seconds": duration,
                  "mean_volume_db": float(mean_m.group(1)) if mean_m else None,
                  "max_volume_db": float(max_m.group(1)) if max_m else None,
              }

          a = probe("ab/A_baseline_audio.wav")
          b = probe("ab/B_subtle_breath_audio.wav")
          comparison = {
              "A_baseline": a,
              "B_subtle_breath": b,
              "duration_diff_seconds": round(b["duration_seconds"] - a["duration_seconds"], 3),
              "max_volume_diff_db": (round(b["max_volume_db"] - a["max_volume_db"], 2)
                                      if a["max_volume_db"] is not None and b["max_volume_db"] is not None else None),
          }
          Path("ab/comparison.json").write_text(json.dumps(comparison, indent=2), encoding="utf-8")
          print("===BREATH_AB_COMPARISON_BEGIN===")
          print(json.dumps(comparison, indent=2))
          print("===BREATH_AB_COMPARISON_END===")

          a_qa = json.loads(Path("ab/A_baseline_qa_report.json").read_text())
          b_qa = json.loads(Path("ab/B_subtle_breath_qa_report.json").read_text())
          print("===BREATH_AB_QA_STATUS_BEGIN===")
          print(json.dumps({"A_status": a_qa["status"], "B_status": b_qa["status"]}))
          print("===BREATH_AB_QA_STATUS_END===")
          PY
      - name: Print breath placement metadata
        run: cat ab/B_breath_placements.txt
      - name: Verify neither A nor B regressed any existing gate
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for label, video in (("A_baseline", "ab/A_baseline.mp4"), ("B_subtle_breath", "ab/B_subtle_breath.mp4")):
              q = json.loads(Path(f"ab/{label}_qa_report.json").read_text())
              assert q["status"] == "PASS", (label, q)
              assert q["semantic_visual_qa"]["status"] == "PASS", (label, q["semantic_visual_qa"])
              fv = q["final_video_qa"]
              assert fv["status"] == "PASS", (label, fv)
              checks = fv["checks"]
              for key in ("retention_contract", "first_10s_retention", "meaningful_visual_changes",
                          "visual_production_v2", "visual_activity_real", "visual_cut_cadence",
                          "captions_visible", "safe_area_clean"):
                  assert checks[key]["status"] == "PASS", (label, key, checks[key])
              probe = json.loads(subprocess.run(["ffprobe", "-v", "error", "-of", "json",
                  "-show_entries", "stream=codec_name,width,height,codec_type",
                  "-show_entries", "format=duration", video],
                  capture_output=True, text=True, check=True).stdout)
              vs = next(s for s in probe["streams"] if s.get("width"))
              assert (vs["width"], vs["height"]) == (1080, 1920), (label, vs)
              assert any(s["codec_type"] == "audio" for s in probe["streams"]), (label, "no audio stream")
              print(f"{label}: all existing gates PASS, 1080x1920, audio present, duration={probe['format']['duration']}")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: breath-ab-production
          retention-days: 14
          path: |
            ab/
            examples/hydroplaning_breath_a.json
            examples/hydroplaning_breath_b.json
            hydroplaning-generator.log
            a-render.log
            b-render.log
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: breath-ab-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            ab/
            build/
            dist/
            hydroplaning-generator.log
            a-render.log
            b-render.log
