name: upload-pack-three

on:
  push:
    branches: [content/upload-pack-three]
    paths:
      - 'shorts_studio/**'
      - 'tests/**'
      - 'scripts/build_upload_pack_three.py'
      - '.github/workflows/upload-pack-three.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-three:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render and vision dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'

      - name: Full regression
        run: pytest -q

      - name: Build all three productions
        run: |
          set -o pipefail
          python scripts/build_upload_pack_three.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf 2>&1 | tee upload-pack-generator.log
          grep -q '^UPLOAD_PACK_THREE_READY=3' upload-pack-generator.log

      - name: Validate all manifests and curiosity contracts
        run: |
          for topic in golf_ball_dimples head_restraint elevator_counterweight; do
            python -m shorts_studio validate "examples/$topic.json"
            TOPIC="$topic" python - <<'PY'
          import os
          from shorts_studio.project import load_project
          from shorts_studio.hook_studio import verify_curiosity_maintained
          topic=os.environ["TOPIC"]
          p=load_project(f"examples/{topic}.json")
          result=verify_curiosity_maintained(p)
          assert result["status"]=="PASS",(topic,result)
          assert p.overlay_title_mode=="first_scene_only"
          print(topic,"curiosity PASS",result["evidence"])
          PY
          done

      - name: Render and verify all three upload candidates
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p upload_pack
          for topic in golf_ball_dimples head_restraint elevator_counterweight; do
            rm -rf dist
            set -o pipefail
            python -m shorts_studio render "examples/$topic.json" 2>&1 | tee "$topic-render.log"
            TOPIC="$topic" python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          topic=os.environ["TOPIC"]
          v=Path("dist/final.mp4")
          assert v.is_file() and v.stat().st_size>0
          probe=json.loads(subprocess.run(
              ["ffprobe","-v","error","-of","json",
               "-show_entries","stream=codec_name,width,height",
               "-show_entries","format=duration",str(v)],
              capture_output=True,text=True,check=True).stdout)
          vs=next(s for s in probe["streams"] if "width" in s)
          assert (vs["width"],vs["height"])==(1080,1920),vs
          q=json.loads(Path("dist/qa_report.json").read_text())
          assert q["status"]=="PASS",(topic,q)
          assert q["semantic_visual_qa"]["status"]=="PASS"
          fv=q["final_video_qa"]
          assert fv["status"]=="PASS",(topic,fv)
          for key in ("retention_contract","first_10s_retention","meaningful_visual_changes",
                      "visual_activity_real","title_visible","captions_visible","safe_area_clean"):
              assert fv["checks"][key]["status"]=="PASS",(topic,key,fv["checks"][key])
          out=Path("upload_pack")/topic
          out.mkdir(parents=True,exist_ok=True)
          shutil.copy2(v,out/f"{topic}.mp4")
          shutil.copy2("dist/qa_report.json",out/"qa_report.json")
          shutil.copy2("dist/captions.srt",out/"captions.srt")
          shutil.copy2(f"examples/{topic}_upload_description.txt",out/"upload_description.txt")
          shutil.copy2(f"examples/{topic}_upload_metadata.json",out/"upload_metadata.json")
          print("UPLOAD_CANDIDATE_PASS",topic,"duration",probe["format"]["duration"],
                "events",len(fv["checks"]["meaningful_visual_changes"].get("events",[])),
                "first5",fv["checks"]["meaningful_visual_changes"].get("first_5s_meaningful_changes"),
                "max_static",fv["checks"]["visual_activity_real"]["evidence"]["max_static_visual_seconds"])
          PY
          done

      - name: Extract evenly spaced human-review frames
        run: |
          python - <<'PY'
          import subprocess, json
          from pathlib import Path
          for topic in ("golf_ball_dimples","head_restraint","elevator_counterweight"):
              video=Path("upload_pack")/topic/f"{topic}.mp4"
              duration=float(json.loads(subprocess.run(
                  ["ffprobe","-v","error","-show_entries","format=duration","-of","json",str(video)],
                  capture_output=True,text=True,check=True).stdout)["format"]["duration"])
              frame_dir=Path("upload_pack")/topic/"review_frames"
              frame_dir.mkdir(parents=True,exist_ok=True)
              n=12
              for i in range(n):
                  frac=(i+.5)/n
                  ts=min(duration-.05,max(.05,duration*frac))
                  subprocess.run(["ffmpeg","-y","-ss",str(ts),"-i",str(video),
                                  "-frames:v","1",str(frame_dir/f"f_{i:02d}_{frac:.3f}.jpg")],
                                 check=True,capture_output=True)
          PY

      - name: Dump QA summaries and review thumbnails
        run: |
          python - <<'PY'
          import base64, io, json
          from pathlib import Path
          from PIL import Image
          for topic in ("golf_ball_dimples","head_restraint","elevator_counterweight"):
              q=json.loads((Path("upload_pack")/topic/"qa_report.json").read_text())
              fv=q["final_video_qa"]
              print(f"===UPLOAD_SHORT[{topic}]_QA_BEGIN===")
              print(json.dumps({
                  "status":q["status"],
                  "semantic_visual_qa":q["semantic_visual_qa"]["status"],
                  "final_video_qa":fv["status"],
                  "first_10s_retention":fv["checks"]["first_10s_retention"],
                  "meaningful_events":len(fv["checks"]["meaningful_visual_changes"].get("events",[])),
                  "first_5s_meaningful_changes":fv["checks"]["meaningful_visual_changes"].get("first_5s_meaningful_changes"),
                  "visual_activity":fv["checks"]["visual_activity_real"],
                  "title_policy":fv["checks"]["title_visible"],
              },ensure_ascii=False))
              print(f"===UPLOAD_SHORT[{topic}]_QA_END===")
              for p in sorted((Path("upload_pack")/topic/"review_frames").glob("*.jpg")):
                  img=Image.open(p).convert("RGB")
                  w=340; h=round(img.height*w/img.width)
                  img=img.resize((w,h),Image.LANCZOS)
                  buf=io.BytesIO(); img.save(buf,format="JPEG",quality=50)
                  data=base64.b64encode(buf.getvalue()).decode()
                  print(f"===FRAME[{topic}:{p.stem}]_BEGIN===")
                  for k in range(0,len(data),160): print(data[k:k+160])
                  print(f"===FRAME[{topic}:{p.stem}]_END===")
          PY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: upload-short-01-golf-ball-dimples
          retention-days: 30
          path: upload_pack/golf_ball_dimples/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: upload-short-02-head-restraint
          retention-days: 30
          path: upload_pack/head_restraint/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: upload-short-03-elevator-counterweight
          retention-days: 30
          path: upload_pack/elevator_counterweight/

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: upload-pack-three-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            upload-pack-generator.log
            *-render.log
            dist/
