name: Studio org driver action pilot
on:
  push:
    branches: [fix/studio-org-integration-20261102]
    paths:
      - .github/workflows/studio-org-driver-pilot.yml
      - benchmarks/road_safety/render_driver_insert.py
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-org-driver-pilot
  cancel-in-progress: false
jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        start: [38, 43, 48, 53, 58, 63, 68, 73, 78, 83, 88]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxkbcommon0 libxi6 libxrender1 libgl1
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render only missing native frames, at unchanged production resolution and samples
        timeout-minutes: 11
        run: |
          set -euo pipefail
          end=$(( ${{ matrix.start }} + 4 ))
          if [ "$end" -gt 90 ]; then end=90; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_driver_insert.py -- --start ${{ matrix.start }} --end "$end" --out "$RUNNER_TEMP/driver" 2>&1 | tee "$RUNNER_TEMP/driver-render.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: driver-action-shard-${{ matrix.start }}
          path: |
            ${{ runner.temp }}/driver/
            ${{ runner.temp }}/driver-render.log
          retention-days: 14
  final:
    needs: driver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow opencv-python-headless
      - name: Download the preserved 37 frames and only the 53 newly rendered ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41416805484 --repo "$GITHUB_REPOSITORY" --name studio-org-driver-action-pilot --dir "$RUNNER_TEMP/preserved"
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'driver-action-shard-*' --dir "$RUNNER_TEMP/shards"
      - name: Verify provenance, then merge without frame holds or loops
        run: |
          python benchmarks/road_safety/assemble_driver_pilot.py --preserved "$RUNNER_TEMP/preserved" --shards "$RUNNER_TEMP/shards" --out "$RUNNER_TEMP/complete"
      - name: Encode and verify real pixels on the standard runner
        run: |
          set -euo pipefail
          ffmpeg -v error -framerate 30 -i "$RUNNER_TEMP/complete/%04d.png" -frames:v 90 -c:v ffv1 -level 3 "$RUNNER_TEMP/complete/driver-lossless.mkv"
          ffmpeg -v error -i "$RUNNER_TEMP/complete/driver-lossless.mkv" -c:v libx264 -crf 17 -pix_fmt yuv420p "$RUNNER_TEMP/complete/driver-review.mp4"
          ffmpeg -v error -i "$RUNNER_TEMP/complete/driver-review.mp4" -f null -
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_read_frames -of json "$RUNNER_TEMP/complete/driver-review.mp4" > "$RUNNER_TEMP/complete/ffprobe.json"
          PYTHONPATH="$PWD" python - "$RUNNER_TEMP/complete" <<'PY'
          import json, os, sys
          from pathlib import Path
          from shorts_studio.studio_org.driver_review import record_review
          from shorts_studio.studio_org.ledger import TaskLedger
          root=Path(sys.argv[1])
          ledger=TaskLedger(root/'tasks.json')
          task=ledger.create(department='렌더부',division='동작',
              requirements={'kind':'driver-action-pilot'}, status='running',
              completion_criteria='Actual native frames and lossless integrity only; editorial unverified',
              output={'github_run_id':int(os.environ['GITHUB_RUN_ID'])})
          result=record_review(root,Path('benchmarks/road_safety/render_driver_insert.py'),ledger,task.task_id)
          (root/'pilot-integrity.json').write_text(json.dumps(result,indent=2)+'\n')
          print('DRIVER_PILOT_INTEGRITY '+json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-org-driver-action-native-complete
          path: ${{ runner.temp }}/complete/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-org-driver-action-review
          path: |
            ${{ runner.temp }}/complete/driver-review.mp4
            ${{ runner.temp }}/complete/driver-pilot.json
            ${{ runner.temp }}/complete/pilot-integrity.json
            ${{ runner.temp }}/complete/tasks.json
            ${{ runner.temp }}/complete/ffprobe.json
          retention-days: 14
