name: Verify candidate NIST image URLs (throwaway)
on:
  push:
    branches: [content/radium-girls]
    paths: [.github/workflows/verify-image-urls.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HEAD-check each candidate URL
        run: |
          set -o pipefail
          urls=(
            "https://www.nist.gov/sites/default/files/images/pml/general/curie/electroscope_1.jpg"
            "https://www.nist.gov/sites/default/files/images/2022/04/04/Radium%20Dial%20Painters.png"
            "https://www.nist.gov/sites/default/files/images/2022/04/04/Mary%20Bower.png"
            "https://www.nist.gov/sites/default/files/images/2022/04/04/Elizabeth%20Yung-Kwai.png"
            "https://www.nist.gov/sites/default/files/images/2022/04/20/Constance%20Torrey%20in%20her%20lab%20at%20NBS%20in%201925.%20.jpg"
            "https://www.nist.gov/sites/default/files/images/2022/04/20/electroscope%20that%20Torrey%20would%20have%20used%20from%201928%20-1949%20.JPG"
            "https://www.nist.gov/sites/default/files/images/2022/04/14/Exhibit%20Line-01.png"
          )
          for u in "${urls[@]}"; do
            echo "=== $u ==="
            curl -sS -o /dev/null -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" -L "$u" || echo "CURL FAILED"
          done
