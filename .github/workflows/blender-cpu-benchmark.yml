name: Blender CPU benchmark (isolated PR)

on:
  pull_request:
    paths:
      - '.github/workflows/blender-cpu-benchmark.yml'
      - 'benchmarks/guardrail_blender_scene.py'
      - 'benchmarks/render_guardrail_cpu.py'
      - 'benchmarks/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout isolated benchmark branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch and verify official Blender 5.0.1 x64 (same version as phone)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guardrail/blender"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 180             "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"             -o "$RUNNER_TEMP/guardrail/blender/blender-5.0.1-linux-x64.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/guardrail/blender/blender-5.0.1-linux-x64.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/guardrail/blender/blender-5.0.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/guardrail/blender"
          BLENDER_EXE="$(find "$RUNNER_TEMP/guardrail/blender" -maxdepth 3 -type f -name blender | head -1)"
          test -n "$BLENDER_EXE" && test -x "$BLENDER_EXE"
          echo "BLENDER_EXE=$BLENDER_EXE" >> "$GITHUB_ENV"
          "$BLENDER_EXE" -b -t 4 --python-expr 'import bpy; print("BLENDER_VERSION",bpy.app.version_string)'
          lscpu | grep -E 'Architecture:|Model name:|CPU\\(s\\):' | head -4 || true
          free -h

      - name: Fetch and SHA-check the public-domain CC0 sedan model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guardrail/cc0" "$RUNNER_TEMP/guardrail/output"
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 15 --max-time 100             'https://www.innerscene.com/api/library/sedan-car-42109739/download'             -o "$RUNNER_TEMP/guardrail/cc0/sedan-original.glb"
          echo "4cb896f740de4da871c1d87c4af2b734db3d1e8fac852e308f1fca03a63b25d3  $RUNNER_TEMP/guardrail/cc0/sedan-original.glb" | sha256sum -c -

      - name: Build the identical standalone 3D scene at 38% and 8 Cycles samples
        shell: bash
        env:
          BLENDER_BENCH_OUT: ${{ runner.temp }}/guardrail/output
          BLENDER_BENCH_ASSET: ${{ runner.temp }}/guardrail/cc0/sedan-original.glb
        run: |
          set -euo pipefail
          time "$BLENDER_EXE" -b -t 4 --python benchmarks/guardrail_blender_scene.py -- still 38 8 42
          test -s "$BLENDER_BENCH_OUT/guardrail_3d_lookdev.blend"
          test -s "$BLENDER_BENCH_OUT/frame_0042.png"

      - name: Compare sampled low-res frames and one native 1080p frame
        shell: bash
        env:
          BLENDER_BENCH_OUT: ${{ runner.temp }}/guardrail/output
        run: |
          set -euo pipefail
          time "$BLENDER_EXE" -b "$BLENDER_BENCH_OUT/guardrail_3d_lookdev.blend" -t 4             --python benchmarks/render_guardrail_cpu.py
          test -s "$BLENDER_BENCH_OUT/benchmark.json"
          ls -lh "$BLENDER_BENCH_OUT"/bench_frame* "$BLENDER_BENCH_OUT/benchmark.json"

      - name: Attach measured frames and report (development only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blender-cpu-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/guardrail/output/bench_frame_*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Attach machine-readable performance numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blender-cpu-timings-${{ github.run_id }}
          path: ${{ runner.temp }}/guardrail/output/benchmark.json
          if-no-files-found: warn
          retention-days: 3
