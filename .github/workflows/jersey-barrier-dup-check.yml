name: Jersey barrier duplicate-frame debug (contiguous render + encode check)
# Debug tool: production run 42456615612 and 42464068889 both failed final
# assembly's DUPLICATE_OR_MISSING_FRAMES_IN_FINAL_ENCODE check even after
# adding a small per-frame camera jitter. This renders a short CONTIGUOUS
# block of real production-quality frames from a historically low-motion
# span, encodes them with the same ffmpeg settings assemble_jersey_barrier.py
# uses, and runs the same framemd5 duplicate check locally so the actual
# fix can be verified before spending another full 32-shard production
# cycle on a guess.
on:
  push:
    branches: [road-paint-retroreflective-20261106]
    paths:
      - .github/workflows/jersey-barrier-dup-check.yml
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Download pinned CC0 car scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GITHUB_REPOSITORY" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render two contiguous 20-frame blocks at PRODUCTION quality
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/check/a" "$RUNNER_TEMP/check/b"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/road_safety/render_jersey_barrier.py -- \
            --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" \
            --manifest examples/experiments/jersey-barrier-manifest.json \
            --start 1 --end 20 \
            --out "$RUNNER_TEMP/check/a" 2>&1 | tee "$RUNNER_TEMP/check/a/render.log"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/road_safety/render_jersey_barrier.py -- \
            --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" \
            --manifest examples/experiments/jersey-barrier-manifest.json \
            --start 616 --end 635 \
            --out "$RUNNER_TEMP/check/b" 2>&1 | tee "$RUNNER_TEMP/check/b/render.log"
      - name: Encode each block with the real production ffmpeg settings and check framemd5 duplicates
        run: |
          set -euo pipefail
          for block in a b; do
            dir="$RUNNER_TEMP/check/$block"
            start=$(ls "$dir"/frame_*.png | head -1 | grep -oE '[0-9]{4}' | head -1)
            ffmpeg -v error -framerate 30 -start_number "$start" -i "$dir/frame_%04d.png" \
              -c:v libx264 -preset fast -crf 17 -pix_fmt yuv420p "$dir/test.mp4"
            echo "=== Block $block framemd5 ==="
            ffmpeg -v error -i "$dir/test.mp4" -map 0:v:0 -f framemd5 - > "$dir/hashes.txt"
            total=$(grep -vc '^#' "$dir/hashes.txt" || true)
            unique=$(grep -v '^#' "$dir/hashes.txt" | awk -F',' '{print $NF}' | sort -u | wc -l)
            echo "block=$block total=$total unique=$unique"
            if [ "$total" != "$unique" ]; then
              echo "DUPLICATES FOUND in block $block"
              grep -v '^#' "$dir/hashes.txt" | awk -F',' '{print $NF}' | sort | uniq -d
            fi
          done
