name: Blender 3-way CPU parallel render (isolated PR)

on:
  pull_request:
    paths:
      - '.github/workflows/blender-cpu-parallel-benchmark.yml'
      - 'benchmarks/guardrail_blender_scene.py'
      - 'benchmarks/render_guardrail_chunk.py'
      - 'benchmarks/merge_guardrail_chunks.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-chunks:
    name: Render chunk ${{ matrix.name }} frames ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { name: a, start: 1, end: 30 }
          - { name: b, start: 31, end: 60 }
          - { name: c, start: 61, end: 90 }
    steps:
      - name: Checkout isolated benchmark branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install verified Blender 5.0.1 x64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guardrail/blender"
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 20 --max-time 200 \
            "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz" \
            -o "$RUNNER_TEMP/guardrail/blender/blender-5.0.1-linux-x64.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/guardrail/blender/blender-5.0.1-linux-x64.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/guardrail/blender/blender-5.0.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/guardrail/blender"
          BLENDER_EXE="$(find "$RUNNER_TEMP/guardrail/blender" -maxdepth 3 -type f -name blender | head -1)"
          test -n "$BLENDER_EXE" && test -x "$BLENDER_EXE"
          echo "BLENDER_EXE=$BLENDER_EXE" >> "$GITHUB_ENV"
          "$BLENDER_EXE" -b -t 4 --python-expr 'import bpy; print("BLENDER_VERSION", bpy.app.version_string)'

      - name: Get and SHA-check CC0 sedan asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guardrail/cc0"
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 15 --max-time 100 \
            "https://www.innerscene.com/api/library/sedan-car-42109739/download" \
            -o "$RUNNER_TEMP/guardrail/cc0/sedan-original.glb"
          echo "4cb896f740de4da871c1d87c4af2b734db3d1e8fac852e308f1fca03a63b25d3  $RUNNER_TEMP/guardrail/cc0/sedan-original.glb" | sha256sum -c -

      - name: Generate fixed Blender 3D scene
        shell: bash
        env:
          BLENDER_BENCH_OUT: ${{ runner.temp }}/guardrail/scene
          BLENDER_BENCH_ASSET: ${{ runner.temp }}/guardrail/cc0/sedan-original.glb
        run: |
          set -euo pipefail
          time "$BLENDER_EXE" -b -t 4 --python benchmarks/guardrail_blender_scene.py -- still 38 8 42
          test -s "$BLENDER_BENCH_OUT/guardrail_3d_lookdev.blend"

      - name: Render and time assigned exact 30 frames
        shell: bash
        env:
          CHUNK_NAME: ${{ matrix.name }}
          CHUNK_START: ${{ matrix.start }}
          CHUNK_END: ${{ matrix.end }}
          BLENDER_BENCH_OUT: ${{ runner.temp }}/frames
        run: |
          set -euo pipefail
          time "$BLENDER_EXE" -b "$RUNNER_TEMP/guardrail/scene/guardrail_3d_lookdev.blend" -t 4 \
            --python benchmarks/render_guardrail_chunk.py
          test -s "$BLENDER_BENCH_OUT/report_${CHUNK_NAME}.json"
          test "$(find "$BLENDER_BENCH_OUT" -maxdepth 1 -name 'seq_*.png' | wc -l)" -eq 30

      - name: Upload chunk frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frames-${{ matrix.name }}
          path: ${{ runner.temp }}/frames/seq_*.png
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

      - name: Upload frame timings and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-${{ matrix.name }}
          path: ${{ runner.temp }}/frames/report_${{ matrix.name }}.json
          if-no-files-found: warn
          retention-days: 3

  merge-preview:
    name: Validate 90 frames and combine 3-second MP4
    needs: render-chunks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout validation script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all three frame artifacts (keep separate)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: frames-*
          path: ${{ runner.temp }}/parallel/chunks

      - name: Download all three manifest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: report-*
          path: ${{ runner.temp }}/parallel/chunks

      - name: Verify SHA-256, dimensions, contiguous frames, and chunk timings
        shell: bash
        env:
          CHUNKS_INPUT_DIR: ${{ runner.temp }}/parallel/chunks
          FRAMES_MERGED_DIR: ${{ runner.temp }}/parallel/merged
        run: |
          set -euo pipefail
          python3 benchmarks/merge_guardrail_chunks.py

      - name: Encode and probe silent 3-second draft MP4
        shell: bash
        env:
          FRAMES_MERGED_DIR: ${{ runner.temp }}/parallel/merged
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -framerate 30 -start_number 1 -i "$FRAMES_MERGED_DIR/seq_%04d.png" \
            -frames:v 90 -vf 'scale=1080:1920:flags=lanczos' \
            -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p \
            -movflags +faststart "$RUNNER_TEMP/parallel/guardrail_parallel_3s_silent.mp4"
          ffmpeg -nostdin -v error -i "$RUNNER_TEMP/parallel/guardrail_parallel_3s_silent.mp4" -f null -
          ffprobe -v error -show_entries stream=width,height,nb_frames,r_frame_rate \
            -show_entries format=duration -of json \
            "$RUNNER_TEMP/parallel/guardrail_parallel_3s_silent.mp4" > "$RUNNER_TEMP/parallel/video_probe.json"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'parallel'/'video_probe.json'
          info = json.loads(p.read_text())
          assert len(info['streams']) == 1
          v = info['streams'][0]
          assert (v['width'],v['height']) == (1080, 1920)
          assert v['r_frame_rate'] == '30/1'
          assert int(v['nb_frames']) == 90
          assert abs(float(info['format']['duration']) - 3.0) < .05
          print('PARALLEL_MP4_QA_PASS', info)
          PY

      - name: Upload verified parallel MP4 and timing report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parallel-guardrail-3s-preview
          path: |
            ${{ runner.temp }}/parallel/guardrail_parallel_3s_silent.mp4
            ${{ runner.temp }}/parallel/parallel_summary.json
            ${{ runner.temp }}/parallel/video_probe.json
          if-no-files-found: error
          retention-days: 3
