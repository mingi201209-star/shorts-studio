name: Curious Mechanics B reassemble-only (reuse existing shards, no re-render)
# Re-runs curious_mechanics_progressive_delivery.py's assemble() against the
# ALREADY-RENDERED, already-verified 30 native shards from run 41274189435
# (commit 317707d, itself preflight-verified clip-safe before it ran) --
# downloads them by that fixed run id rather than ${{ github.run_id }}, so
# no new Blender/Cycles render happens here. Only the Python-side
# assembly/QA/semantic step re-runs, picking up a code fix
# (curious_mechanics_delivery.py's semantic() style-resolution) that run
# 41274189435's own "final" job didn't have, without spending another
# ~90 minutes re-rendering frames whose pixels wouldn't change anyway
# (curious_mechanics_native_qa.verify()'s manifest/timeline hash binding
# doesn't cover curious_mechanics_delivery.py, so these shards remain
# fully valid against it).
on:
  push:
    branches: [feat/curious-mechanics-b-causal-shot-20261101]
    paths:
      - ".github/workflows/curious-mechanics-b-reassemble.yml"
      - "benchmarks/road_safety/curious_mechanics_delivery.py"
permissions:
  contents: read
  actions: read
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve the already-rendered native shards (run 41274189435) and the preserved B audio/source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/source"
          gh run download 41274189435 --repo "$GITHUB_REPOSITORY" --pattern 'curious-progressive-B-causal-*' --dir "$RUNNER_TEMP/native"
          gh run download 41191337000 --repo "$GITHUB_REPOSITORY" --name curious-mechanics-causal-revision-B --dir "$RUNNER_TEMP/source"
      - name: Install unchanged observed final QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchvision==0.29.1+cpu
          python -m pip install open-clip-torch==3.3.0 Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Verify every native PNG and lossless clip; assemble the 8-role variant B
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_progressive_delivery.py --native "$RUNNER_TEMP/native" --source "$RUNNER_TEMP/source/B" --variant B --out "$RUNNER_TEMP/final/B"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-progressive-causal-shot-B-reassembled
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 14
