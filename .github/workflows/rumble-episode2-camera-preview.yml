name: Rumble episode 2 camera preview (fast, low-cost visual check)
# Runs automatically whenever camera_layout()/the episode timeline changes.
# Renders the first frame of each of the 6 shots at preview quality (7
# samples, 450x800 -- not production quality, and not a QA gate on its own)
# so a human can eyeball framing problems like the tire_contact black-void
# this project only caught via a full-quality shard after pushing (PR #69).
# Minutes, not the ~75-minute full native matrix. Uploads PNGs for review;
# never writes to production state, never a substitute for the real
# native-original-2-frame proof that still runs on every push.
on:
  pull_request:
    paths:
      - "shorts_studio/factory/rumble_episode2.py"
      - "examples/factory/rumble-episode2-30s.json"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          python -m pip install Pillow
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render the first frame of each shot at preview quality
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preview"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_rumble_episode2.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/factory/rumble-episode2-30s.json --preview --frame-list 1,151,301,451,601,751 --out "$RUNNER_TEMP/preview"
      - name: Sanity-check the six preview frames (not a production QA gate)
        run: |
          python -c "
          from pathlib import Path
          from PIL import Image
          out = Path('$RUNNER_TEMP/preview')
          frames = sorted(out.glob('frame_*.png'))
          assert len(frames) == 6, f'expected 6 preview frames, got {len(frames)}'
          for path in frames:
              with Image.open(path) as picture:
                  picture.load()
                  assert picture.size == (450, 800), (path.name, picture.size)
          print('6/6 preview frames present at the expected preview resolution')
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rumble-episode2-camera-preview
          path: ${{ runner.temp }}/preview/frame_*.png
          if-no-files-found: error
          retention-days: 14
