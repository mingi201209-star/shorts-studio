name: Guardrail complete 30-second film (draft review)
on:
  pull_request:
    paths:
      - ".github/workflows/guardrail-film.yml"
      - "benchmarks/guardrail_film/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Obtain exact audited scene
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/39100332936 --jq .head_sha)" = cbd575cf598dd71f786a6b2a65838de22b0350c5
          for attempt in $(seq 1 45); do
            if gh run download 39100332936 -n guardrail-motion-scene-graphite -D "$RUNNER_TEMP/scene"; then break; fi
            sleep 20
          done
          python3 - <<'CHECK'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'scene'
          assert (p/'guardrail_v2_local.blend').stat().st_size>100000
          r=json.loads((p/'motion_validation.json').read_text())
          assert r['status']=='PASS' and not r['errors'] and r['frames_checked']==90,r
          r=json.loads((p/'v2_validation.json').read_text())
          assert r['camera_static'] and r['native_resolution']==[1080,1920] and r['samples']>=16,r
          assert r['projected_delta_px']>=40 and r['world_deflection_m']>=.35,r
          assert all(-.025<=r['car_rail_contact_gap_m'][str(f)]<=.03 for f in (22,40)),r
          CHECK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: film-audited-scene
          path: ${{ runner.temp }}/scene/
          retention-days: 1

  narration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -e .
      - name: Existing Korean speech planner and provider-timed subtitles
        env:
          FILM_OUT: ${{ runner.temp }}/narration
        run: python3 benchmarks/guardrail_film/assemble.py speech
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: film-narration
          path: ${{ runner.temp }}/narration/
          retention-days: 1

  footage:
    needs: scene
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        start: [91, 121, 151, 181, 211, 241, 271, 301, 331, 361, 391, 421, 451, 481, 511, 541, 571, 601, 631, 661, 691, 721, 751, 781, 811, 841, 871]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: film-audited-scene
          path: ${{ runner.temp }}/scene
      - name: Install pinned Blender and encoder
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Render and encode 30 native frames
        env:
          FILM_OUT: ${{ runner.temp }}/footage
          FILM_START: ${{ matrix.start }}
        run: |
          export FILM_END=$((FILM_START+29))
          "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 "$RUNNER_TEMP/scene/guardrail_v2_local.blend" --python-exit-code 1 --python benchmarks/guardrail_film/render_shard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: film-footage-${{ matrix.start }}
          path: |
            ${{ runner.temp }}/footage/chunk_*.mp4
            ${{ runner.temp }}/footage/shard_*.json
            ${{ runner.temp }}/footage/review_*.png
          retention-days: 1

  assemble:
    needs: [footage, narration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: film-footage-*
          merge-multiple: true
          path: ${{ runner.temp }}/film/chunks
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: film-narration
          path: ${{ runner.temp }}/film
      - name: Download the complete audited native opening
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 39100332936 -n guardrail-motion-review -D "$RUNNER_TEMP/film/base"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Assemble all six shots, narration and subtitles; audit 900 native frames
        env:
          FILM_OUT: ${{ runner.temp }}/film
        run: python3 benchmarks/guardrail_film/assemble.py assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardrail-complete-film-review
          path: |
            ${{ runner.temp }}/film/guardrail-full-30s-1080p.mp4
            ${{ runner.temp }}/film/captions.srt
            ${{ runner.temp }}/film/film.ass
            ${{ runner.temp }}/film/film_validation.json
            ${{ runner.temp }}/film/narration_validation.json
            ${{ runner.temp }}/film/film_review_*.jpg
          retention-days: 3
