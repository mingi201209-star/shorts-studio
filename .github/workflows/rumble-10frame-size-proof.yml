name: Episode 2 ten native frames - measured storage proof (no artifact upload)
on:
  push:
    branches: [research/rumble-10frame-size-proof-20261023]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Blender and existing QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch hash-pinned original CC0 scene
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 10 original contiguous 1080x1920 Cycles32 frames
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          sha256sum benchmarks/road_safety/render_rumble_episode2.py shorts_studio/factory/rumble_episode2.py examples/factory/rumble-episode2-30s.json
          /usr/bin/time -f 'RENDER_WALL_SECONDS=%e\nRENDER_PEAK_RSS_KB=%M' xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_rumble_episode2.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/factory/rumble-episode2-30s.json --start 121 --end 130 --out "$RUNNER_TEMP/rumble"
      - name: Existing native QA plus FFV1 lossless byte-size measurement
        run: |
          set -euo pipefail
          /usr/bin/time -f 'LOSSLESS_SHARD_QA_WALL_SECONDS=%e' env PYTHONPATH="$PWD" python benchmarks/road_safety/episode2_film.py shard --out "$RUNNER_TEMP/rumble"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"rumble"
          proof=json.loads((p/"episode-proof.json").read_text())
          frames=sorted(p.glob("frame_*.png"))
          assert len(frames)==10 and proof["first_frame"]==121 and proof["last_frame"]==130
          assert proof["native_qa"]["status"]=="PASS_NATIVE_ORIGINAL_SHARD"
          assert proof["renderer"]=="CYCLES" and proof["cycles_samples"]==32
          assert proof["resolution"]==[1080,1920] and not proof["preview_only"]
          clip=p/"native-lossless.mkv"
          sizes=[f.stat().st_size for f in frames]
          print("MEASURED_FRAME_SIZE_BYTES", json.dumps(sizes))
          print("MEASURED_TOTAL_PNG_BYTES",sum(sizes))
          print("MEASURED_10FRAME_FFV1_BYTES",clip.stat().st_size)
          print("MEASURED_FFV1_BYTES_PER_FRAME",round(clip.stat().st_size/10))
          print("MEASURED_RENDER_SUM_SECONDS",round(sum(proof["render_seconds"]),3))
          print("FRAME_IDENTITY",proof["renderer_source_sha256"],proof["source_sha256"])
          print("PROBE_ONLY_NO_900FRAME_DISPATCH_NO_ARTIFACT_UPLOAD")
          PY
      - name: Confirm ephemeral-only storage lifecycle
        if: always()
        run: |
          echo 'Probe does not upload any Actions artifacts and uses only GitHub runner ephemeral disk.'
          echo 'No external GPU, R2 bucket, Android storage, or paid service was provisioned.'
