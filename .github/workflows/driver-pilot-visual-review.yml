name: Driver pilot visual review (read-only, base64-in-log)
# Read-only: downloads the already-completed, already-integrity-verified
# 90-frame silent driver-action pilot (run 41424164628,
# studio-org-driver-action-native-complete, driver-review.mp4
# sha256 7d376c215154e6e540be650b381dc5ba1cd332a93ef772c214e0939a3c0d630f)
# and prints base64 JPEG stills across the full 3.0s at 0.1s resolution,
# since artifact ZIP downloads are blocked in this sandbox. Renders nothing
# new; does not touch any file the production/driver-pilot workflows own.
on:
  push:
    branches: [review/driver-pilot-visual-check-20261105]
    paths:
      - ".github/workflows/driver-pilot-visual-review.yml"
      - "benchmarks/road_safety/extract_video_timestamps_b64.py"
      - "benchmarks/road_safety/diff_video_frames.py"
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install Pillow
      - name: Download the already-completed driver pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/driver"
          gh run download 41424164628 --repo "$GITHUB_REPOSITORY" --name studio-org-driver-action-native-complete --dir "$RUNNER_TEMP/driver"
          find "$RUNNER_TEMP/driver" -iname '*.mp4'
          sha256sum "$RUNNER_TEMP/driver/driver-review.mp4"
      - name: Full 3.0s at 0.1s resolution (30 stills)
        run: |
          set -euo pipefail
          python benchmarks/road_safety/extract_video_timestamps_b64.py --video "$RUNNER_TEMP/driver/driver-review.mp4" --label T --timestamps 0.03 0.13 0.23 0.33 0.43 0.53 0.63 0.73 0.83 0.93 1.03 1.13 1.23 1.33 1.43 1.53 1.63 1.73 1.83 1.93 2.03 2.13 2.23 2.33 2.43 2.53 2.63 2.73 2.83 2.93 --width 1080
      - name: Rigorous per-frame pixel-diff check (all 90 frames vs frame 1, no seeking)
        run: |
          set -euo pipefail
          python benchmarks/road_safety/diff_video_frames.py --video "$RUNNER_TEMP/driver/driver-review.mp4" --out "$RUNNER_TEMP/diffcheck"
      - name: Print exact-index key frames as base64 (frame 1/21/27/40/51/73/90, no seek ambiguity)
        run: |
          set -euo pipefail
          for n in 0001 0021 0027 0040 0051 0073 0090; do
            ffmpeg -v error -y -i "$RUNNER_TEMP/diffcheck/f_$n.png" -vf scale=720:-1 -q:v 3 "$RUNNER_TEMP/exact_$n.jpg"
            echo "FRAME_B64_START exact_$n"
            python -c "import base64; print(base64.b64encode(open('$RUNNER_TEMP/exact_$n.jpg','rb').read()).decode())"
            echo "FRAME_B64_END exact_$n"
          done
