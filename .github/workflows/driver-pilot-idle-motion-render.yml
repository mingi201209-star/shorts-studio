name: Driver pilot idle-motion fix (fresh 90-frame render)
# Minimal-scope fix for the confirmed static-hold finding (see
# driver-pilot-visual-review.yml runs 42025813239/42026275761/42027270884):
# render_driver_insert.py now adds continuous breathing + three blinks
# inside the three previously fully-static windows (frames 1-20, 32-50,
# 73-90), without touching the already-correct notice/turn reaction timing
# or the camera framing. Because the motion changed for every frame, this
# is a from-scratch render -- it does not and must not reuse the preserved
# partial inventory from run 41416805484 (assemble_driver_pilot.assemble()'s
# own safety assertion would refuse that reuse for exactly this reason), so
# a separate merge script collects a single-generation 90-frame sequence.
on:
  push:
    branches: [review/driver-pilot-visual-check-20261105]
    paths:
      - .github/workflows/driver-pilot-idle-motion-render.yml
      - benchmarks/road_safety/render_driver_insert.py
      - benchmarks/road_safety/assemble_driver_idle_motion_pilot.py
permissions:
  contents: read
  actions: read
concurrency:
  group: driver-pilot-idle-motion-render
  cancel-in-progress: false
jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        start: [1, 6, 11, 16, 21, 26, 31, 36, 41, 46, 51, 56, 61, 66, 71, 76, 81, 86]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxkbcommon0 libxi6 libxrender1 libgl1
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render this shard at unchanged production resolution and samples
        timeout-minutes: 11
        run: |
          set -euo pipefail
          end=$(( ${{ matrix.start }} + 4 ))
          if [ "$end" -gt 90 ]; then end=90; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_driver_insert.py -- --start ${{ matrix.start }} --end "$end" --out "$RUNNER_TEMP/driver" 2>&1 | tee "$RUNNER_TEMP/driver-render.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: idle-motion-shard-${{ matrix.start }}
          path: |
            ${{ runner.temp }}/driver/
            ${{ runner.temp }}/driver-render.log
          retention-days: 14
  final:
    needs: driver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow opencv-python-headless
      - name: Download all 18 shards from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'idle-motion-shard-*' --dir "$RUNNER_TEMP/shards"
      - name: Merge the 18 shards into one 90-frame sequence (single renderer generation, no reuse)
        run: |
          python benchmarks/road_safety/assemble_driver_idle_motion_pilot.py --shards "$RUNNER_TEMP/shards" --out "$RUNNER_TEMP/complete"
      - name: Encode and verify real pixels on the standard runner
        run: |
          set -euo pipefail
          ffmpeg -v error -framerate 30 -i "$RUNNER_TEMP/complete/%04d.png" -frames:v 90 -c:v ffv1 -level 3 "$RUNNER_TEMP/complete/driver-lossless.mkv"
          ffmpeg -v error -i "$RUNNER_TEMP/complete/driver-lossless.mkv" -c:v libx264 -crf 17 -pix_fmt yuv420p "$RUNNER_TEMP/complete/driver-review.mp4"
          ffmpeg -v error -i "$RUNNER_TEMP/complete/driver-review.mp4" -f null -
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_read_frames -of json "$RUNNER_TEMP/complete/driver-review.mp4" > "$RUNNER_TEMP/complete/ffprobe.json"
          sha256sum "$RUNNER_TEMP/complete/driver-review.mp4"
      - name: Run the existing 평가부 technical-QA integrity check (same function as production)
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python - "$RUNNER_TEMP/complete" <<'PY'
          import json, os, sys
          from pathlib import Path
          from shorts_studio.studio_org.driver_review import record_review
          from shorts_studio.studio_org.ledger import TaskLedger
          root=Path(sys.argv[1])
          ledger=TaskLedger(root/'tasks.json')
          task=ledger.create(department='렌더부',division='동작',
              requirements={'kind':'driver-action-pilot'}, status='running',
              completion_criteria='Actual native frames and lossless integrity only; editorial unverified',
              output={'github_run_id':int(os.environ['GITHUB_RUN_ID'])})
          result=record_review(root,Path('benchmarks/road_safety/render_driver_insert.py'),ledger,task.task_id)
          (root/'pilot-integrity.json').write_text(json.dumps(result,indent=2)+'\n')
          print('DRIVER_PILOT_IDLE_MOTION_INTEGRITY '+json.dumps(result))
          PY
      - name: Rigorous per-frame pixel-diff check to confirm the static windows now show motion
        run: |
          set -euo pipefail
          python benchmarks/road_safety/diff_video_frames.py --video "$RUNNER_TEMP/complete/driver-review.mp4" --out "$RUNNER_TEMP/diffcheck"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-org-driver-idle-motion-complete
          path: ${{ runner.temp }}/complete/
          retention-days: 14
