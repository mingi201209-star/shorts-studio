name: Driver cut B with idle-motion-fixed pilot (reuse approved native shards)
# Re-runs benchmarks/road_safety/assemble_driver_cut.py -- the SAME, already
# production-proven narration-matched splice (shorts_studio/studio_org/
# driver_cut.py's frame_map) that run 41430756777 already used successfully
# for variant B (PROGRESSIVE_FILM_PASS B 9e467cab...) -- but with --driver
# pointed at run 42028852096 (the idle-motion-fixed 90-frame pilot from this
# branch) instead of the old run 41424164628. Native/source downloads are
# the exact same already-rendered, already-approved assets studio-org-
# driver-cut.yml and studio-org-film.yml reuse; nothing new is rendered
# here except the Python-side splice + encode + real semantic QA.
on:
  push:
    branches: [review/driver-pilot-visual-check-20261105]
    paths:
      - .github/workflows/driver-cut-idle-motion-b.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: driver-cut-idle-motion-b
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchvision==0.29.1+cpu
          python -m pip install open-clip-torch==3.3.0 Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Download already verified native sources and the idle-motion-fixed pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41274189435 --repo "$GITHUB_REPOSITORY" --pattern 'curious-progressive-B-causal-*' --dir "$RUNNER_TEMP/native"
          gh run download 41298025251 --repo "$GITHUB_REPOSITORY" --pattern 'curious-progressive-B-causal-*' --dir "$RUNNER_TEMP/steered"
          gh run download 41191337000 --repo "$GITHUB_REPOSITORY" --name curious-mechanics-causal-revision-B --dir "$RUNNER_TEMP/source"
          gh run download 42028852096 --repo "$GITHUB_REPOSITORY" --name studio-org-driver-idle-motion-complete --dir "$RUNNER_TEMP/driver"
      - name: Replace only the five steered shards
        run: |
          set -euo pipefail
          for start in 751 781 811 841 871; do
            find "$RUNNER_TEMP/native" -type d -name "curious-progressive-B-causal-$start" -prune -exec rm -rf {} +
          done
          cp -a "$RUNNER_TEMP/steered"/. "$RUNNER_TEMP/native"/
      - name: Assemble narration-matched edit and run full QA
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          PYTHONPATH="$PWD" python benchmarks/road_safety/assemble_driver_cut.py \
            --native "$RUNNER_TEMP/native" \
            --source "$RUNNER_TEMP/source/B" \
            --driver "$RUNNER_TEMP/driver" \
            --out "$RUNNER_TEMP/out" \
            --variant B
          sha256sum "$RUNNER_TEMP/out/curious-mechanics-B-driver-cut.mp4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: driver-cut-idle-motion-B
          path: |
            ${{ runner.temp }}/out/curious-mechanics-B-driver-cut.mp4
            ${{ runner.temp }}/out/film-validation.json
            ${{ runner.temp }}/out/edit-receipt.json
            ${{ runner.temp }}/out/semantic-results.json
            ${{ runner.temp }}/out/human-semantic-results.json
            ${{ runner.temp }}/out/human-semantic-*.png
          retention-days: 14
