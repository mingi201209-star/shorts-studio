name: hydroplaning-render

on:
  push:
    branches: [feat/hydroplaning-3d]
    paths:
      - 'shorts_studio/**'
      - 'tests/**'
      - 'scripts/build_hydroplaning_states.py'
      - '.github/workflows/hydroplaning-render.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render and vision dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'

      - name: Full regression
        run: pytest -q

      - name: Build hydroplaning production
        run: |
          set -o pipefail
          python scripts/build_hydroplaning_states.py 2>&1 | tee hydro-generator.log

      - name: Verify fixed camera and motion assets
        run: |
          grep -q '^HYDRO_CAMERA_OPTIMIZED=' hydro-generator.log
          grep -q '^HYDRO_REAL_PHOTO_READY=' hydro-generator.log
          grep -q '^HYDRO_MANIFEST_READY=' hydro-generator.log
          test -s assets/hydroplaning/wet_road.jpg
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from shorts_studio.hydro3d import KINDS, OPTIMAL_HYDRO_CAMERA, camera_for

          minimum_duration = {
              "hero_contact": 4.1,
              "water_wedge": 4.5,
              "contact_shrink": 4.5,
              "full_hydroplane": 4.5,
              "drainage_channels": 4.5,
              "speed_ramp": 4.7,
              "pressure_lift": 4.5,
              "wedge_closeup": 4.5,
              "steering_loss": 4.5,
              "braking_loss": 4.5,
              "recover_contact": 4.7,
              "final_cutaway": 4.7,
              "final_drive": 4.7,
          }

          assert set(minimum_duration) == set(KINDS)
          for kind in KINDS:
              for t in (0.0, 0.25, 0.5, 0.75, 1.0):
                  assert camera_for(kind, t) == OPTIMAL_HYDRO_CAMERA
              p = Path(f"assets/hydroplaning/{kind}_3d_motion.mp4")
              assert p.is_file() and p.stat().st_size > 10_000, p
              probe = json.loads(subprocess.run([
                  "ffprobe","-v","error","-select_streams","v:0",
                  "-show_entries","stream=codec_name,width,height,r_frame_rate",
                  "-show_entries","format=duration","-of","json",str(p)
              ], capture_output=True, text=True, check=True).stdout)
              stream = probe["streams"][0]
              assert (stream["width"], stream["height"]) == (980, 950), (p, stream)
              duration = float(probe["format"]["duration"])
              assert duration >= minimum_duration[kind], (p, duration, minimum_duration[kind])

          print("HYDRO_CAMERA_AND_MOTION_PASS", OPTIMAL_HYDRO_CAMERA, len(KINDS))
          PY

      - name: Validate manifest
        run: python -m shorts_studio validate examples/hydroplaning.json

      - name: Render hydroplaning short
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/hydroplaning.json 2>&1 | tee hydro-render.log

      - name: Verify final deliverable
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = Path("dist/final.mp4")
          assert video.is_file() and video.stat().st_size > 0
          probe = json.loads(subprocess.run([
              "ffprobe","-v","error","-of","json",
              "-show_entries","stream=codec_name,width,height",
              "-show_entries","format=duration",str(video)
          ], capture_output=True, text=True, check=True).stdout)
          stream = next(s for s in probe["streams"] if "width" in s)
          assert (stream["width"], stream["height"]) == (1080, 1920), stream

          q = json.loads(Path("dist/qa_report.json").read_text())
          assert q["status"] == "PASS", q
          assert q["semantic_visual_qa"]["status"] == "PASS", q["semantic_visual_qa"]
          fv = q["final_video_qa"]
          assert fv["status"] == "PASS", fv
          checks = fv["checks"]
          for key in (
              "retention_contract",
              "first_10s_retention",
              "meaningful_visual_changes",
              "visual_production_v2",
              "visual_activity_real",
              "safe_area_clean",
          ):
              assert checks[key]["status"] == "PASS", (key, checks[key])
          print("HYDRO_FINAL_PASS", probe["format"]["duration"])
          PY

      - name: Sample review frames
        if: success()
        run: |
          mkdir -p review_frames
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 dist/final.mp4)
          export HYDRO_DURATION="$duration"
          python - <<'PY'
          import os
          import subprocess

          duration = float(os.environ["HYDRO_DURATION"])
          n = 12
          for i in range(n):
              frac = (i + 0.5) / n
              t = max(0.0, min(duration - 0.05, frac * duration))
              label = f"{frac:.3f}"
              subprocess.run([
                  "ffmpeg","-y","-ss",str(t),"-i","dist/final.mp4",
                  "-frames:v","1",f"review_frames/f_{label}.jpg"
              ], check=True, capture_output=True)
          PY

      - name: Dump QA summary
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path("dist/qa_report.json").read_text())
          fv = q["final_video_qa"]
          print("===HYDRO_QA_BEGIN===")
          print(json.dumps({
              "status": q["status"],
              "semantic_visual_qa": q["semantic_visual_qa"]["status"],
              "final_video_qa": fv["status"],
              "visual_activity": fv["checks"]["visual_activity_real"],
              "meaningful_visual_changes": fv["checks"]["meaningful_visual_changes"],
              "visual_production_v2": fv["checks"]["visual_production_v2"],
          }, ensure_ascii=False))
          print("===HYDRO_QA_END===")
          PY

      - name: Dump review frames into job log
        if: success()
        run: |
          python - <<'PY'
          import base64
          import io
          from pathlib import Path
          from PIL import Image

          def dump(label, img):
              img = img.convert("RGB")
              w = 420
              h = round(img.height * w / img.width)
              img = img.resize((w, h), Image.Resampling.LANCZOS)
              buf = io.BytesIO()
              img.save(buf, format="JPEG", quality=60)
              data = base64.b64encode(buf.getvalue()).decode()
              print(f"===FRAME[{label}]_BEGIN===")
              for i in range(0, len(data), 160):
                  print(data[i:i+160])
              print(f"===FRAME[{label}]_END===")

          for p in sorted(Path("review_frames").glob("*.jpg")):
              dump(p.stem, Image.open(p))
          PY

      - name: Prepare upload description
        if: success()
        run: cp examples/hydroplaning_upload_description.txt dist/upload-description.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hydroplaning-production
          retention-days: 30
          path: |
            dist/
            review_frames/
            hydro-generator.log
            hydro-render.log
            examples/hydroplaning_upload_description.txt

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: hydroplaning-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/
            hydro-generator.log
            hydro-render.log
