name: Curious Mechanics selective recovery

on:
  pull_request:
    types: [labeled]
    branches:
      - exp/episode2-autonomous-pilot-20261026
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed pilot run with preserved opening shards
        required: true
        type: string
        default: "44499589013"

permissions:
  contents: read
  actions: read

concurrency:
  group: curious-mechanics-selective-recovery
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: ${{ inputs.source_run_id || '44499589013' }}
  BLENDER_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
  RENDERER_SOURCE_SHA256: e6f3da8e73bbcecc54454b4d3a7407d4e7949ac93689a49eb289f123772dd797
  SCENE_SHA256: a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'curious-mechanics-recover' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify source run and preserved opening artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::source_run_id must be numeric"; exit 1; }
          status=$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
          [[ "$status" == "completed" ]] || { echo "::error::Source run is not completed"; exit 1; }
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
          expected=(curious-native-A-1 curious-native-A-2 curious-native-A-3 curious-native-B-1 curious-native-B-2 curious-native-B-3 curious-native-C-1 curious-native-C-3)
          for name in "${expected[@]}"; do
            grep -Fqx "$name" <<< "$names" || { echo "::error::Missing source artifact: $name"; exit 1; }
          done
          echo "Source run $SOURCE_RUN_ID completed; eight opening shards available and unexpired."

  native:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'curious-mechanics-recover' }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: C
            shard: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Blender and QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg fonts-dejavu-core
          python -m pip install Pillow pydantic
          archive="$RUNNER_TEMP/blender.tar.xz"
          downloaded=0
          urls=(
            "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
            "https://mirrors.aliyun.com/blender/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
            "https://mirror.nju.edu.cn/blender/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
            "https://mirror.freedif.org/blender/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
          )
          for url in "${urls[@]}"; do
            echo "Trying Blender 5.0.1 source: $url"
            if curl -fLsS --retry 1 --max-time 240 "$url" -o "$archive"; then
              if echo "$BLENDER_SHA256  $archive" | sha256sum -c -; then
                downloaded=1
                break
              fi
            fi
            rm -f "$archive"
          done
          if [[ "$downloaded" != "1" ]]; then
            echo "::error::All Blender 5.0.1 mirrors failed or had a hash mismatch."
            exit 1
          fi
          tar -xJf "$archive" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GITHUB_REPOSITORY" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "$SCENE_SHA256  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Resolve C shard 2 frame range
        id: range
        run: |
          set -euo pipefail
          read -r start end < <(python benchmarks/road_safety/curious_mechanics_github_parallel.py range --shard 2)
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"
      - name: Render only the failed C opening shard
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-C.json --start ${{ steps.range.outputs.start }} --end ${{ steps.range.outputs.end }} --out "$RUNNER_TEMP/rumble" 2>&1 | tee "$RUNNER_TEMP/rumble/render.log"
      - name: Native QA and lossless clip
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_shard_artifact.py --out "$RUNNER_TEMP/rumble" --manifest examples/experiments/curious-mechanics-C.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-native-C-2-recovery
          path: ${{ runner.temp }}/rumble/
          if-no-files-found: error
          retention-days: 90

  contact:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'curious-mechanics-recover' }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [A, B, C]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Blender and QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg fonts-dejavu-core
          python -m pip install Pillow pydantic
          archive="$RUNNER_TEMP/blender.tar.xz"
          downloaded=0
          urls=(
            "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
            "https://mirrors.aliyun.com/blender/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
            "https://mirror.nju.edu.cn/blender/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
            "https://mirror.freedif.org/blender/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
          )
          for url in "${urls[@]}"; do
            echo "Trying Blender 5.0.1 source: $url"
            if curl -fLsS --retry 1 --max-time 240 "$url" -o "$archive"; then
              if echo "$BLENDER_SHA256  $archive" | sha256sum -c -; then
                downloaded=1
                break
              fi
            fi
            rm -f "$archive"
          done
          if [[ "$downloaded" != "1" ]]; then
            echo "::error::All Blender 5.0.1 mirrors failed or had a hash mismatch."
            exit 1
          fi
          tar -xJf "$archive" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GITHUB_REPOSITORY" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "$SCENE_SHA256  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Resolve contact shard
        id: range
        run: |
          set -euo pipefail
          read -r start end < <(PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_github_parallel.py contact --variant "${{ matrix.variant }}")
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"
      - name: Render contact shard only
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-${{ matrix.variant }}.json --start ${{ steps.range.outputs.start }} --end ${{ steps.range.outputs.end }} --out "$RUNNER_TEMP/rumble" 2>&1 | tee "$RUNNER_TEMP/rumble/render.log"
      - name: Native QA and lossless clip
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_shard_artifact.py --out "$RUNNER_TEMP/rumble" --manifest examples/experiments/curious-mechanics-${{ matrix.variant }}.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-contact-${{ matrix.variant }}-recovery
          path: ${{ runner.temp }}/rumble/
          if-no-files-found: error
          retention-days: 90

  pilot-preview:
    needs: [preflight, native, contact]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'curious-mechanics-recover') && needs.preflight.result == 'success' && needs.native.result == 'success' && needs.contact.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [A, B, C]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install preview dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install Pillow pydantic
      - name: Download preserved opening shards and recovery outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "curious-native-${{ matrix.variant }}-*" --dir "$RUNNER_TEMP/native"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "curious-contact-${{ matrix.variant }}-recovery" --dir "$RUNNER_TEMP/contact"
          if [[ "${{ matrix.variant }}" == "C" ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name curious-native-C-2-recovery --dir "$RUNNER_TEMP/native"
          fi
      - name: Build verified opening and contact preview
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_github_parallel.py pilot --native-root "$RUNNER_TEMP/native" --contact-root "$RUNNER_TEMP/contact" --variant "${{ matrix.variant }}" --out "$RUNNER_TEMP/pilot"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-review-${{ matrix.variant }}-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot/
          if-no-files-found: error
          retention-days: 90
