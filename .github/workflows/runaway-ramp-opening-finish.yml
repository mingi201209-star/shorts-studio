name: Runaway truck ramp opening - finish (re-render the frames cut off by the 90-minute limit, then encode)
# Run 43613410543 rendered 7 of 10 shards completely; shards 91, 121 and 211 hit the 90-minute step limit near their last
# frames. This re-renders only the last frames of those shards (conservatively, overlapping the frames that may have been
# cut off), copies them over the first run's frames and encodes the opening. Free standard runners, no narration, no
# upload. Starts only when the request file below changes.
on:
  push:
    branches: [road-ramp-captions-camera-20261114]
    paths:
      - examples/experiments/runaway-ramp-opening-finish-request.json
      - .github/workflows/runaway-ramp-opening-finish.yml
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
  BASE_RUN_ID: "43613410543"
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {start: 119, end: 120}
          - {start: 147, end: 150}
          - {start: 236, end: 240}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          # official site first, then public mirrors: some runners get a persistent 403 from download.blender.org.
          # Whatever the source, the pinned SHA-256 below decides whether the file is accepted.
          got=0
          for base in https://download.blender.org/release https://ftp.nluug.nl/pub/graphics/blender/release \
                      https://mirror.clarkson.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release; do
            rm -f "$RUNNER_TEMP/blender.tar.xz"
            if curl -fLsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 280 "$base/Blender5.0/blender-5.0.1-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz" \
               && echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -; then
              echo "Blender downloaded from $base"; got=1; break
            fi
            echo "download from $base failed or did not match the pinned hash; trying the next source"
          done
          test "$got" = 1
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Download pinned CC0 car scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GITHUB_REPOSITORY" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 30 contiguous absolute frames
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          end=${{ matrix.end }}
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/road_safety/render_runaway_ramp.py -- \
            --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" \
            --manifest examples/experiments/runaway-ramp-manifest.json \
            --start ${{ matrix.start }} --end "$end" \
            --out "$RUNNER_TEMP/native" 2>&1 | tee "$RUNNER_TEMP/native/render.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runaway-ramp-opening-patch-${{ matrix.start }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 3

  encode:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: runaway-ramp-opening-*
          path: ${{ runner.temp }}/base
          merge-multiple: true
          run-id: ${{ env.BASE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: runaway-ramp-opening-patch-*
          path: ${{ runner.temp }}/patch
          merge-multiple: true
      - name: Overlay the patched frames, encode the graded opening and print it
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -f base/_hud_frame_*.png patch/_hud_frame_*.png
          ls patch/frame_*.png
          cp patch/frame_*.png base/
          cd base
          test "$(ls frame_*.png | wc -l)" = 285
          sha256sum frame_*.png > "$RUNNER_TEMP/frames.sha256"
          sha256sum "$RUNNER_TEMP/frames.sha256"
          GRADE=$(PYTHONPATH="$GITHUB_WORKSPACE" python3 -c "from benchmarks.road_safety import cinematic; print(cinematic.GRADE_FILTER)")
          ffmpeg -v error -framerate 30 -i frame_%04d.png -vf "$GRADE,drawbox=x=0:y=1400:w=1080:h=520:color=black:t=fill" \
            -c:v libx264 -preset fast -crf 17 -pix_fmt yuv420p -movflags +faststart "$RUNNER_TEMP/opening.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of csv=p=0 "$RUNNER_TEMP/opening.mp4"
          sha256sum "$RUNNER_TEMP/opening.mp4"
          echo "MP4_B64_START opening.mp4"
          base64 -w 0 "$RUNNER_TEMP/opening.mp4"
          echo
          echo "MP4_B64_END opening.mp4"
