name: Guardrail English review (reuse native footage)
on:
  pull_request:
    paths:
      - ".github/workflows/guardrail-english.yml"
      - "benchmarks/guardrail_english/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  english-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -e .
      - name: Reuse exact audited footage without Blender
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/39101075134 --jq .head_sha)" = c19904ab5650993bee3d19613ebab25e81f4e844
          test "$(gh api repos/$GH_REPO/actions/runs/39101075134 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/39100332936 --jq .head_sha)" = cbd575cf598dd71f786a6b2a65838de22b0350c5
          mkdir -p "$RUNNER_TEMP/english/chunks" "$RUNNER_TEMP/english/base"
          gh run download 39101075134 --pattern 'film-footage-*' --dir "$RUNNER_TEMP/english/downloads"
          find "$RUNNER_TEMP/english/downloads" -type f -exec cp {} "$RUNNER_TEMP/english/chunks/" \;
          gh run download 39100332936 -n guardrail-motion-review --dir "$RUNNER_TEMP/english/base"
      - name: Validate captured English voice and measured subtitles
        env:
          FILM_OUT: ${{ runner.temp }}/english
        run: python3 benchmarks/guardrail_english/assemble.py speech
      - name: Assemble and audit all 900 native frames
        env:
          FILM_OUT: ${{ runner.temp }}/english
        run: python3 benchmarks/guardrail_english/assemble.py assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guardrail-english-review
          path: |
            ${{ runner.temp }}/english/guardrail-english-30s-1080p.mp4
            ${{ runner.temp }}/english/captions.srt
            ${{ runner.temp }}/english/film.ass
            ${{ runner.temp }}/english/*validation.json
            ${{ runner.temp }}/english/film_review_*.jpg
          if-no-files-found: error
          retention-days: 7
