name: Fetch the real NIST Radium Girls article content (throwaway)
on:
  push:
    branches: [claude/shorts-studio-production-5cvg1r]
    paths: [.github/workflows/fetch-nist-article.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the article pages and enumerate their images + captions
        run: |
          set -o pipefail
          pip install requests beautifulsoup4 >/dev/null
          python3 - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup
          HEADERS = {"User-Agent": "shorts-studio-scout/1.0 (https://github.com/mingi201209-star/shorts-studio; one-off research script)"}

          pages = [
              "https://www.nist.gov/blogs/taking-measure/new-jerseys-radium-girls-and-nist-trained-scientist-who-came-their-aid",
              "https://www.nist.gov/nist-museum/forgotten-radium-scientists",
              "https://www.nist.gov/pml/marie-curie-and-nbs-radium-standards/1921-marie-curie-visits-us",
          ]
          out = {}
          for url in pages:
              try:
                  r = requests.get(url, headers=HEADERS, timeout=25)
                  entry = {"status": r.status_code}
                  if r.status_code == 200:
                      soup = BeautifulSoup(r.text, "html.parser")
                      imgs = []
                      for img in soup.find_all("img"):
                          src = img.get("src", "")
                          if "/sites/default/files/images/" in src:
                              imgs.append({"src": src, "alt": img.get("alt", "")})
                      entry["images"] = imgs
                      # Article body text (rough) for context on what each image illustrates.
                      body = soup.find("div", class_="field--name-body") or soup.find("article") or soup
                      entry["text_sample"] = body.get_text(" ", strip=True)[:6000]
                  out[url] = entry
                  print(url, entry.get("status"), len(entry.get("images", [])), "images")
                  for i in entry.get("images", []):
                      print("  ", i["src"], "|", i["alt"])
              except Exception as e:
                  out[url] = {"error": str(e)}
                  print(url, "FAILED:", e)
          json.dump(out, open("nist_article.json", "w"), indent=2, ensure_ascii=False)
          PY
      - name: Publish to a throwaway orphan branch
        run: |
          git config user.name "nist-article-bot"
          git config user.email "actions@github.com"
          git checkout --orphan scout/nist-article
          git reset --hard
          git add nist_article.json
          git commit -m "Throwaway: real NIST article content and image inventory"
          git push -f origin HEAD:refs/heads/scout/nist-article
