name: quality-reset-render

on:
  push:
    branches: [exp/quality-reset-v1]
    paths:
      - 'shorts_studio/**'
      - 'tests/**'
      - 'scripts/build_hydroplaning_states.py'
      - '.github/workflows/quality-reset-render.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [exp/tts-naturalness-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render and vision dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'

      - name: Full regression
        run: pytest -q

      - name: Build quality-reset hydroplaning production
        run: |
          set -o pipefail
          python scripts/build_hydroplaning_states.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf 2>&1 | tee quality-reset-generator.log

      - name: Verify opening quality reset contract
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          p = json.loads(Path('examples/hydroplaning.json').read_text())
          hook = p['scenes'][0]['visual_beats']
          assert len(hook) >= 2
          assert hook[0]['production']['role'] == 'hero'
          assert hook[0]['production']['visual_mode'] == 'real_footage'
          assert hook[1]['production']['visual_mode'] == 'real_footage'
          assert p['tts_continuity_mode'] == 'scene_continuous'

          for beat in hook[:2]:
              path = Path(beat['asset'])
              assert path.is_file() and path.stat().st_size > 1_000_000, path
              assert path.suffix.lower() == '.mp4', path
              probe = json.loads(subprocess.run([
                  'ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=codec_name,width,height,r_frame_rate',
                  '-show_entries','format=duration','-of','json',str(path)
              ],capture_output=True,text=True,check=True).stdout)
              assert float(probe['format']['duration']) >= 5.0, probe
              print('REAL_HOOK_ASSET', path, probe['streams'][0], probe['format']['duration'])

          assert all(
              beat['production']['visual_mode'] != 'physical_animation'
              for beat in hook[:2]
          )
          print('QUALITY_RESET_OPENING_CONTRACT_PASS')
          PY

      - name: Validate manifest
        run: python -m shorts_studio validate examples/hydroplaning.json

      - name: Render real-footage-first prototype
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/hydroplaning.json 2>&1 | tee quality-reset-render.log

      - name: Verify all existing gates stay green
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          v=Path('dist/final.mp4')
          assert v.is_file() and v.stat().st_size>0
          probe=json.loads(subprocess.run([
              'ffprobe','-v','error','-of','json',
              '-show_entries','stream=codec_name,width,height,codec_type',
              '-show_entries','format=duration',str(v)
          ],capture_output=True,text=True,check=True).stdout)
          vs=next(s for s in probe['streams'] if s.get('codec_type')=='video')
          assert (vs['width'],vs['height'])==(1080,1920),vs
          assert any(s.get('codec_type')=='audio' for s in probe['streams'])

          q=json.loads(Path('dist/qa_report.json').read_text())
          assert q['status']=='PASS',q
          assert q['semantic_visual_qa']['status']=='PASS',q['semantic_visual_qa']
          fv=q['final_video_qa']
          assert fv['status']=='PASS',fv
          checks=fv['checks']
          for key in (
              'retention_contract','first_10s_retention','meaningful_visual_changes',
              'visual_production_v2','visual_activity_real','visual_cut_cadence',
              'captions_visible','safe_area_clean'
          ):
              assert checks[key]['status']=='PASS',(key,checks[key])
          print('QUALITY_RESET_FINAL_PASS duration=',probe['format']['duration'])
          PY

      - name: Sample first-impression and full-video review frames
        if: success()
        run: |
          mkdir -p review_frames
          for t in 0.0 0.35 0.8 1.5 2.5 4.0 6.0 9.0 12.0 15.0; do
            ffmpeg -y -ss "$t" -i dist/final.mp4 -frames:v 1 "review_frames/t_$t.jpg"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quality-reset-production
          retention-days: 14
          path: |
            dist/
            review_frames/
            quality-reset-generator.log
            quality-reset-render.log
            examples/hydroplaning_upload_description.txt

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: quality-reset-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/
            build/
            quality-reset-generator.log
            quality-reset-render.log


  gpt_sovits_style_compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client dependencies
        run: |
          pip install 'datasets>=3.0' soundfile torchcodec gradio_client==1.10.4 huggingface_hub librosa

      - name: Recover fixed p38 Korean male reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gpt_sovits_style_compare prior_timbre
          gh run download 37847155511 -n gpt-sovits-timbre-screen -D prior_timbre
          cp prior_timbre/ref_2_p38.wav gpt_sovits_style_compare/reference.wav
          cp prior_timbre/ref_2_p38.txt gpt_sovits_style_compare/reference.txt
          cp prior_timbre/ref_2_p38.json gpt_sovits_style_compare/reference_meta.json
          test -s gpt_sovits_style_compare/reference.wav
          cat gpt_sovits_style_compare/reference_meta.json

      - name: Generate three speaking styles
        run: |
          python - <<'PY'
          from gradio_client import Client, handle_file
          from pathlib import Path
          import json, shutil

          root=Path("gpt_sovits_style_compare")
          ref=root/"reference.wav"
          prompt=(root/"reference.txt").read_text(encoding="utf-8").strip()

          styles=[
              {
                  "name":"A_baseline",
                  "text":"빗길에선 타이어가 돌고 있어도, 실은 도로에 닿지 않을 수 있습니다. 문제는 고무가 아니라, 타이어 밑으로 파고드는 물입니다.",
                  "speed":1.00,"top_k":15,"top_p":1.0,"temperature":0.9
              },
              {
                  "name":"B_conversational",
                  "text":"빗길에서는요, 타이어가 돌고 있어도 실제로는 도로에 닿지 않을 수 있습니다. 문제는 고무가 아닙니다. 타이어 밑으로 파고드는 물입니다.",
                  "speed":1.02,"top_k":12,"top_p":0.92,"temperature":0.82
              },
              {
                  "name":"C_shorts_explainer",
                  "text":"빗길에선, 타이어가 돌고 있어도 도로에 안 닿을 수 있습니다. 원인은 고무가 아닙니다. 타이어 밑으로 파고드는 물입니다.",
                  "speed":1.07,"top_k":10,"top_p":0.88,"temperature":0.76
              },
          ]

          client=Client("lj1995/GPT-SoVITS-ProPlus", verbose=False)
          api="/get_tts_wav"
          manifest=[]
          for st in styles:
              result=client.predict(
                  handle_file(str(ref)), prompt, "韩文",
                  st["text"], "韩文", "按标点符号切",
                  st["top_k"], st["top_p"], st["temperature"],
                  False, st["speed"], False, [],
                  api_name=api
              )
              src=None
              if isinstance(result,str) and Path(result).exists():
                  src=Path(result)
              elif isinstance(result,(tuple,list)):
                  for x in result:
                      if isinstance(x,str) and Path(x).exists():
                          src=Path(x); break
                      if isinstance(x,dict) and x.get("path") and Path(x["path"]).exists():
                          src=Path(x["path"]); break
              elif isinstance(result,dict) and result.get("path") and Path(result["path"]).exists():
                  src=Path(result["path"])
              if src is None:
                  raise RuntimeError(f"No output for {st['name']}: {result!r}")
              out=root/f"{st['name']}.wav"
              shutil.copyfile(src,out)
              manifest.append(st)
              print("WROTE",out)
          (root/"styles.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Measure prosody and pauses
        run: |
          python - <<'PY'
          from pathlib import Path
          import librosa, soundfile as sf, numpy as np, json

          root=Path("gpt_sovits_style_compare")
          report=[]
          for p in sorted(root.glob("[ABC]_*.wav")):
              y,sr=sf.read(p,dtype="float32")
              if y.ndim>1:y=y.mean(axis=1)
              f0,_,_=librosa.pyin(y,fmin=70,fmax=250,sr=sr,frame_length=2048,hop_length=256)
              vf=f0[np.isfinite(f0)]
              intervals=librosa.effects.split(y,top_db=34)
              gaps=[]
              for i in range(len(intervals)-1):
                  gaps.append((intervals[i+1][0]-intervals[i][1])/sr)
              report.append({
                  "file":p.name,
                  "duration":len(y)/sr,
                  "f0_median":float(np.median(vf)) if len(vf) else None,
                  "f0_p10":float(np.percentile(vf,10)) if len(vf) else None,
                  "f0_p90":float(np.percentile(vf,90)) if len(vf) else None,
                  "f0_span":float(np.percentile(vf,90)-np.percentile(vf,10)) if len(vf) else None,
                  "centroid":float(np.mean(librosa.feature.spectral_centroid(y=y,sr=sr))),
                  "internal_gaps":[round(float(g),3) for g in gaps if 0.04 <= g <= 1.0],
              })
          print(json.dumps(report,ensure_ascii=False,indent=2))
          (root/"prosody_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          if len(report)!=3: raise RuntimeError("Expected 3 style outputs")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-sovits-style-compare
          retention-days: 14
          path: gpt_sovits_style_compare/
