name: quality-reset-render

on:
  push:
    branches: [exp/quality-reset-v1]
    paths:
      - 'shorts_studio/**'
      - 'tests/**'
      - 'scripts/build_hydroplaning_states.py'
      - '.github/workflows/quality-reset-render.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [exp/tts-naturalness-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render and vision dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'

      - name: Full regression
        run: pytest -q

      - name: Build quality-reset hydroplaning production
        run: |
          set -o pipefail
          python scripts/build_hydroplaning_states.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf 2>&1 | tee quality-reset-generator.log

      - name: Verify opening quality reset contract
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          p = json.loads(Path('examples/hydroplaning.json').read_text())
          hook = p['scenes'][0]['visual_beats']
          assert len(hook) >= 2
          assert hook[0]['production']['role'] == 'hero'
          assert hook[0]['production']['visual_mode'] == 'real_footage'
          assert hook[1]['production']['visual_mode'] == 'real_footage'
          assert p['tts_continuity_mode'] == 'scene_continuous'

          for beat in hook[:2]:
              path = Path(beat['asset'])
              assert path.is_file() and path.stat().st_size > 1_000_000, path
              assert path.suffix.lower() == '.mp4', path
              probe = json.loads(subprocess.run([
                  'ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=codec_name,width,height,r_frame_rate',
                  '-show_entries','format=duration','-of','json',str(path)
              ],capture_output=True,text=True,check=True).stdout)
              assert float(probe['format']['duration']) >= 5.0, probe
              print('REAL_HOOK_ASSET', path, probe['streams'][0], probe['format']['duration'])

          assert all(
              beat['production']['visual_mode'] != 'physical_animation'
              for beat in hook[:2]
          )
          print('QUALITY_RESET_OPENING_CONTRACT_PASS')
          PY

      - name: Validate manifest
        run: python -m shorts_studio validate examples/hydroplaning.json

      - name: Render real-footage-first prototype
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/hydroplaning.json 2>&1 | tee quality-reset-render.log

      - name: Verify all existing gates stay green
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          v=Path('dist/final.mp4')
          assert v.is_file() and v.stat().st_size>0
          probe=json.loads(subprocess.run([
              'ffprobe','-v','error','-of','json',
              '-show_entries','stream=codec_name,width,height,codec_type',
              '-show_entries','format=duration',str(v)
          ],capture_output=True,text=True,check=True).stdout)
          vs=next(s for s in probe['streams'] if s.get('codec_type')=='video')
          assert (vs['width'],vs['height'])==(1080,1920),vs
          assert any(s.get('codec_type')=='audio' for s in probe['streams'])

          q=json.loads(Path('dist/qa_report.json').read_text())
          assert q['status']=='PASS',q
          assert q['semantic_visual_qa']['status']=='PASS',q['semantic_visual_qa']
          fv=q['final_video_qa']
          assert fv['status']=='PASS',fv
          checks=fv['checks']
          for key in (
              'retention_contract','first_10s_retention','meaningful_visual_changes',
              'visual_production_v2','visual_activity_real','visual_cut_cadence',
              'captions_visible','safe_area_clean'
          ):
              assert checks[key]['status']=='PASS',(key,checks[key])
          print('QUALITY_RESET_FINAL_PASS duration=',probe['format']['duration'])
          PY

      - name: Sample first-impression and full-video review frames
        if: success()
        run: |
          mkdir -p review_frames
          for t in 0.0 0.35 0.8 1.5 2.5 4.0 6.0 9.0 12.0 15.0; do
            ffmpeg -y -ss "$t" -i dist/final.mp4 -frames:v 1 "review_frames/t_$t.jpg"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quality-reset-production
          retention-days: 14
          path: |
            dist/
            review_frames/
            quality-reset-generator.log
            quality-reset-render.log
            examples/hydroplaning_upload_description.txt

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: quality-reset-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/
            build/
            quality-reset-generator.log
            quality-reset-render.log


  chatterbox_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Chatterbox V3
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install 'git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2'
      - name: Generate calm Korean documentary variants
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          import torch
          import torchaudio as ta
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS

          out=Path('tts_preview'); out.mkdir(exist_ok=True)
          lines=[
              '빗길에선 타이어가 돌고 있어도, 실은 도로에 닿지 않을 수 있습니다.',
              '문제는 고무가 아니라, 타이어 밑으로 파고드는 물입니다.',
          ]
          torch.set_num_threads(max(1, os.cpu_count() or 1))
          model=ChatterboxMultilingualTTS.from_pretrained(device='cpu', t3_model='v3')

          def render(name, exaggeration, cfg_weight, temperature, pause_ms, speed):
              chunks=[]
              for line in lines:
                  chunks.append(model.generate(
                      line, language_id='ko',
                      exaggeration=exaggeration,
                      cfg_weight=cfg_weight,
                      temperature=temperature,
                      repetition_penalty=1.15,
                  ))
              silence=torch.zeros((1,int(model.sr*pause_ms/1000)))
              joined=torch.cat([chunks[0],silence,chunks[1]],dim=1)
              raw=out/(name+'_raw.wav')
              dst=out/(name+'.wav')
              ta.save(str(raw),joined,model.sr)
              subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(raw),
                              '-af',f'atempo={speed}',str(dst)],check=True)
              raw.unlink()

          render('D_calm_documentary',0.28,0.55,0.68,260,0.93)
          render('E_slow_documentary',0.20,0.62,0.62,360,0.89)

          (out/'README.txt').write_text(
              'D: calm documentary, restrained expression, 260ms pause, 0.93x speed\n'
              'E: slower documentary, lower expression, 360ms pause, 0.89x speed\n'
              'Official Resemble AI Chatterbox Multilingual V3 / Korean / MIT / no paid TTS API.\n',
              encoding='utf-8')
          (out/'preview.json').write_text(json.dumps({
              'D':{'exaggeration':0.28,'cfg_weight':0.55,'temperature':0.68,'pause_ms':260,'speed':0.93},
              'E':{'exaggeration':0.20,'cfg_weight':0.62,'temperature':0.62,'pause_ms':360,'speed':0.89}
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Verify audio
        run: |
          set -euo pipefail
          for f in tts_preview/D_calm_documentary.wav tts_preview/E_slow_documentary.wav; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1 "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: chatterbox-korean-calm-preview
          retention-days: 14
          path: tts_preview/
