name: quality-reset-render

on:
  push:
    branches: [exp/quality-reset-v1]
    paths:
      - 'shorts_studio/**'
      - 'tests/**'
      - 'scripts/build_hydroplaning_states.py'
      - '.github/workflows/quality-reset-render.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [exp/tts-naturalness-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render and vision dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'

      - name: Full regression
        run: pytest -q

      - name: Build quality-reset hydroplaning production
        run: |
          set -o pipefail
          python scripts/build_hydroplaning_states.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf 2>&1 | tee quality-reset-generator.log

      - name: Verify opening quality reset contract
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          p = json.loads(Path('examples/hydroplaning.json').read_text())
          hook = p['scenes'][0]['visual_beats']
          assert len(hook) >= 2
          assert hook[0]['production']['role'] == 'hero'
          assert hook[0]['production']['visual_mode'] == 'real_footage'
          assert hook[1]['production']['visual_mode'] == 'real_footage'
          assert p['tts_continuity_mode'] == 'scene_continuous'

          for beat in hook[:2]:
              path = Path(beat['asset'])
              assert path.is_file() and path.stat().st_size > 1_000_000, path
              assert path.suffix.lower() == '.mp4', path
              probe = json.loads(subprocess.run([
                  'ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=codec_name,width,height,r_frame_rate',
                  '-show_entries','format=duration','-of','json',str(path)
              ],capture_output=True,text=True,check=True).stdout)
              assert float(probe['format']['duration']) >= 5.0, probe
              print('REAL_HOOK_ASSET', path, probe['streams'][0], probe['format']['duration'])

          assert all(
              beat['production']['visual_mode'] != 'physical_animation'
              for beat in hook[:2]
          )
          print('QUALITY_RESET_OPENING_CONTRACT_PASS')
          PY

      - name: Validate manifest
        run: python -m shorts_studio validate examples/hydroplaning.json

      - name: Render real-footage-first prototype
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/hydroplaning.json 2>&1 | tee quality-reset-render.log

      - name: Verify all existing gates stay green
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          v=Path('dist/final.mp4')
          assert v.is_file() and v.stat().st_size>0
          probe=json.loads(subprocess.run([
              'ffprobe','-v','error','-of','json',
              '-show_entries','stream=codec_name,width,height,codec_type',
              '-show_entries','format=duration',str(v)
          ],capture_output=True,text=True,check=True).stdout)
          vs=next(s for s in probe['streams'] if s.get('codec_type')=='video')
          assert (vs['width'],vs['height'])==(1080,1920),vs
          assert any(s.get('codec_type')=='audio' for s in probe['streams'])

          q=json.loads(Path('dist/qa_report.json').read_text())
          assert q['status']=='PASS',q
          assert q['semantic_visual_qa']['status']=='PASS',q['semantic_visual_qa']
          fv=q['final_video_qa']
          assert fv['status']=='PASS',fv
          checks=fv['checks']
          for key in (
              'retention_contract','first_10s_retention','meaningful_visual_changes',
              'visual_production_v2','visual_activity_real','visual_cut_cadence',
              'captions_visible','safe_area_clean'
          ):
              assert checks[key]['status']=='PASS',(key,checks[key])
          print('QUALITY_RESET_FINAL_PASS duration=',probe['format']['duration'])
          PY

      - name: Sample first-impression and full-video review frames
        if: success()
        run: |
          mkdir -p review_frames
          for t in 0.0 0.35 0.8 1.5 2.5 4.0 6.0 9.0 12.0 15.0; do
            ffmpeg -y -ss "$t" -i dist/final.mp4 -frames:v 1 "review_frames/t_$t.jpg"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quality-reset-production
          retention-days: 14
          path: |
            dist/
            review_frames/
            quality-reset-generator.log
            quality-reset-render.log
            examples/hydroplaning_upload_description.txt

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: quality-reset-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/
            build/
            quality-reset-generator.log
            quality-reset-render.log


  gpt_sovits_male_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight client dependencies
        run: |
          pip install 'datasets>=3.0' soundfile gradio_client==1.10.4 huggingface_hub torchcodec

      - name: Select licensed Korean male reference
        run: |
          python - <<'PY'
          from datasets import load_dataset, Audio
          from pathlib import Path
          import json

          ds = load_dataset(
              "yskim3271/Throat_and_Acoustic_Pairing_Speech_Dataset",
              split="test",
              streaming=True,
          )
          ds = ds.cast_column("audio.acoustic_microphone", Audio(decode=False))
          ds = ds.cast_column("audio.throat_microphone", Audio(decode=False))

          chosen = None
          for row in ds:
              if str(row.get("gender","")).lower() != "male":
                  continue
              dur = float(row.get("duration") or 0)
              text = (row.get("normalized_text") or row.get("text") or "").strip()
              if not (5.0 <= dur <= 9.5) or not text:
                  continue
              audio = row["audio.acoustic_microphone"]
              if audio and audio.get("bytes"):
                  chosen = (row, audio["bytes"], text)
                  break

          if chosen is None:
              raise RuntimeError("No decodable 5-9.5s male Korean reference found in streamed test split")

          row, audio_bytes, text = chosen
          Path("gpt_sovits_preview").mkdir(exist_ok=True)
          Path("gpt_sovits_preview/reference.wav").write_bytes(audio_bytes)
          Path("gpt_sovits_preview/reference.txt").write_text(text, encoding="utf-8")
          Path("gpt_sovits_preview/reference_meta.json").write_text(json.dumps({
              "dataset":"yskim3271/Throat_and_Acoustic_Pairing_Speech_Dataset",
              "license":"CC BY 4.0",
              "split":"test",
              "gender":row["gender"],
              "speaker_id":row["speaker_id"],
              "sentence_id":row["sentence_id"],
              "duration":row["duration"],
              "text":text,
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          print("SELECTED", row["speaker_id"], row["sentence_id"], row["gender"], row["duration"], text)
          PY

      - name: Generate GPT-SoVITS Korean preview via official public demo
        run: |
          python - <<'PY'
          from gradio_client import Client, handle_file
          from pathlib import Path
          import json, shutil

          ref = Path("gpt_sovits_preview/reference.wav")
          prompt = Path("gpt_sovits_preview/reference.txt").read_text(encoding="utf-8").strip()
          target = "빗길에선 타이어가 돌고 있어도, 실은 도로에 닿지 않을 수 있습니다. 문제는 고무가 아니라, 타이어 밑으로 파고드는 물입니다."

          client = Client("lj1995/GPT-SoVITS-ProPlus", verbose=False)
          info = client.view_api(all_endpoints=True, return_format="dict")
          Path("gpt_sovits_preview/api.json").write_text(json.dumps(info, ensure_ascii=False, indent=2, default=str), encoding="utf-8")

          candidates=[]
          for name, spec in (info.get("named_endpoints") or {}).items():
              params=spec.get("parameters") or []
              if len(params) >= 10:
                  candidates.append(name)
          print("ENDPOINTS", candidates)

          args = [
              handle_file(str(ref)),
              prompt,
              "韩文",
              target,
              "韩文",
              "不切",
              15,
              1.0,
              0.9,
              False,
              1.0,
              False,
              [],
          ]

          errors=[]
          result=None
          used=None
          for endpoint in candidates + ["/predict"]:
              try:
                  result = client.predict(*args, api_name=endpoint)
                  used=endpoint
                  break
              except Exception as e:
                  errors.append(f"{endpoint}: {type(e).__name__}: {e}")

          if result is None:
              raise RuntimeError("GPT-SoVITS demo call failed:\n" + "\n".join(errors))

          print("USED_ENDPOINT", used)
          print("RESULT", result)

          src = None
          if isinstance(result, str):
              src = Path(result)
          elif isinstance(result, (tuple, list)):
              for x in result:
                  if isinstance(x, str) and Path(x).exists():
                      src = Path(x); break
                  if isinstance(x, dict):
                      p=x.get("path")
                      if p and Path(p).exists():
                          src=Path(p); break
          elif isinstance(result, dict):
              p=result.get("path")
              if p and Path(p).exists(): src=Path(p)

          if not src or not src.exists():
              raise RuntimeError(f"Could not locate returned audio file: {result!r}")

          shutil.copyfile(src, "gpt_sovits_preview/gpt_sovits_male.wav")
          PY

      - name: Apply Shorts cadence
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -y -i gpt_sovits_preview/gpt_sovits_male.wav             -af "atempo=1.04"             gpt_sovits_preview/gpt_sovits_male_shorts.wav
          test -s gpt_sovits_preview/gpt_sovits_male_shorts.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1 gpt_sovits_preview/gpt_sovits_male_shorts.wav

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-sovits-korean-male-preview
          retention-days: 14
          path: gpt_sovits_preview/
