name: hash-molasses-finalists
on:
  push:
    branches: [feat/idea-gate-retention-engine]

jobs:
  hash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Hash the 10 finalist sources at production resolution (width=1280)
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.parse
          from pathlib import Path
          from shorts_studio.render import _resolve_asset

          def wm(name):
              return f"https://commons.wikimedia.org/wiki/Special:Redirect/file/{urllib.parse.quote(name)}?width=1280"

          FINALISTS = {
              "TANK_BEFORE": "North End molasses tank.jpg",
              "TANK_SCALE_DIAGRAM": "Boston Molasses Flood Aftermath (original tank scale superimposed).png",
              "MAIN_PHOTO_C": "Boston, Mass. Boston molasses explosion 14968a.jpg",
              "WRECKAGE_UNDER_TRACKS": "GreatMolassesFlood 1919-Wreckage under the elevated tracks.jpg",
              "EL_RAILWAY_023": "Boston Elevated Railway after the Molasses Flood, January 1919, from the City of Boston Archives - 9800-018-023.jpg",
              "EL_RAILWAY_052": "Boston Elevated Railway after the Molasses Flood, January 1919, from the City of Boston Archives - 9800-018-052.jpg",
              "GLOBE_JPG_BIG": "TheBostonDailyGlobe-frontpage-1919-1-16.jpg",
              "POST_NEWSPAPER": "Boston post-January 16, 1919,.jpg",
              "DETAIL_MAP": "Boston molasses detail map.png",
              "HISTORICAL_MARKER": "Molasses Flood Historical Marker.jpg",
          }

          out_dir = Path("hash_out"); out_dir.mkdir(exist_ok=True)
          results = {}
          for idx, (key, filename) in enumerate(FINALISTS.items()):
              url = wm(filename)
              try:
                  path = _resolve_asset({"asset_url": url}, out_dir, key, idx)
                  raw = Path(path).read_bytes()
                  sha = hashlib.sha256(raw).hexdigest()
                  results[key] = {"filename": filename, "asset_url": url, "sha256": sha, "size": len(raw)}
                  print(f"OK {key}: sha256={sha} size={len(raw)}")
              except Exception as e:
                  results[key] = {"filename": filename, "error": str(e)}
                  print(f"FAIL {key}: {e}")
              time.sleep(2)

          (out_dir / "finalist_hashes.json").write_text(json.dumps(results, ensure_ascii=False, indent=2))
          PY
      - name: Publish to an orphan branch
        run: |
          git config user.name "hash-bot"
          git config user.email "hash-bot@example.com"
          git checkout --orphan hashes/molasses-finalists-2
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p published
          cp hash_out/finalist_hashes.json published/
          git add published
          git commit -m "Hash the 10 Boston Molasses Flood finalist sources at width=1280"
          git push -f origin HEAD:hashes/molasses-finalists-2
