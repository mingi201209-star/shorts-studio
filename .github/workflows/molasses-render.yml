name: molasses-render
on:
  push:
    branches: [feat/idea-gate-retention-engine]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    # The render step (TTS network calls + a one-time CLIP model download for
    # semantic QA) has no bounded timeout of its own, so a single stalled
    # network call could burn the runner for hours with no diagnostic output
    # (this exact failure mode hit the Radium Girls render workflow this
    # project already ships). Fail fast instead so a real stall surfaces as a
    # clear timeout with partial logs/diagnostics uploaded.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk librsvg2-bin
      # fonts-noto-cjk installs many large CJK font files; fontconfig lazily
      # rebuilds its cache the first time something (e.g. ffmpeg's libass
      # subtitle renderer) actually queries it, and that first rebuild can be
      # slow. Force it here, as its own timed/visible step, so that cost
      # (if any) is never hidden inside the opaque render step again.
      - name: Warm the fontconfig cache
        run: time fc-cache -f -v
      - name: Install semantic vision QA dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'
      - name: Full pytest suite
        run: pytest -q
      - name: Validate Boston Molasses Flood manifest
        run: python -m shorts_studio validate examples/boston_molasses_flood.json
      - name: Render Boston Molasses Flood with required semantic QA
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: "1"
          # The previous tee fix alone didn't work: CPython only line-buffers
          # stdout when it's attached to a real terminal. Piped into `tee`
          # (as it is here), stdout is fully block-buffered, so every one of
          # render()'s per-scene progress prints sat in that buffer and never
          # reached the log or render-result.json before the 20-minute
          # timeout killed the process -- the run that added `tee` still
          # showed zero output between the CLIP model load and the timeout.
          # PYTHONUNBUFFERED forces unbuffered stdout/stderr so prints show
          # up immediately, live, regardless of the pipe.
          PYTHONUNBUFFERED: "1"
        # `tee` mirrors the same combined output live into the log AND into
        # render-result.json; `pipefail` keeps this step's exit code as
        # python's own (not tee's), matching the original redirect's intent.
        run: |
          set -o pipefail
          python -m shorts_studio render examples/boston_molasses_flood.json 2>&1 | tee render-result.json
      - name: Verify final deliverable and QA
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          video = Path('dist/final.mp4')
          assert video.is_file() and video.stat().st_size > 0
          p = subprocess.run(['ffprobe','-v','error','-of','json','-show_entries','stream=codec_name,width,height,r_frame_rate','-show_entries','format=duration',str(video)],capture_output=True,text=True,check=True)
          probe = json.loads(p.stdout)
          vs = next(s for s in probe['streams'] if 'width' in s)
          assert (vs['width'], vs['height']) == (1080,1920), vs
          assert vs['codec_name'] == 'h264', vs
          assert float(probe['format']['duration']) > 1.0
          report = json.loads(Path('dist/qa_report.json').read_text(encoding='utf-8'))
          assert report['status'] == 'PASS', report
          assert report['semantic_required'] is True
          assert report['semantic_visual_qa']['results']
          assert all(x['status'] == 'PASS' for x in report['semantic_visual_qa']['results'])
          assert all(x['status'] == 'PASS' for x in report['subtitle_reports'])
          assert report['visual_qa']['structural_status'] == 'PASS'
          assert report['final_video_qa']['status'] == 'PASS'
          print('Boston Molasses Flood final deliverable QA PASS')
          PY
      - name: Upload publishable Boston Molasses Flood artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-boston-molasses-flood
          retention-days: 30
          path: |
            dist/
            build/*.srt
            build/*.timing.json
            build/*_qa.jpg
            build/_titleqa_*.jpg
            build/_capqa_*.jpg
            build/_safeqa_*.jpg
            render-result.json
      - name: Upload diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-boston-molasses-flood-diagnostics
          retention-days: 7
          path: |
            dist/qa_report.json
            build/*_qa.jpg
            build/_titleqa_*.jpg
            build/_capqa_*.jpg
            build/_safeqa_*.jpg
            render-result.json
