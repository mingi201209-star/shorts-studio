name: verify-molasses-sources
on:
  push:
    branches: [feat/idea-gate-retention-engine]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]' pillow
      - name: Download candidate thumbnails, hash through the real pipeline, and dhash for dedupe
        run: |
          python3 - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          from shorts_studio.render import _resolve_asset
          from PIL import Image

          def wm(name):
              import urllib.parse
              return f"https://commons.wikimedia.org/wiki/Special:Redirect/file/{urllib.parse.quote(name)}?width=900"

          CANDIDATES = {
              "TANK_BEFORE": "North End molasses tank.jpg",
              "TANK_SCALE_DIAGRAM": "Boston Molasses Flood Aftermath (original tank scale superimposed).png",
              "MAIN_PHOTO_A": "BostonMolassesDisaster.jpg",
              "MAIN_PHOTO_B": "MolassesDisaster.jpg",
              "MAIN_PHOTO_C": "Boston, Mass. Boston molasses explosion 14968a.jpg",
              "WRECKAGE_UNDER_TRACKS": "GreatMolassesFlood 1919-Wreckage under the elevated tracks.jpg",
              "EL_RAILWAY_023": "Boston Elevated Railway after the Molasses Flood, January 1919, from the City of Boston Archives - 9800-018-023.jpg",
              "EL_RAILWAY_052": "Boston Elevated Railway after the Molasses Flood, January 1919, from the City of Boston Archives - 9800-018-052.jpg",
              "GLOBE_PNG": "Boston Daily Globe Jan. 16, 1919.png",
              "GLOBE_JPG_SMALL": "Thebostonglobe - Jan16 1919 newspaper.jpg",
              "GLOBE_JPG_BIG": "TheBostonDailyGlobe-frontpage-1919-1-16.jpg",
              "POST_NEWSPAPER": "Boston post-January 16, 1919,.jpg",
              "DETAIL_MAP": "Boston molasses detail map.png",
              "AREA_MAP": "Boston molasses area map.png",
              "HISTORICAL_MARKER": "Molasses Flood Historical Marker.jpg",
              "NYT_ARTICLE": "Boston-molasses-disaster-nyt-article.jpg",
          }

          out_dir = Path("verify_out"); out_dir.mkdir(exist_ok=True)
          results = {}
          for idx, (key, filename) in enumerate(CANDIDATES.items()):
              url = wm(filename)
              try:
                  path = _resolve_asset({"asset_url": url}, out_dir, key, idx)
                  if path is None:
                      raise RuntimeError("_resolve_asset returned None")
                  raw = Path(path).read_bytes()
                  sha = hashlib.sha256(raw).hexdigest()
                  img = Image.open(path).convert("L").resize((9, 8))
                  pixels = list(img.getdata())
                  dhash = 0
                  for row in range(8):
                      for col in range(8):
                          dhash = (dhash << 1) | (1 if pixels[row*9+col] < pixels[row*9+col+1] else 0)
                  ext = ".jpg" if Image.open(path).format == "JPEG" else ".png"
                  saved = out_dir / f"{key}{ext}"
                  Image.open(path).convert("RGB").save(saved, quality=70) if ext == ".jpg" else Image.open(path).save(saved)
                  results[key] = {"filename": filename, "sha256": sha, "dhash": format(dhash, "016x"), "size": Path(path).stat().st_size, "wh": Image.open(path).size}
                  print(f"OK {key}: sha256={sha[:12]} dhash={format(dhash,'016x')} size={results[key]['size']}")
              except Exception as e:
                  results[key] = {"filename": filename, "error": str(e)}
                  print(f"FAIL {key}: {e}")
              time.sleep(2)

          # Hamming distance between dhashes -- near-0 means near-duplicate images.
          def hamming(a, b):
              return bin(int(a, 16) ^ int(b, 16)).count("1")

          keys = [k for k, v in results.items() if "dhash" in v]
          dupes = []
          for i in range(len(keys)):
              for j in range(i+1, len(keys)):
                  d = hamming(results[keys[i]]["dhash"], results[keys[j]]["dhash"])
                  if d <= 10:
                      dupes.append({"a": keys[i], "b": keys[j], "hamming": d})
          print("Likely near-duplicate pairs (hamming <= 10):", json.dumps(dupes, indent=2))

          (out_dir / "results.json").write_text(json.dumps({"results": results, "likely_duplicates": dupes}, ensure_ascii=False, indent=2))
          PY
      - name: Publish thumbnails + results to an orphan branch
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout --orphan verify/molasses-sources-2
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p published
          cp verify_out/* published/ 2>/dev/null || true
          git add published
          git commit -m "Verify Boston Molasses Flood candidate sources (hashes + dhash dedupe + thumbnails)"
          git push -f origin HEAD:verify/molasses-sources-2
