name: Shorts Studio org -- real render task (preview-only, free runner)
# Dispatched by shorts_studio.studio_org.departments.render.RenderDept's real
# (mock=False) path, via `gh workflow run`. Runs the EXISTING, unmodified
# render_curious_mechanics.py in its already-established --preview mode
# (7 Cycles samples, 450x800 -- never the 32-sample/1080x1920 production
# contract, and never touching the approved 30-shard B asset bed) against
# the real B manifest, then runs the EXISTING, unmodified
# curious_mechanics_native_qa.verify() against the result and prints its
# real verdict as one JSON line. A preview render is EXPECTED to fail that
# verify() call (preview_only/resolution/samples all differ from the
# production contract) -- this workflow does not relax that gate, catch the
# failure to mean success, or claim a quality bar it doesn't meet.
#
# Free GitHub-hosted runner only; no VPS; no new purchase or paid API; no
# change to narration/voice; nothing here can merge to main or publish
# anything. Pushing this file (or editing it) merely registers it for
# workflow_dispatch -- the job itself is skipped on a push-triggered run, so
# that registration costs nothing.
on:
  workflow_dispatch:
    inputs:
      frame_list:
        description: "Comma-separated absolute frame numbers (<=12, sorted, unique)"
        required: true
      request_tag:
        description: "Opaque tag the caller matches this run's result against"
        required: true
  push:
    branches: [feat/studio-org-task-graph-20261101]
    paths:
      - ".github/workflows/studio-org-render-task.yml"
permissions:
  contents: read
jobs:
  render_and_verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render the requested preview frames (real Blender, no production quality claim)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-progressive-B.json --preview --frame-list "${{ inputs.frame_list }}" --out "$RUNNER_TEMP/rumble"
      - name: Run the real, unmodified technical QA and print its verdict
        env:
          REQUEST_TAG: ${{ inputs.request_tag }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python - "$RUNNER_TEMP/rumble" examples/experiments/curious-mechanics-progressive-B.json benchmarks/road_safety/render_curious_mechanics.py <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from shorts_studio.factory.curious_mechanics_native_qa import verify

          out, manifest, renderer = (Path(a) for a in sys.argv[1:4])
          tag = os.environ["REQUEST_TAG"]
          try:
              result = verify(out, manifest, renderer)
              payload = {"ok": True, "result": result}
          except Exception as exc:  # the real verdict, pass or fail, is what we report
              payload = {"ok": False, "error_type": type(exc).__name__, "error": str(exc)}
          print("STUDIO_ORG_EVAL_RESULT " + tag + " " + json.dumps(payload), flush=True)
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-org-render-task-${{ inputs.request_tag }}
          path: ${{ runner.temp }}/rumble/
          if-no-files-found: error
          retention-days: 3
