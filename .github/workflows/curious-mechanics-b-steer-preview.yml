name: Curious Mechanics B steer-angle preview (cheap, manual only)
# Manual-only (workflow_dispatch) sanity check for the new front-wheel
# steer-angle code in render_curious_mechanics.py, BEFORE committing to the
# real scoped production re-render of shards 751-900. Renders a handful of
# --preview (7 samples, 450x800) frames spanning the lane-return correction
# and prints them as base64 PNG in the job log, since artifact ZIP downloads
# are blocked in this sandbox. workflow_dispatch only: cannot fire on push,
# so it cannot be an accidental duplicate trigger of anything.
on:
  workflow_dispatch: {}
  push:
    branches: [feat/curious-mechanics-b-causal-shot-20261101-steer-staging]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Sparse preview across the lane-return correction (frames 751-900)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-progressive-B.json --preview --frame-list 768,785,825,870,892,900 --out "$RUNNER_TEMP/rumble"
      - name: Print each preview frame as base64 PNG in the job log
        run: |
          set -euo pipefail
          for f in 0768 0785 0825 0870 0892 0900; do
            echo "FRAME_B64_START steer_$f"
            base64 -w0 "$RUNNER_TEMP/rumble/frame_${f}.png"
            echo ""
            echo "FRAME_B64_END steer_$f"
          done
