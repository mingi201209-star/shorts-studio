name: EP05 belt storyboard stills (low resolution, range of shots)
# EP.05: renders the storyboard shots (benchmarks/belt_limiter/belt_shots.py) at 720x1280 / 12 samples and prints a contact sheet. Never a deliverable, never uploads. Starts only when the request file changes.
on:
  push:
    branches: [fix/ep04-narration-visual-contract-20261117]
    paths:
      - examples/experiments/belt-storyboard-request.json
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  stills:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          got=0
          for base in https://download.blender.org/release https://ftp.nluug.nl/pub/graphics/blender/release \
                      https://mirror.clarkson.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release; do
            rm -f "$RUNNER_TEMP/blender.tar.xz"
            if curl -fLsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 280 "$base/Blender5.0/blender-5.0.1-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz" \
               && echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -; then
              echo "Blender downloaded from $base"; got=1; break
            fi
            echo "download from $base failed or did not match the pinned hash; trying the next source"
          done
          test "$got" = 1
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Download pinned CC0 car scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GITHUB_REPOSITORY" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Offline checks (belt model gate)
        run: |
          python -m pip install -q numpy pytest
          PYTHONPATH="$PWD" python -m pytest tests/test_ep05_belt.py -q
      - name: Render the shots
        run: |
          set -euo pipefail
          shots=$(python3 -c "import json;print(','.join(json.load(open('examples/experiments/belt-storyboard-request.json'))['shots']))")
          mkdir -p "$RUNNER_TEMP/out"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/belt_limiter/render_belt_3d.py -- \
            --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --out "$RUNNER_TEMP/out" --shots "$shots" > "$RUNNER_TEMP/render.log" 2>&1 || { tail -60 "$RUNNER_TEMP/render.log"; exit 1; }
          grep BELT_SHOT "$RUNNER_TEMP/render.log" | cut -c1-400
      - name: Contact sheet
        run: |
          python -m pip install -q Pillow==13.0.0
          python3 - <<'PY'
          import base64, glob, io, json, os
          from PIL import Image
          out = os.environ["RUNNER_TEMP"] + "/out"
          names = json.load(open("examples/experiments/belt-storyboard-request.json"))["shots"]
          tile = int(json.load(open("examples/experiments/belt-storyboard-request.json")).get("sheet_tile", 360))
          ims = [Image.open(f"{out}/{n}.png").convert("RGB") for n in names]
          h = tile * 16 // 9
          sheet = Image.new("RGB", (tile * len(ims), h))
          for i, im in enumerate(ims):
              sheet.paste(im.resize((tile, h)), (i * tile, 0))
          buf = io.BytesIO()
          sheet.save(buf, "JPEG", quality=85)
          print("SHEET_B64_START")
          print(base64.b64encode(buf.getvalue()).decode())
          print("SHEET_B64_END")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ep05-storyboard-stills
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7
