name: Scout other named plaintiffs and Harrison Martland (throwaway)
on:
  push:
    branches: [claude/shorts-studio-production-5cvg1r]
    paths: [.github/workflows/scout-more-plaintiffs.yml]

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Search for other plaintiffs' portraits and Harrison Martland
        run: |
          set -o pipefail
          pip install requests >/dev/null
          python3 - <<'PY'
          import json, requests
          HEADERS = {"User-Agent": "shorts-studio-scout/1.0 (https://github.com/mingi201209-star/shorts-studio; one-off research script)"}
          COMMONS = "https://commons.wikimedia.org/w/api.php"
          queries = [
              "Katherine Schaub",
              "Edna Hussman",
              "Quinta McDonald",
              "Albina Larice",
              "Harrison Martland",
              "Harrison Stanford Martland pathologist",
          ]
          results = {}
          for q in queries:
              r = requests.get(COMMONS, params={
                  "action": "query", "list": "search", "srsearch": q,
                  "srnamespace": "6", "srlimit": "10", "format": "json",
              }, headers=HEADERS, timeout=20)
              hits = [h["title"] for h in r.json().get("query", {}).get("search", [])]
              results[q] = hits
              print(q, "->", hits)
          titles = sorted({t for hits in results.values() for t in hits})
          out = []
          if titles:
              r = requests.get(COMMONS, params={
                  "action": "query", "titles": "|".join(titles[:40]), "prop": "imageinfo",
                  "iiprop": "url|size|mime", "iiurlwidth": "800", "format": "json",
              }, headers=HEADERS, timeout=20)
              for p in r.json().get("query", {}).get("pages", {}).values():
                  info = p.get("imageinfo")
                  if info:
                      out.append({"title": p.get("title"), "url": info[0].get("url"), "thumburl": info[0].get("thumburl"), "mime": info[0].get("mime")})
          json.dump({"search_results": results, "candidates": out}, open("plaintiffs_results.json", "w"), indent=2)
          PY
      - name: Publish to a throwaway orphan branch
        run: |
          git config user.name "plaintiffs-scout-bot"
          git config user.email "actions@github.com"
          git checkout --orphan scout/more-plaintiffs
          git reset --hard
          git add plaintiffs_results.json
          git commit -m "Throwaway: candidate portraits of other named plaintiffs / Martland"
          git push -f origin HEAD:refs/heads/scout/more-plaintiffs
