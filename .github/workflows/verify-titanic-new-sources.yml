name: Verify hashes for new Titanic sources (throwaway)
on:
  push:
    branches: [content/titanic-fourth-funnel]
    paths: [.github/workflows/verify-titanic-new-sources.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e '.[dev]'
      - name: Download, normalize, and hash each new candidate through the real production path
        run: |
          python3 - <<'PY'
          import sys, hashlib, json, shutil, time
          sys.path.insert(0, ".")
          from pathlib import Path
          from shorts_studio.render import _resolve_asset

          build = Path("build_tmp"); build.mkdir(exist_ok=True)
          # Bounded Special:Redirect thumbnails, same pattern as the 6 existing
          # sources -- direct upload.wikimedia.org originals just hit a 429
          # (one of them was 6.6MB; Wikimedia's own error message asks for
          # bounded thumbnail sizes instead).
          candidates = {
              "SHAFT": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Titanic%27s%20propeller%20shaft%20installation.jpg?width=1280",
              "STERN": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Titanic%20stern%20under%20construction.jpg?width=1280",
              "GANTRY433": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Construction%20of%20White%20Star%20Liner%20Number%20433.jpg?width=1280",
              "INQUIRY": "https://commons.wikimedia.org/wiki/Special:Redirect/file/London%20Scottish%20Drill%20Hall%20before%20the%20start%20of%20the%20British%20inquiry%20into%20the%20Titanic%20disaster.jpg?width=1280",
              "PROP": "https://commons.wikimedia.org/wiki/Special:Redirect/file/RMS%20Olympic%27s%20propellers.jpg?width=1280",
              "WORKERS": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Knocking%20off%20at%20Harland%20%26%20Wolff%2C%20Belfast.jpg?width=1280",
              "LAUNCHCROWD": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Titanic%20Launching%20Belfast%20May%2031%201911.jpg?width=1280",
          }
          out = {}
          for i, (name, url) in enumerate(candidates.items()):
              try:
                  path = _resolve_asset({"asset_url": url}, build, "verify", i)
                  data = path.read_bytes()
                  digest = hashlib.sha256(data).hexdigest()
                  shutil.copy(path, f"preview_{name}.jpg")
                  out[name] = {"url": url, "sha256": digest, "size": len(data), "status": "ok"}
                  print(name, "OK", digest, len(data), "bytes")
              except Exception as e:
                  out[name] = {"url": url, "error": str(e), "status": "failed"}
                  print(name, "FAILED:", e)
              time.sleep(2)  # be gentle, avoid another 429
          json.dump(out, open("new_source_hashes.json", "w"), indent=2)
          PY
      - name: Publish to a throwaway orphan branch
        run: |
          git config user.name "titanic-newsrc-bot"
          git config user.email "actions@github.com"
          git checkout --orphan verify/titanic-new-sources-2
          git reset --hard
          git add new_source_hashes.json preview_*.jpg 2>/dev/null || git add new_source_hashes.json
          git commit -m "Throwaway: real hashes + previews for 7 new Titanic sources (bounded thumbnails)"
          git push -f origin HEAD:refs/heads/verify/titanic-new-sources-2
