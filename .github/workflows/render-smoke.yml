name: render-smoke
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk librsvg2-bin
      # CPU-only torch: keeps the runner from pulling multi-GB CUDA packages.
      - name: Install real local semantic vision QA dependencies (no API key, no payment)
        run: |
          # torch and torchvision must come from the SAME index/build so their
          # compiled ABIs match; open-clip-torch's own torchvision pin from
          # plain PyPI can otherwise resolve to an incompatible pair
          # ("operator torchvision::nms does not exist").
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'
      - name: Full pytest suite
        run: pytest -q
      - run: python -m shorts_studio validate examples/comet.json
      - name: "Render full Comet short (production-required semantic QA: NOT_EVALUATED = FAIL)"
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: "1"
        # A redirect (not a pipe to tee) so this step's exit code is python's own --
        # a pipeline's exit code is its last command's, which would let a real
        # render FAILURE hide behind tee's exit 0 and be reported as CI success.
        run: python -m shorts_studio render examples/comet.json > render-result.json
      - name: Verify final MP4 (resolution, fps, codecs, audio, duration)
        run: |
          python - <<'PY'
          import json, subprocess, sys

          def probe(*args):
              out = subprocess.run(["ffprobe","-v","error","-of","json",*args],capture_output=True,text=True,check=True)
              return json.loads(out.stdout)

          video = probe("-select_streams","v:0","-show_entries","stream=codec_name,width,height,r_frame_rate","dist/final.mp4")["streams"][0]
          audio_streams = probe("-select_streams","a:0","-show_entries","stream=codec_name","dist/final.mp4")["streams"]
          fmt = probe("-show_entries","format=duration","dist/final.mp4")["format"]

          assert video["width"] == 1080 and video["height"] == 1920, f"resolution: {video}"
          num, den = video["r_frame_rate"].split("/")
          fps = float(num) / float(den)
          assert fps >= 30 - 1e-6, f"fps too low: {fps}"
          assert video["codec_name"] == "h264", f"video codec: {video['codec_name']}"
          assert audio_streams, "no audio stream present"
          assert audio_streams[0]["codec_name"] == "aac", f"audio codec: {audio_streams[0]['codec_name']}"
          assert float(fmt["duration"]) > 1.0, f"suspicious duration: {fmt['duration']}"
          print("video probe OK:", video, audio_streams, fmt)
          PY
      - name: Verify qa_report.json (semantic QA actually ran and PASSed, not silently skipped)
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("dist/qa_report.json"))
          assert report["status"] == "PASS", report
          assert report["semantic_required"] is True, "production run must set SHORTS_REQUIRE_SEMANTIC_QA"
          sem = report["semantic_visual_qa"]
          required_scenes = {r["scene"] for r in sem["results"]}
          assert required_scenes, "no scenes were semantically evaluated"
          for r in sem["results"]:
              assert r["status"] == "PASS", f"required scene not PASS (NOT_EVALUATED must fail-closed here): {r}"
          assert all(s["status"] == "PASS" for s in report["subtitle_reports"]), report["subtitle_reports"]
          assert report["visual_qa"]["structural_status"] == "PASS", report["visual_qa"]
          print("qa_report OK:", json.dumps(report["semantic_visual_qa"], ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-studio-comet
          path: |
            dist/
            build/*.srt
            build/*.timing.json
            build/*_qa.jpg
            render-result.json
