name: render-smoke
on:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk librsvg2-bin
      # CPU-only torch: keeps the runner from pulling multi-GB CUDA packages.
      - name: Install real local semantic vision QA dependencies (no API key, no payment)
        run: |
          # torch and torchvision must come from the SAME index/build so their
          # compiled ABIs match; open-clip-torch's own torchvision pin from
          # plain PyPI can otherwise resolve to an incompatible pair
          # ("operator torchvision::nms does not exist").
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'
      - name: Full pytest suite
        run: pytest -q
      - run: python -m shorts_studio validate examples/comet.json
      - name: Print resolved source-asset SHA-256 (provenance evidence)
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from shorts_studio.project import load_project
          from shorts_studio.render import _resolve_asset

          build = Path("build"); build.mkdir(exist_ok=True)
          p = load_project("examples/comet.json")
          for scene in p.scenes:
              if not scene.visual_qa_requirements:
                  continue
              path = _resolve_asset({"asset": scene.asset, "asset_url": scene.asset_url}, build, scene.id, 0)
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest() if path else None
              print(json.dumps({"scene": scene.id, "asset_url": scene.asset_url or scene.asset, "sha256": digest}))
          PY
      - name: "Render full Comet short (production-required semantic QA: NOT_EVALUATED = FAIL)"
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: "1"
        # A redirect (not a pipe to tee) so this step's exit code is python's own --
        # a pipeline's exit code is its last command's, which would let a real
        # render FAILURE hide behind tee's exit 0 and be reported as CI success.
        run: python -m shorts_studio render examples/comet.json > render-result.json
      - name: Verify final MP4 (resolution, fps, codecs, audio, duration)
        run: |
          python - <<'PY'
          import json, subprocess, sys

          def probe(*args):
              out = subprocess.run(["ffprobe","-v","error","-of","json",*args],capture_output=True,text=True,check=True)
              return json.loads(out.stdout)

          video = probe("-select_streams","v:0","-show_entries","stream=codec_name,width,height,r_frame_rate","dist/final.mp4")["streams"][0]
          audio_streams = probe("-select_streams","a:0","-show_entries","stream=codec_name","dist/final.mp4")["streams"]
          fmt = probe("-show_entries","format=duration","dist/final.mp4")["format"]

          assert video["width"] == 1080 and video["height"] == 1920, f"resolution: {video}"
          num, den = video["r_frame_rate"].split("/")
          fps = float(num) / float(den)
          assert fps >= 30 - 1e-6, f"fps too low: {fps}"
          assert video["codec_name"] == "h264", f"video codec: {video['codec_name']}"
          assert audio_streams, "no audio stream present"
          assert audio_streams[0]["codec_name"] == "aac", f"audio codec: {audio_streams[0]['codec_name']}"
          assert float(fmt["duration"]) > 1.0, f"suspicious duration: {fmt['duration']}"
          print("video probe OK:", video, audio_streams, fmt)
          PY
      - name: Verify qa_report.json (semantic QA actually ran and PASSed, not silently skipped)
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("dist/qa_report.json"))
          assert report["status"] == "PASS", report
          assert report["semantic_required"] is True, "production run must set SHORTS_REQUIRE_SEMANTIC_QA"
          sem = report["semantic_visual_qa"]
          required_scenes = {r["scene"] for r in sem["results"]}
          assert required_scenes, "no scenes were semantically evaluated"
          for r in sem["results"]:
              assert r["status"] == "PASS", f"required scene not PASS (NOT_EVALUATED must fail-closed here): {r}"
          assert all(s["status"] == "PASS" for s in report["subtitle_reports"]), report["subtitle_reports"]
          assert report["visual_qa"]["structural_status"] == "PASS", report["visual_qa"]
          fv = report["final_video_qa"]
          assert fv["status"] == "PASS", f"viewer-facing final-video QA failed: {json.dumps(fv, ensure_ascii=False, indent=2)}"
          for name, check in fv["checks"].items():
              assert check["status"] == "PASS", f"{name} failed: {check}"
          print("qa_report OK:", json.dumps(report["semantic_visual_qa"], ensure_ascii=False, indent=2))
          print("final_video_qa OK:", json.dumps(fv, ensure_ascii=False, indent=2))
          PY
      - name: Verify combined upload caption track
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          captions = Path("dist/captions.srt")
          report = json.loads(Path("dist/qa_report.json").read_text(encoding="utf-8"))
          assert captions.is_file() and captions.stat().st_size > 0
          text = captions.read_text(encoding="utf-8").strip()
          blocks = [block for block in text.split("\n\n") if block.strip()]
          assert blocks and all(len(block.splitlines()) >= 3 for block in blocks)
          assert report["captions"]["status"] == "PASS"
          assert report["captions"]["cues"] == len(blocks)
          print("combined SRT ready:", len(blocks), "cues")
          PY
      - name: Extract representative frames for manual visual review
        run: |
          python - <<'PY'
          import json, subprocess
          fmt = json.loads(subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","json","dist/final.mp4"],capture_output=True,text=True,check=True).stdout)
          duration = float(fmt["format"]["duration"])
          samples = {"opening_title": 0.05, "early_scene": 0.20, "comparison_scene": 0.55, "subtitle_heavy": 0.75, "final_scene": 0.97}
          for name, frac in samples.items():
              ts = max(0.0, duration * frac)
              subprocess.run(["ffmpeg","-y","-ss",str(ts),"-i","dist/final.mp4","-frames:v","1",f"dist/frame_{name}.jpg"],check=True,capture_output=True)
          print("extracted representative frames at fractions:", samples, "of duration", duration)
          PY
      - name: Prepare upload description with image credits
        run: |
          cp examples/comet_upload_description.txt dist/upload-description.txt
          python - <<'PY'
          from pathlib import Path
          text = Path("dist/upload-description.txt").read_text(encoding="utf-8")
          required = ["CC BY-SA 3.0", "CC BY-SA 4.0", "CC BY 2.0", "ADF", "Cohen Inquiry Fig. 7"]
          missing = [item for item in required if item not in text]
          assert not missing, f"upload description missing required credits/context: {missing}"
          print("upload description and third-party image credits OK")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-studio-comet
          path: |
            dist/
            build/*.srt
            build/*.timing.json
            build/*_qa.jpg
            build/_titleqa_*.jpg
            build/_capqa_*.jpg
            build/_safeqa_*.jpg
            render-result.json
