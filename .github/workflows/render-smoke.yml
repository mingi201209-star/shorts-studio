name: render-smoke
on:
  workflow_dispatch:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python -m shorts_studio validate examples/comet.json
      - run: python -m shorts_studio render examples/comet.json --dry-run
