name: Curious Mechanics driver vibration-reaction proof
on:
  push:
    branches: [fix/curious-mechanics-driver-vibration-reaction-20261108]
    paths:
      - .github/workflows/curious-mechanics-driver-vibration-reaction-proof.yml
      - benchmarks/road_safety/render_driver_insert.py
      - tests/test_studio_org_driver_cut.py
permissions:
  contents: read
  actions: read
concurrency:
  group: curious-mechanics-driver-vibration-reaction-proof
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        start: [4, 10, 16, 22, 28, 34]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxkbcommon0 libxi6 libxrender1 libgl1
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render only the vibration-to-reaction proof range
        run: |
          set -euo pipefail
          end=$(( ${{ matrix.start }} + 5 ))
          if [ "$end" -gt 36 ]; then end=36; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1             -P benchmarks/road_safety/render_driver_insert.py --             --start ${{ matrix.start }} --end "$end" --out "$RUNNER_TEMP/driver"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driver-vibration-shard-${{ matrix.start }}
          path: ${{ runner.temp }}/driver/
          retention-days: 14
  final:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow
      - name: Retrieve only this run's proof shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"             --pattern 'driver-vibration-shard-*' --dir "$RUNNER_TEMP/shards"
      - name: Verify rendered pixels and authored displacement
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/complete"
          python - "$RUNNER_TEMP/shards" "$RUNNER_TEMP/complete" <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path
          shards, out = map(Path, sys.argv[1:])
          receipts = sorted(shards.rglob("driver-pilot.json"))
          assert len(receipts) == 6
          hashes, poses = {}, []
          renderer = None
          for receipt_path in receipts:
              receipt = json.loads(receipt_path.read_text())
              assert receipt["resolution"] == [1080, 1920]
              assert receipt["fps"] == 30 and receipt["samples"] == 32
              assert receipt["human_review"] == "UNVERIFIED"
              assert receipt["vibration_transfer"]["camera_motion"] is False
              renderer = renderer or receipt["renderer_sha256"]
              assert receipt["renderer_sha256"] == renderer
              for name, expected in receipt["png_sha256"].items():
                  source = receipt_path.parent / name
                  actual = hashlib.sha256(source.read_bytes()).hexdigest()
                  assert actual == expected and name not in hashes
                  hashes[name] = actual
                  shutil.copyfile(source, out / name)
              poses.extend(receipt["poses"])
          expected_names = {f"{frame:04d}.png" for frame in range(4, 37)}
          assert set(hashes) == expected_names
          assert len(set(hashes.values())) == 33
          poses.sort(key=lambda row: row["frame"])
          assert [row["frame"] for row in poses] == list(range(4, 37))
          xs = [row["driver_vibration_x_m"] for row in poses]
          zs = [row["driver_vibration_z_m"] for row in poses]
          assert max(xs) - min(xs) >= 0.014
          assert max(zs) - min(zs) >= 0.020
          proof = {
              "status": "DRIVER_VIBRATION_REACTION_PROOF_PASS",
              "human_first_view": "UNVERIFIED",
              "upload_authorized": False,
              "renderer_sha256": renderer,
              "frame_range": [4, 36],
              "frame_count": 33,
              "unique_png_count": len(set(hashes.values())),
              "lateral_range_m": max(xs) - min(xs),
              "vertical_range_m": max(zs) - min(zs),
              "camera_motion": False,
              "png_sha256": hashes,
          }
          (out / "proof.json").write_text(json.dumps(proof, indent=2) + "\n")
          print("DRIVER_VIBRATION_REACTION_PROOF_PASS " + json.dumps(proof))
          PY
          ffmpeg -v error -framerate 30 -start_number 4 -i "$RUNNER_TEMP/complete/%04d.png"             -frames:v 33 -c:v ffv1 -level 3 "$RUNNER_TEMP/complete/proof-lossless.mkv"
          ffmpeg -v error -i "$RUNNER_TEMP/complete/proof-lossless.mkv"             -c:v libx264 -crf 17 -pix_fmt yuv420p "$RUNNER_TEMP/complete/proof-review.mp4"
          ffmpeg -v error -i "$RUNNER_TEMP/complete/proof-review.mp4" -f null -
          ffprobe -v error -count_frames -select_streams v:0             -show_entries stream=width,height,r_frame_rate,nb_read_frames -of json             "$RUNNER_TEMP/complete/proof-review.mp4" > "$RUNNER_TEMP/complete/ffprobe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: curious-mechanics-driver-vibration-reaction-proof
          path: ${{ runner.temp }}/complete/
          retention-days: 14
