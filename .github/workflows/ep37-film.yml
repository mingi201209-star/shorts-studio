name: EP37 elevator safety gear film PREVIEW (rendered on free runners at 1080x1920)
# EP.37: renders the elevator safety gear film's frames (100% 3D, no text overlays). For now only its opening, rendered first so it
# can be EP.36's teaser (owner, 2026-11-28); the assembly job is added when the whole film is made in shards on free runners, builds the effects mix on the frozen narration, burns in the captions and runs every gate.
# Starts only when the request file changes. Never uploads anything.
on:
  push:
    branches: [claude/focused-ptolemy-6o7vl9]
    paths:
      - examples/experiments/elevator-film-request.json
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      shards: ${{ steps.p.outputs.shards }}
      frames_run: ${{ steps.p.outputs.frames_run }}
      res_scale: ${{ steps.p.outputs.res_scale }}
      samples: ${{ steps.p.outputs.samples }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, ".")
          from benchmarks.elevator_safety import car_timeline as tl
          req = json.load(open("examples/experiments/elevator-film-request.json"))
          n = tl.frame_count()
          size = int(req.get("shard", 12))
          include = [{"start": s, "end": min(s + size - 1, n - 1)} for s in range(0, n, size)]
          print("res_scale=" + str(float(req.get("res_scale", 0.6667))))
          print("samples=" + str(int(req.get("samples", 12))))
          print("frames_run=" + str(req.get("frames_run", "")))
          print("shards=" + str(len(include)))
          print("matrix=" + json.dumps({"include": include}))
          PY
  frames:
    needs: plan
    if: ${{ needs.plan.outputs.frames_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          # a third-party list on the runner image (packages.microsoft.com) sometimes answers 403: run 45901227006 lost two shards to it.
          # The Ubuntu lists still update, so a failed update is not fatal; the install below is.
          sudo apt-get update -qq || echo "apt-get update reported errors; continuing with the lists it did fetch"
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          # official site first, then public mirrors: some runners get a persistent 403 from download.blender.org.
          # Whatever the source, the pinned SHA-256 below decides whether the file is accepted.
          got=0
          for base in https://download.blender.org/release https://ftp.nluug.nl/pub/graphics/blender/release \
                      https://mirror.clarkson.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release; do
            rm -f "$RUNNER_TEMP/blender.tar.xz"
            if curl -fLsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 280 "$base/Blender5.0/blender-5.0.1-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz" \
               && echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -; then
              echo "Blender downloaded from $base"; got=1; break
            fi
            echo "download from $base failed or did not match the pinned hash; trying the next source"
          done
          test "$got" = 1
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render film frames ${{ matrix.start }}-${{ matrix.end }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/elevator_safety/render_car_3d.py -- \
            --frames ${{ matrix.start }}-${{ matrix.end }} \
            --res-scale ${{ needs.plan.outputs.res_scale }} --samples ${{ needs.plan.outputs.samples }} --out "$RUNNER_TEMP/native" > "$RUNNER_TEMP/native/render.log" 2>&1 || { tail -40 "$RUNNER_TEMP/native/render.log"; exit 1; }
          grep -c CAR_FRAME "$RUNNER_TEMP/native/render.log"
          grep CAR_FRAME "$RUNNER_TEMP/native/render.log" | awk 'NR % 6 == 1' | cut -c1-400
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: car-film-panels-${{ matrix.start }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 7
