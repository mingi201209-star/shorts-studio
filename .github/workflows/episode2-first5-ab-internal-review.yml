name: Episode 2 native-3D first5 A/B internal editorial proof
# Editorial-only: never modifies the original failed render or its strict gate.
on:
  push:
    branches: [exp/episode2-first5-ab-real3d-20261025]
    paths: [.github/workflows/episode2-first5-ab-internal-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  edit-original-native-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      ORIGINAL_RUN: '40084843910'
      ORIGINAL_HEAD: '02171e9972e709bfa05f16b1d188f4f9d38db292'
      INTERNAL_RECOVERY_RUN: '40091302920'
      ORIGINAL_FAILED_MP4_SHA: 'e01a7843645b135203043602acda58759bf3418308b216bb57751027033933f0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Assert failed original native film and 30 authentic successful shards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN" --jq .head_sha)" = "$ORIGINAL_HEAD"
          test "$(gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN" --jq .conclusion)" = failure
          test "$(gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" --jq '[.jobs[]|select((.name|startswith("native (")) and .conclusion=="success")]|length')" = 30
          test "$(gh api "repos/$GH_REPO/actions/runs/$INTERNAL_RECOVERY_RUN" --jq .conclusion)" = failure
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 40091302920
          name: episode2-W1-900-frames-FIRST5-REVIEW-ONLY-HOLD
          path: build/original-failed-review
      - name: Install only local free A/B and original visual QA libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy opencv-python-headless
      - name: Verify identical original MP4 source, without a native rerender
        run: |
          set -euo pipefail
          echo "$ORIGINAL_FAILED_MP4_SHA  build/original-failed-review/rumble-strips-english-30s-1080p.mp4" | sha256sum -c -
      - name: Make both original real Blender-footage 30s versions with unchanged original 0-30s AAC
        run: |
          python benchmarks/road_safety/episode2_first5_ab_editorial.py \
            --source build/original-failed-review/rumble-strips-english-30s-1080p.mp4 \
            --out build/episode2-first5-ab
      - name: Protect unchanged first-five-second pixel QA and no-upload policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/episode2-first5-ab/INTERNAL_EDITORIAL_AB_REPORT.json').read_text())
          assert report['status']=='FIRST5_PIXELS_PASS_EDITORIAL_HOLD'
          assert report['original_run_conclusion']=='failure'
          assert report['automatic_upload_authorized'] is False
          assert sorted(report['candidates'])==['A','B']
          for key,item in report['candidates'].items():
              assert item['whole_original_30s_audio_bitstream_identical'] is True
              assert item['real_pixel_qa']['status']=='PASS'
              assert item['real_pixel_qa']['first_5s_visual_changes']>=1
              assert item['real_pixel_qa']['original_unmodified_threshold']==12
              assert item['real_pixel_qa']['max_static_visual_seconds']<=5.05
              assert item['upload_authorized'] is False
              print('REAL_NATIVE_3D_FIRST5_AB_CADENCE_PASS_ONLY', key, item['real_pixel_qa']['cut_timestamps_s'])
          print('ORIGINAL_FILM_STILL_FAILED_EDITORIAL_HOLD')
          PY
      - name: Retain review-only proof and original source provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EPISODE2-ORIGINAL-3D-FIRST5-AB-PRIVATE-EDITORIAL-HOLD
          path: |
            build/episode2-first5-ab/*-30s-EDITORIAL-HOLD.mp4
            build/episode2-first5-ab/INTERNAL_EDITORIAL_AB_REPORT.json
          retention-days: 7
          if-no-files-found: warn
