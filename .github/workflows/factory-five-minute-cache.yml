name: Five-minute native cached film delivery proof
on:
  push:
    branches:
      - feat/factory-five-minute-cache-20261018
permissions:
  contents: read
  actions: read
jobs:
  cached-native-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start wall-clock SLA measurement
        run: echo "SLA_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Checkout audited English script, TTS captures and existing native QA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef56839e706f55fbc7f3513edc9acec0d254a981
          path: audited-english-source
          persist-credentials: false
      - name: Install assembly requirements
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -e .
      - name: Retrieve only completed audited native camera footage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/39111993576 --jq .head_sha)" = d9bd962270da3a7d9afc3054f4c488f0d56b758f
          test "$(gh api repos/$GH_REPO/actions/runs/39111993576 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/39101075134 --jq .head_sha)" = c19904ab5650993bee3d19613ebab25e81f4e844
          test "$(gh api repos/$GH_REPO/actions/runs/39101075134 --jq .conclusion)" = success
          mkdir -p "$RUNNER_TEMP/expanded/chunks"
          gh run download 39111993576 --pattern 'director-footage-*' -D "$RUNNER_TEMP/new"
          gh run download 39111993576 -n guardrail-director-english-review -D "$RUNNER_TEMP/source-proof"
          for start in $(seq 571 30 871); do
            gh run download 39101075134 -n "film-footage-$start" -D "$RUNNER_TEMP/reused/$start"
          done
          find "$RUNNER_TEMP/new" "$RUNNER_TEMP/reused" -type f \( -name 'chunk_*.mp4' -o -name 'shard_*.json' \) -exec cp {} "$RUNNER_TEMP/expanded/chunks/" \;
      - name: Synthesize expanded English narration from checked script
        env:
          FILM_OUT: ${{ runner.temp }}/expanded
        run: python3 "$GITHUB_WORKSPACE/audited-english-source/benchmarks/guardrail_expanded/assemble.py" speech
      - name: Full 900-frame source QA, caption alignment, silence, and film assembly
        env:
          FILM_OUT: ${{ runner.temp }}/expanded
          EXPANDED_SOURCE_PROOF: ${{ runner.temp }}/source-proof/director_validation.json
        run: python3 "$GITHUB_WORKSPACE/audited-english-source/benchmarks/guardrail_expanded/assemble.py" assemble
      - name: Assert 5-minute cached native delivery without lowering quality
        env:
          FILM_OUT: ${{ runner.temp }}/expanded
        run: |
          set -euo pipefail
          elapsed=$(($(date +%s)-SLA_START_EPOCH))
          python3 -m shorts_studio.factory.cached_native_delivery \
            --file "$FILM_OUT/guardrail-expanded-english-30s-1080p.mp4" \
            --elapsed "$elapsed" \
            --output "$FILM_OUT/fast-delivery-proof.json"
          echo "CACHED_NATIVE_DELIVERY_ELAPSED_SECONDS=$elapsed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cached-five-minute-review
          path: |
            ${{ runner.temp }}/expanded/guardrail-expanded-english-30s-1080p.mp4
            ${{ runner.temp }}/expanded/fast-delivery-proof.json
            ${{ runner.temp }}/expanded/*validation.json
            ${{ runner.temp }}/expanded/captions.srt
          if-no-files-found: error
          retention-days: 3
