name: Curious Mechanics A/B/C opening proof (GitHub standard runners)

on:
  push:
    branches: [exp/curious-mechanics-production-20261029]
    paths:
      - .github/workflows/curious-mechanics-opening-proof.yml
      - shorts_studio/factory/curious_mechanics_timeline.py
      - benchmarks/road_safety/curious_mechanics_github_parallel.py
      - tests/test_curious_mechanics_experiment.py
      - tests/test_curious_mechanics_github_parallel.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: curious-mechanics-opening-proof
  cancel-in-progress: false

env:
  RENDERER_SOURCE_SHA256: 700c523fac79cbafac3e763e0e9bbace429c6deff89da1ddbf97616f143debae
  SCENE_SHA256: a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877
  BLENDER_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # A/C openings already have verified proofs. Recover only B's three
        # existing 30-frame shards after its fixed-camera scale correction.
        include:
          - {variant: B, start: 1, end: 30}
          - {variant: B, start: 31, end: 60}
          - {variant: B, start: 61, end: 90}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Blender and native QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg fonts-dejavu-core
          python -m pip install Pillow pydantic
          archive="$RUNNER_TEMP/blender.tar.xz"
          downloaded=0
          urls=(
            "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
            "https://mirrors.aliyun.com/blender/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
            "https://mirror.nju.edu.cn/blender/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
            "https://mirror.freedif.org/blender/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
          )
          for url in "${urls[@]}"; do
            echo "Trying Blender 5.0.1 source: $url"
            if curl -fLsS --retry 2 --max-time 240 "$url" -o "$archive"; then
              if echo "$BLENDER_SHA256  $archive" | sha256sum -c -; then
                downloaded=1
                break
              fi
            fi
            rm -f "$archive"
          done
          if [[ "$downloaded" != "1" ]]; then
            echo "::error::All Blender 5.0.1 mirrors failed or had a hash mismatch."
            exit 1
          fi
          tar -xJf "$archive" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 source scene
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "$SCENE_SHA256  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render only the new opening proof frames
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-${{ matrix.variant }}.json --start ${{ matrix.start }} --end ${{ matrix.end }} --out "$RUNNER_TEMP/rumble" 2>&1 | tee "$RUNNER_TEMP/rumble/render.log"
      - name: Native PNG and exact lossless clip QA
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_shard_artifact.py --out "$RUNNER_TEMP/rumble" --manifest examples/experiments/curious-mechanics-${{ matrix.variant }}.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-hook-native-${{ matrix.variant }}-${{ matrix.start }}
          path: ${{ runner.temp }}/rumble/
          if-no-files-found: error
          retention-days: 14

  preview:
    needs: native
    if: needs.native.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [B]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install preview encoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 ffmpeg fonts-dejavu-core
          python -m pip install Pillow pydantic
      - name: Retrieve only this run's native opening shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native/${{ matrix.variant }}"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "curious-hook-native-${{ matrix.variant }}-*" --dir "$RUNNER_TEMP/native/${{ matrix.variant }}"
      - name: Assemble silent 3-second proof and verify all 90 frames
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_github_parallel.py opening-preview --native-root "$RUNNER_TEMP/native/${{ matrix.variant }}" --variant ${{ matrix.variant }} --out "$RUNNER_TEMP/preview"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-mechanics-hook-preview-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/preview/
          if-no-files-found: warn
          retention-days: 90
