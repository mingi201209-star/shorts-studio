name: Curious Mechanics recovery preview only

on:
  push:
    branches: [exp/curious-mechanics-production-20261029]
    paths: [.github/workflows/curious-mechanics-recovery-preview.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: curious-mechanics-recovery-preview
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "44499589013"
  RECOVERY_RUN_ID: "44514759935"

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [A, B, C]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify preserved source and recovery runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in "$SOURCE_RUN_ID" "$RECOVERY_RUN_ID"; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status')
            [[ "$status" == "completed" ]] || { echo "::error::Required source run $run is not completed"; exit 1; }
          done
          source_names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
          for name in curious-native-${{ matrix.variant }}-1 curious-native-${{ matrix.variant }}-2 curious-native-${{ matrix.variant }}-3; do
            grep -Fqx "$name" <<< "$source_names" || { echo "::error::Missing or expired opening artifact: $name"; exit 1; }
          done
          recovery_names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
          grep -Fqx "curious-contact-${{ matrix.variant }}-recovery" <<< "$recovery_names" || { echo "::error::Missing or expired contact recovery artifact for ${{ matrix.variant }}"; exit 1; }
          if [[ "${{ matrix.variant }}" == "C" ]]; then
            grep -Fqx "curious-native-C-2-recovery" <<< "$recovery_names" || { echo "::error::Missing or expired C native shard 2"; exit 1; }
          fi
      - name: Verify preinstalled media tools and install Python preview dependencies
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          python -m pip install --disable-pip-version-check Pillow pydantic
      - name: Download preserved opening shards and contact recovery only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/contact"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "curious-native-${{ matrix.variant }}-*" --dir "$RUNNER_TEMP/native"
          gh run download "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "curious-contact-${{ matrix.variant }}-recovery" --dir "$RUNNER_TEMP/contact"
          if [[ "${{ matrix.variant }}" == "C" ]]; then
            gh run download "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name curious-native-C-2-recovery --dir "$RUNNER_TEMP/native"
          fi
      - name: Build opening and contact pilot from existing frames (no render)
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_github_parallel.py pilot --native-root "$RUNNER_TEMP/native" --contact-root "$RUNNER_TEMP/contact" --variant "${{ matrix.variant }}" --out "$RUNNER_TEMP/pilot"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-mechanics-recovery-preview-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot/
          if-no-files-found: error
          retention-days: 90
