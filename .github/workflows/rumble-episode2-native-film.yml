name: Rumble episode 2 fresh 900-frame native Cycles32 English film
# Manual only. Renders all 900 original frames from the exact pinned renderer
# in this run; never downloads frames from any other run, cache or renderer.
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact 40-character commit SHA being dispatched
        required: true
env:
  RENDERER_SOURCE_SHA256: 68fe3823fc9b3d1039a01d880551d81fbfb140056212af39fc62201b4458e726
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require exact dispatched head and pinned renderer source
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_rumble_episode2.py" | sha256sum -c -
  speech:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow pydantic
      - run: PYTHONPATH=. python benchmarks/road_safety/episode2_film.py speech --out build/speech-preflight
  native:
    needs: [guard, speech]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        frame: [1, 31, 61, 91, 121, 151, 181, 211, 241, 271, 301, 331, 361, 391, 421, 451, 481, 511, 541, 571, 601, 631, 661, 691, 721, 751, 781, 811, 841, 871]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_rumble_episode2.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 30 contiguous absolute original frames
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_rumble_episode2.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/factory/rumble-episode2-30s.json --start ${{ matrix.frame }} --end $(( ${{ matrix.frame }} + 29 )) --out "$RUNNER_TEMP/rumble"
      - name: Native shard QA and lossless intermediate
        run: |
          PYTHONPATH="$PWD" python benchmarks/road_safety/episode2_film.py shard --out "$RUNNER_TEMP/rumble"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rumble-native-${{ matrix.frame }}
          path: |
            ${{ runner.temp }}/rumble/episode-proof.json
            ${{ runner.temp }}/rumble/native-lossless.mkv
          if-no-files-found: error
          retention-days: 2
  assemble:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install real local semantic vision QA dependencies (no API key, no payment)
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[vision]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rumble-native-*
          path: build/native-chunks
      - run: PYTHONPATH=. python benchmarks/road_safety/episode2_film.py assemble --chunks build/native-chunks --out build/episode2-review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rumble-episode2-fresh-english-review
          path: build/episode2-review/
          if-no-files-found: error
          retention-days: 7
