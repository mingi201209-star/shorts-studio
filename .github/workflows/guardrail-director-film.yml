name: Guardrail director full English film
on:
  pull_request:
    paths:
      - ".github/workflows/guardrail-director-film.yml"
      - "benchmarks/guardrail_director/**"
      - "benchmarks/guardrail_english/assemble.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtain exact audited scene
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/39100332936 --jq .head_sha)" = cbd575cf598dd71f786a6b2a65838de22b0350c5
          gh run download 39100332936 -n guardrail-motion-scene-graphite -D "$RUNNER_TEMP/source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: director-source
          path: ${{ runner.temp }}/source/
          retention-days: 3
  footage:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        start: [1, 11, 21, 31, 41, 51, 61, 71, 81, 91, 101, 111, 121, 131, 141, 151, 161, 171, 181, 191, 201, 211, 221, 231, 241, 251, 261, 271, 281, 291, 301, 311, 321, 331, 341, 351, 361, 371, 381, 391, 401, 411, 421, 431, 441, 451, 461, 471, 481, 491, 501, 511, 521, 531, 541, 551, 561]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: director-source
          path: ${{ runner.temp }}/source
      - name: Install pinned Blender and offscreen driver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render 10 unique native Cycles frames from fixed cameras
        env:
          FILM_OUT: ${{ runner.temp }}/footage
          FILM_START: ${{ matrix.start }}
          DIRECTOR_SOURCE_AUDIT: ${{ runner.temp }}/source/motion_validation.json
          DIRECTOR_ENGINE: CYCLES
          LP_NUM_THREADS: '4'
        run: |
          export FILM_END=$((FILM_START+9))
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 "$RUNNER_TEMP/source/guardrail_v2_local.blend" --python-exit-code 1 --python benchmarks/guardrail_director/render.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: director-footage-${{ matrix.start }}
          path: |
            ${{ runner.temp }}/footage/chunk_*.mp4
            ${{ runner.temp }}/footage/shard_*.json
          if-no-files-found: error
          retention-days: 3
  assemble:
    needs: footage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: director-footage-*
          merge-multiple: true
          path: ${{ runner.temp }}/film/chunks
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -e .
      - name: Reuse unchanged audited redirection and closing shots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/39101075134 --jq .head_sha)" = c19904ab5650993bee3d19613ebab25e81f4e844
          test "$(gh api repos/$GH_REPO/actions/runs/39101075134 --jq .conclusion)" = success
          for start in $(seq 571 30 871); do
            gh run download 39101075134 -n "film-footage-$start" -D "$RUNNER_TEMP/reused/$start"
          done
          find "$RUNNER_TEMP/reused" -type f \( -name 'chunk_*.mp4' -o -name 'shard_*.json' \) -exec cp {} "$RUNNER_TEMP/film/chunks/" \;
      - name: English captions only, assemble and audit the full native film
        env:
          FILM_OUT: ${{ runner.temp }}/film
        run: |
          python3 benchmarks/guardrail_director/assemble.py speech
          python3 benchmarks/guardrail_director/assemble.py assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardrail-director-english-review
          path: |
            ${{ runner.temp }}/film/guardrail-director-english-30s-1080p.mp4
            ${{ runner.temp }}/film/*.srt
            ${{ runner.temp }}/film/film.ass
            ${{ runner.temp }}/film/*validation.json
            ${{ runner.temp }}/film/director_review_*.jpg
          if-no-files-found: error
          retention-days: 7
