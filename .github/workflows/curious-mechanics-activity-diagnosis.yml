name: Curious Mechanics visual_activity diagnosis (read-only, no re-render)
# Investigates the real visual_activity FAIL from run 41201322921 without
# rendering anything new: downloads already-rendered, already-QA-passed
# native B shards covering the reported static window and measures real,
# un-subsampled, un-compressed frame-to-frame pixel difference directly on
# the native PNGs -- separating "genuinely static" from "real motion the
# compressed/2fps gate pipeline can't see" from "detector bug".
on:
  push:
    branches: [fix/curious-mechanics-visual-activity-20261031]
    paths:
      - ".github/workflows/curious-mechanics-activity-diagnosis.yml"
      - "benchmarks/road_safety/diagnose_curious_mechanics_activity.py"
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow numpy
      - name: Download already-rendered, already-QA-passed native B shards covering frames 481-750
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shards"
          for start in 481 511 541 571 601 631 661 691 721; do
            gh run download 41201322921 --repo "$GITHUB_REPOSITORY" --name "curious-progressive-B-$start" --dir "$RUNNER_TEMP/shards/$start"
          done
      - name: Measure real native-frame activity across the reported static window (466-766)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnosis"
          # Shards 481-750 are fully within the current run's output; this
          # covers 481-750 of the reported 466-766 static window (the two
          # edge shards 451-480 and 751-780 came from an older pinned run
          # and are not needed to answer "is there real motion in here").
          python benchmarks/road_safety/diagnose_curious_mechanics_activity.py --shards "$RUNNER_TEMP/shards" --start 481 --end 750 --out "$RUNNER_TEMP/diagnosis"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: curious-mechanics-activity-diagnosis
          path: ${{ runner.temp }}/diagnosis/
          if-no-files-found: error
          retention-days: 14
