name: Rumble sampling-ceiling native ABBA benchmark
on:
  push:
    branches: [perf/rumble-episode2-render-speed-20261031]
    paths:
      - ".github/workflows/rumble-episode2-sampling-benchmark.yml"
      - "benchmarks/road_safety/benchmark_rumble_sampling.py"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg time
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Isolated native 10-frame ABBA sampling comparison (32 vs 16)
        run: |
          PYTHONPATH="$PWD" python benchmarks/road_safety/benchmark_rumble_sampling.py --blender "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --out "$RUNNER_TEMP/sampling-benchmark" --candidate-samples 16
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rumble-sampling-abba-benchmark
          path: |
            ${{ runner.temp }}/sampling-benchmark/benchmark.json
            ${{ runner.temp }}/sampling-benchmark/cpuinfo.txt
            ${{ runner.temp }}/sampling-benchmark/*/episode-proof.json
            ${{ runner.temp }}/sampling-benchmark/*/frame_*.png
            ${{ runner.temp }}/sampling-benchmark/*/render.log
            ${{ runner.temp }}/sampling-benchmark/*/resource.txt
          if-no-files-found: error
          retention-days: 14
