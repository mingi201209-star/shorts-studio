name: Scout more distinct real Comet sources (throwaway)
on:
  push:
    branches: [claude/shorts-studio-production-5cvg1r]
    paths: [.github/workflows/scout-comet-sources.yml]

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Search Commons for a distinct real image of the reassembled Comet wreckage
        run: |
          set -o pipefail
          pip install requests >/dev/null
          python3 - <<'PY'
          import json, requests

          HEADERS = {"User-Agent": "shorts-studio-scout/1.0 (https://github.com/mingi201209-star/shorts-studio; one-off research script)"}
          COMMONS = "https://commons.wikimedia.org/w/api.php"

          queries = [
              "Comet reconstruction Farnborough",
              "de Havilland Comet wreckage reassembled",
              "Comet G-ALYP reconstruction",
              "de Havilland Comet ADF aerial",
              "de Havilland Comet fatigue crack",
          ]
          results = {}
          for q in queries:
              r = requests.get(COMMONS, params={
                  "action": "query", "list": "search", "srsearch": q,
                  "srnamespace": "6", "srlimit": "15", "format": "json",
              }, headers=HEADERS, timeout=20)
              hits = [h["title"] for h in r.json().get("query", {}).get("search", [])]
              results[q] = hits
              print(q, "->", hits)

          titles = sorted({t for hits in results.values() for t in hits})
          out = []
          if titles:
              r = requests.get(COMMONS, params={
                  "action": "query", "titles": "|".join(titles[:40]), "prop": "imageinfo",
                  "iiprop": "url|size|mime", "iiurlwidth": "800", "format": "json",
              }, headers=HEADERS, timeout=20)
              for p in r.json().get("query", {}).get("pages", {}).values():
                  info = p.get("imageinfo")
                  if info:
                      out.append({
                          "title": p.get("title"),
                          "url": info[0].get("url"),
                          "thumburl": info[0].get("thumburl"),
                          "mime": info[0].get("mime"),
                          "width": info[0].get("width"),
                          "height": info[0].get("height"),
                      })
          json.dump({"search_results": results, "candidates": out}, open("results.json", "w"), indent=2)
          PY
      - name: Download small previews of the top candidates
        run: |
          python3 - <<'PY'
          import json, requests
          HEADERS = {"User-Agent": "shorts-studio-scout/1.0 (https://github.com/mingi201209-star/shorts-studio; one-off research script)"}
          data = json.load(open("results.json"))
          for i, c in enumerate(data["candidates"]):
              url = c.get("thumburl") or c.get("url")
              if not url or not (c.get("mime") or "").startswith("image/"):
                  continue
              try:
                  r = requests.get(url, headers=HEADERS, timeout=20)
                  r.raise_for_status()
              except Exception as e:
                  print("skip", c.get("title"), e)
                  continue
              ext = "jpg"
              open(f"candidate_{i}.{ext}", "wb").write(r.content)
              print("saved", f"candidate_{i}.{ext}", "<-", c.get("title"), len(r.content), "bytes")
          PY
          ls -la
      - name: Publish to a throwaway orphan branch
        run: |
          git config user.name "comet-scout-bot"
          git config user.email "actions@github.com"
          git checkout --orphan scout/comet-more-sources
          git reset --hard
          git add results.json candidate_*.jpg 2>/dev/null || git add results.json
          git commit -m "Throwaway: candidate additional Comet sources for review"
          git push -f origin HEAD:refs/heads/scout/comet-more-sources
