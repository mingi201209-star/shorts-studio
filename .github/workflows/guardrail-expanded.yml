name: Guardrail expanded English narration
on:
  pull_request:
    paths:
      - ".github/workflows/guardrail-expanded.yml"
      - "benchmarks/guardrail_expanded/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  expanded-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -e .
      - name: Fetch the exact completed native staging and proof
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/39111993576 --jq .head_sha)" = d9bd962270da3a7d9afc3054f4c488f0d56b758f
          test "$(gh api repos/$GH_REPO/actions/runs/39111993576 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/39101075134 --jq .head_sha)" = c19904ab5650993bee3d19613ebab25e81f4e844
          test "$(gh api repos/$GH_REPO/actions/runs/39101075134 --jq .conclusion)" = success
          mkdir -p "$RUNNER_TEMP/expanded/chunks"
          gh run download 39111993576 --pattern 'director-footage-*' -D "$RUNNER_TEMP/new"
          gh run download 39111993576 -n guardrail-director-english-review -D "$RUNNER_TEMP/source-proof"
          for start in $(seq 571 30 871); do
            gh run download 39101075134 -n "film-footage-$start" -D "$RUNNER_TEMP/reused/$start"
          done
          find "$RUNNER_TEMP/new" "$RUNNER_TEMP/reused" -type f \( -name 'chunk_*.mp4' -o -name 'shard_*.json' \) -exec cp {} "$RUNNER_TEMP/expanded/chunks/" \;
      - name: Replay expanded speech and measured word captions
        env:
          FILM_OUT: ${{ runner.temp }}/expanded
        run: python3 benchmarks/guardrail_expanded/assemble.py speech
      - name: Audit all 900 original native frames and actual final AAC silence
        env:
          FILM_OUT: ${{ runner.temp }}/expanded
          EXPANDED_SOURCE_PROOF: ${{ runner.temp }}/source-proof/director_validation.json
        run: python3 benchmarks/guardrail_expanded/assemble.py assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guardrail-expanded-english-review
          path: |
            ${{ runner.temp }}/expanded/guardrail-expanded-english-30s-1080p.mp4
            ${{ runner.temp }}/expanded/captions.srt
            ${{ runner.temp }}/expanded/film.ass
            ${{ runner.temp }}/expanded/script-en.txt
            ${{ runner.temp }}/expanded/*validation.json
            ${{ runner.temp }}/expanded/director_review_*.jpg
          if-no-files-found: error
          retention-days: 7
