name: Train Wheels V2 ending hotfix

on:
  push:
    branches: [content/train-wheels-v2-pec-pilot]
    paths:
      - .github/workflows/train-wheels-v2-ending-hotfix.yml

permissions:
  contents: write

jobs:
  patch-ending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/train-wheels-v2-pec-pilot
      - name: Replace recycled resolution ending with concept synthesis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('examples/train_wheels_v2.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          scene = next(s for s in data['scenes'] if s['id'] == 's_payoff2')
          scene['visual_description'] = '크리프·서스펜션·굴림 반지름 차이를 함께 보여주는 최종 개념 종합'
          scene['asset'] = 'assets/train_wheels_v2/clue2_wide.png'
          scene['visual_beats'] = [
              {'start': 0.0, 'asset': 'assets/train_wheels_v2/clue2_wide.png'},
              {'start': 1.8, 'asset': 'assets/train_wheels_v2/flange_seed_close_a.png'},
              {'start': 3.6, 'asset': 'assets/train_wheels_v2/reveal_wide.png'},
              {'start': 5.4, 'asset': 'assets/train_wheels_v2/clue1_close_b.png'},
              {'start': 7.2, 'asset': 'assets/train_wheels_v2/flange_question_wide.png'},
              {'start': 9.0, 'asset': 'assets/train_wheels_v2/reveal_close_b.png'},
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/train_wheels_v2.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: replace recycled Train Wheels V2 ending visuals'
          git push origin HEAD:content/train-wheels-v2-pec-pilot
