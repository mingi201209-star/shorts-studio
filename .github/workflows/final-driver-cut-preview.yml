name: Final driver-cut B preview (read-only, base64-in-log)
# Downloads the already-completed, already-verified driver-cut film
# (run 42126325132, artifact driver-cut-idle-motion-B,
# PROGRESSIVE_FILM_PASS B 35b325e1b71c4c7524d1840ca91c420ea4358819c09f7004
# 382465689f38e4e6) and prints base64 JPEG stills at a handful of
# representative timestamps, including the two destination ranges the
# driver splice actually replaced (driver_notices_warning ~22.1-23.6s,
# driver_turns_wheel ~28.8-29.5s). Renders nothing new; read-only.
on:
  push:
    branches: [native-b-rerender-20261105]
    paths:
      - .github/workflows/final-driver-cut-preview.yml
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install Pillow
      - name: Download the already-completed, already-verified driver-cut film
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final"
          gh run download 42126325132 --repo "$GITHUB_REPOSITORY" --name driver-cut-idle-motion-B --dir "$RUNNER_TEMP/final"
          find "$RUNNER_TEMP/final" -iname '*.mp4'
          sha256sum "$RUNNER_TEMP/final/curious-mechanics-B-driver-cut.mp4"
      - name: Extract representative stills (opening, mid, both spliced driver ranges, ending)
        run: |
          set -euo pipefail
          python benchmarks/road_safety/extract_video_timestamps_b64.py --video "$RUNNER_TEMP/final/curious-mechanics-B-driver-cut.mp4" --label FINAL --timestamps 1.0 10.0 22.5 23.5 29.0 29.8 --width 720
