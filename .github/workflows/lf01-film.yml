name: LF01 long-form film PREVIEW (16:9, every episode's shots rendered on free runners, composed to 1920x1080)
# Long-form 1: renders every shot of the long film with each episode's own renderer (16:9, no text), builds the mix on the frozen narration, writes the .srt and the chapters, and runs every gate.
# Starts only when the request file changes. Never uploads anything.
on:
  push:
    branches: [claude/focused-ptolemy-6o7vl9]
    paths:
      - examples/experiments/lf01-film-request.json
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      shards: ${{ steps.p.outputs.shards }}
      frames_run: ${{ steps.p.outputs.frames_run }}
      render: ${{ steps.p.outputs.render }}
      res_scale: ${{ steps.p.outputs.res_scale }}
      samples: ${{ steps.p.outputs.samples }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, ".")
          from benchmarks.longform import lf01
          req = json.load(open("examples/experiments/lf01-film-request.json"))
          lay = lf01.layout()
          size = int(req.get("shard", 36))
          every = []
          for ep, shots in lay["episodes"].items():
              n = sum(s["frames"] for s in shots)
              every += [{"episode": ep, "start": s, "end": min(s + size - 1, n - 1)} for s in range(0, n, size)]
          # frames_run: reuse that run's shards; rerender {episode: [[first, last], ...]} (virtual frames): render only the shards
          # that touch those frames here, on top of the reused ones (same shard size, resolution and samples as frames_run)
          base = str(req.get("frames_run", ""))
          redo = req.get("rerender", {}) if base else {}
          if base:
              include = [sh for sh in every if any(sh["start"] <= b and a <= sh["end"] for a, b in redo.get(sh["episode"], []))]
          else:
              include = every
          assert len(include) <= 256, len(include)
          print("res_scale=" + str(float(req.get("res_scale", 0.6667))))
          print("samples=" + str(int(req.get("samples", 16))))
          print("frames_run=" + base)
          print("render=" + ("true" if include else "false"))
          print("shards=" + str(len(every)))
          print("matrix=" + json.dumps({"include": include or [{"episode": "none", "start": 0, "end": 0}]}))
          PY
  frames:
    needs: plan
    if: ${{ needs.plan.outputs.render == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          # official site first, then public mirrors: some runners get a persistent 403 from download.blender.org.
          # Whatever the source, the pinned SHA-256 below decides whether the file is accepted.
          got=0
          for base in https://download.blender.org/release https://ftp.nluug.nl/pub/graphics/blender/release \
                      https://mirror.clarkson.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release; do
            rm -f "$RUNNER_TEMP/blender.tar.xz"
            if curl -fLsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 280 "$base/Blender5.0/blender-5.0.1-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz" \
               && echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -; then
              echo "Blender downloaded from $base"; got=1; break
            fi
            echo "download from $base failed or did not match the pinned hash; trying the next source"
          done
          test "$got" = 1
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Download pinned CC0 car scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GITHUB_REPOSITORY" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render ${{ matrix.episode }} frames ${{ matrix.start }}-${{ matrix.end }}
        env:
          LF_FILM: lf01
          LF_EPISODE: ${{ matrix.episode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/longform/render_lf.py -- \
            --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" \
            --frames ${{ matrix.start }}-${{ matrix.end }} \
            --res-scale ${{ needs.plan.outputs.res_scale }} --samples ${{ needs.plan.outputs.samples }} --out "$RUNNER_TEMP/native" > "$RUNNER_TEMP/native/render.log" 2>&1 || { tail -40 "$RUNNER_TEMP/native/render.log"; exit 1; }
          grep -c "_FRAME {" "$RUNNER_TEMP/native/render.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lf01-panels-${{ matrix.episode }}-${{ matrix.start }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 7
  final:
    needs: [plan, frames]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.frames.result == 'success' || needs.frames.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          # the runner package mirror sometimes stalls for many minutes: skip apt when ffmpeg is already installed; one short bounded apt attempt, then a static ffmpeg from PyPI (imageio-ffmpeg)
          if ! command -v ffmpeg >/dev/null 2>&1; then
            (timeout 90 sudo apt-get update -qq && timeout 150 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=20 ffmpeg fonts-dejavu-core) || echo "apt failed or too slow"
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            python -m pip install imageio-ffmpeg==0.6.0
            mkdir -p "$HOME/bin" && ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
            echo "$HOME/bin" >> "$GITHUB_PATH"; export PATH="$HOME/bin:$PATH"
          fi
          command -v ffmpeg
          ffmpeg -hide_banner -filters | grep -E " ass " || { echo "this ffmpeg has no libass filter"; exit 1; }
      - run: python -m pip install Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93 numpy
      - name: Use the large temporary disk for the long film
        run: |
          # a long film's rendered and composed frames are tens of GB: put them on /mnt when the runner has it
          if [ -d /mnt ] && sudo mkdir -p /mnt/lf && sudo chown "$USER" /mnt/lf; then echo "LF_WORK=/mnt/lf" >> "$GITHUB_ENV"; else echo "LF_WORK=$RUNNER_TEMP" >> "$GITHUB_ENV"; fi
          df -h / /mnt || true
      - name: Retrieve frame shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$LF_WORK/native"
          base="${{ needs.plan.outputs.frames_run }}"
          if [ -n "$base" ]; then
            gh run download "$base" --repo "$GITHUB_REPOSITORY" --pattern 'lf01-panels-*' --dir "$LF_WORK/native"
          fi
          if [ "${{ needs.plan.outputs.render }}" = "true" ]; then
            # this run's shards (all of them, or only the re-rendered ones on top of frames_run)
            mkdir -p "$LF_WORK/fresh"
            gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'lf01-panels-*' --dir "$LF_WORK/fresh"
            for d in "$LF_WORK/fresh"/*; do
              n="$(basename "$d")"
              if [ -n "$base" ]; then echo "re-rendered shard $n replaces run $base's"; fi
              rm -rf "$LF_WORK/native/$n"; mv "$d" "$LF_WORK/native/$n"
            done
          fi
          test "$(ls "$LF_WORK/native" | wc -l)" = "${{ needs.plan.outputs.shards }}"
      - name: Compose, mux and run every gate
        id: gates
        continue-on-error: true
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/longform/assemble_lf.py --film lf01 --panels "$LF_WORK/native" --frames-dir "$LF_WORK/composed" --out "$RUNNER_TEMP/final"
      - name: Contact sheet and hashes
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/final/lf01-1920x1080.mp4"
          ffmpeg -v error -i "$f" -vf "fps=0.2,scale=256:144,tile=8x9" -frames:v 1 -q:v 5 "$RUNNER_TEMP/sheet.jpg"
          echo "SHEET_B64_START"; base64 -w0 "$RUNNER_TEMP/sheet.jpg"; echo ""; echo "SHEET_B64_END"
          sha256sum "$RUNNER_TEMP"/final/*.mp4
          ls -l "$RUNNER_TEMP"/final/*.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lf01-film-final
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 14
      - name: Fail the run if any gate failed
        if: steps.gates.outcome == 'failure'
        run: exit 1
