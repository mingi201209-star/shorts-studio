name: Jersey barrier production (full render + real audio + QA)
# Full production run for the jersey-barrier-ribbon episode (replacing
# retroreflective-road-paint on this branch): real narration capture
# (edge-tts, en-US-AndrewNeural, same voice/rate as every other episode in
# this project), the full 690-frame procedural render (23 shards of 30
# frames, matching the house shard layout), and final assembly + the real
# technical QA this project uses everywhere (no CLIP semantic gate yet --
# content_screen_match stays explicitly NOT_IMPLEMENTED).
#
# native/final are gated off (if: false) until a cheap preview run has been
# visually and numerically inspected -- same discipline this branch used for
# the road-paint episode's lighting fix. Re-enable only after that check.
on:
  push:
    branches: [road-paint-retroreflective-20261106]
    paths:
      - .github/workflows/jersey-barrier-production.yml
      - examples/experiments/jersey-barrier-speech-plan.json
      - examples/experiments/jersey-barrier-manifest.json
      - benchmarks/road_safety/curious_mechanics_speech.py
      - benchmarks/road_safety/curious_mechanics_audio.py
      - benchmarks/road_safety/render_jersey_barrier.py
      - benchmarks/road_safety/assemble_jersey_barrier.py
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  speech:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install edge-tts
      - name: Capture real narration (edge-tts, Andrew voice, real WordBoundary timing)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/speech"
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_speech.py \
            --plan examples/experiments/jersey-barrier-speech-plan.json \
            --target-seconds 23.0 \
            --out "$RUNNER_TEMP/speech"
          cat "$RUNNER_TEMP/speech/jersey-barrier-ribbon/capture.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jersey-barrier-speech-capture
          path: ${{ runner.temp }}/speech/
          if-no-files-found: error
          retention-days: 14

  audio:
    needs: speech
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow pydantic
      - name: Download the captured narration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --name jersey-barrier-speech-capture --dir "$RUNNER_TEMP/speech"
      - name: Assemble narration.wav + captions from the real captured beats
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio"
          PYTHONPATH="$PWD" python -c "
          from pathlib import Path
          from benchmarks.road_safety.curious_mechanics_audio import build
          build(Path('$RUNNER_TEMP/speech/jersey-barrier-ribbon'), Path('$RUNNER_TEMP/audio'), target_seconds=23.0)
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jersey-barrier-audio
          path: ${{ runner.temp }}/audio/
          if-no-files-found: error
          retention-days: 14

  native:
    # Re-enabled: preview run 42388447130 confirmed all six shots frame
    # correctly after fixing the car-visibility, exposure, and
    # camera-inside-geometry bugs found across runs 42386915851 through
    # 42388175956.
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        start: [1, 31, 61, 91, 121, 151, 181, 211, 241, 271, 301, 331, 361, 391, 421, 451, 481, 511, 541, 571, 601, 631, 661]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render 30 contiguous absolute frames
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          end=$((${{ matrix.start }} + 29))
          if [ "$end" -gt 690 ]; then end=690; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/road_safety/render_jersey_barrier.py -- \
            --manifest examples/experiments/jersey-barrier-manifest.json \
            --start ${{ matrix.start }} --end "$end" \
            --out "$RUNNER_TEMP/native" 2>&1 | tee "$RUNNER_TEMP/native/render.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jersey-barrier-native-${{ matrix.start }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 14

  final:
    needs: [native, audio]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Retrieve all 32 native shards and the real audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/audio"
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'jersey-barrier-native-*' --dir "$RUNNER_TEMP/native"
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = 23
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --name jersey-barrier-audio --dir "$RUNNER_TEMP/audio"
      - name: Assemble final MP4 and run real technical QA
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/assemble_jersey_barrier.py \
            --native "$RUNNER_TEMP/native" \
            --audio "$RUNNER_TEMP/audio" \
            --manifest examples/experiments/jersey-barrier-manifest.json \
            --out "$RUNNER_TEMP/final"
          sha256sum "$RUNNER_TEMP/final/jersey-barrier-ribbon.mp4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jersey-barrier-final
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 14
