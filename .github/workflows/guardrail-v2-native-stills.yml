name: Guardrail V2 native visual proof (draft PR only)

on:
  pull_request:
    paths:
      - ".github/workflows/guardrail-v2-native-stills.yml"
      - "benchmarks/guardrail_v2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Blender
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "BLENDER_EXE=$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Acquire checksum-verified CC0 assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          curl -fLsS --retry 2 --max-time 120 https://www.innerscene.com/api/library/sedan-car-42109739/download -o "$RUNNER_TEMP/assets/sedan-original.glb"
          curl -fLsS --retry 2 --max-time 120 https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/suburban_field_01_1k.hdr -o "$RUNNER_TEMP/assets/suburban_field_01_1k.hdr"
          curl -fLsS --retry 2 --max-time 120 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/asphalt_01/asphalt_01_diff_1k.jpg -o "$RUNNER_TEMP/assets/asphalt_01_diff_1k.jpg"
          echo "4cb896f740de4da871c1d87c4af2b734db3d1e8fac852e308f1fca03a63b25d3  $RUNNER_TEMP/assets/sedan-original.glb" | sha256sum -c -
          echo "785278f45fbe4714782d7f291e6abc9e58f1d705c2c2fe3743d11eee63f34ea5  $RUNNER_TEMP/assets/suburban_field_01_1k.hdr" | sha256sum -c -
          echo "99b6f6bdfbd09279f3f550ac9593336df541aa2319537566eeb3e737d8512010  $RUNNER_TEMP/assets/asphalt_01_diff_1k.jpg" | sha256sum -c -
      - name: Build scene and validate all 90 frames
        env:
          VISUAL_V2_OUTPUT: ${{ runner.temp }}/motion
          VISUAL_V2_ASSET: ${{ runner.temp }}/assets/sedan-original.glb
          VISUAL_LOOK_ASSETS: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          "$BLENDER_EXE" -b -t 4 --python-exit-code 1 --python benchmarks/guardrail_v2/build_scene.py -- scene 100 16
          "$BLENDER_EXE" -b -t 4 "$VISUAL_V2_OUTPUT/guardrail_v2_local.blend" --python-exit-code 1 --python benchmarks/guardrail_v2/apply_look.py
          "$BLENDER_EXE" -b -t 4 "$VISUAL_V2_OUTPUT/guardrail_v2_local.blend" --python-exit-code 1 --python benchmarks/guardrail_v2/validate_scene.py --python benchmarks/guardrail_v2/validate_motion.py
      - name: Negative regression checks
        env:
          VISUAL_V2_OUTPUT: ${{ runner.temp }}/motion
        run: |
          "$BLENDER_EXE" -b -t 4 "$VISUAL_V2_OUTPUT/guardrail_v2_local.blend" --python-exit-code 1 --python benchmarks/guardrail_v2/check_motion_regressions.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardrail-motion-scene
          path: |
            ${{ runner.temp }}/motion/guardrail_v2_local.blend
            ${{ runner.temp }}/motion/*validation.json
          if-no-files-found: error
          retention-days: 3

  native-motion:
    needs: motion-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {start: 1, end: 10}
          - {start: 11, end: 20}
          - {start: 21, end: 30}
          - {start: 31, end: 40}
          - {start: 41, end: 50}
          - {start: 51, end: 60}
          - {start: 61, end: 70}
          - {start: 71, end: 80}
          - {start: 81, end: 90}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: guardrail-motion-scene
          path: ${{ runner.temp }}/motion
      - name: Install pinned Blender
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render contiguous native frames
        env:
          VISUAL_V2_OUTPUT: ${{ runner.temp }}/frames
          PROOF_START: ${{ matrix.start }}
          PROOF_END: ${{ matrix.end }}
        run: |
          "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 "$RUNNER_TEMP/motion/guardrail_v2_local.blend" --python-exit-code 1 --python benchmarks/guardrail_v2/render_motion.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-motion-${{ matrix.start }}
          path: ${{ runner.temp }}/frames/frame_*.png
          if-no-files-found: error
          retention-days: 3

  assemble-motion:
    needs: native-motion
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-motion-*
          merge-multiple: true
          path: ${{ runner.temp }}/frames
      - name: Validate native frame sequence and encode
        env:
          VISUAL_V2_OUTPUT: ${{ runner.temp }}/frames
        run: |
          set -euo pipefail
          python3 benchmarks/guardrail_v2/validate_frames.py
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          ffmpeg -nostdin -hide_banner -loglevel error -y -framerate 30 -start_number 1 -i "$VISUAL_V2_OUTPUT/frame_%04d.png" -frames:v 90 -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p -movflags +faststart "$VISUAL_V2_OUTPUT/guardrail-motion-1080p.mp4"
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$VISUAL_V2_OUTPUT/guardrail-motion-1080p.mp4" -vf "select='eq(n,0)+eq(n,10)+eq(n,21)+eq(n,39)+eq(n,59)+eq(n,89)',scale=270:480,tile=3x2" -frames:v 1 "$VISUAL_V2_OUTPUT/contact-sheet.jpg"
          ffprobe -v error -count_frames -show_streams -show_format -of json "$VISUAL_V2_OUTPUT/guardrail-motion-1080p.mp4" > "$VISUAL_V2_OUTPUT/ffprobe.json"
          python3 benchmarks/guardrail_v2/validate_video.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardrail-motion-review
          path: |
            ${{ runner.temp }}/frames/*.mp4
            ${{ runner.temp }}/frames/contact-sheet.jpg
            ${{ runner.temp }}/frames/*validation.json
            ${{ runner.temp }}/frames/ffprobe.json
          if-no-files-found: error
          retention-days: 3
