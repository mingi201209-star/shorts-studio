name: Curious Mechanics B driver vibration-reaction recovery assembly
# Reuses 15 successful driver shards from run 42410986711. The failed final
# job had already verified 90 unique frames; it stopped only because ffmpeg
# was installed after the encoding command. This workflow never runs Blender.
on:
  push:
    branches: [fix/curious-mechanics-driver-vibration-reaction-20261108]
    paths:
      - .github/workflows/curious-mechanics-driver-vibration-reaction-recover-b.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: curious-mechanics-driver-vibration-reaction-recover-b
  cancel-in-progress: false
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install encoding and unchanged final QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchvision==0.29.1+cpu
          python -m pip install open-clip-torch==3.3.0 Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Retrieve preserved driver and car shards plus exact source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/driver-shards" "$RUNNER_TEMP/driver" "$RUNNER_TEMP/native"             "$RUNNER_TEMP/source/B/audio" "$RUNNER_TEMP/prior"
          gh run download 42410986711 --repo "$GITHUB_REPOSITORY"             --pattern 'driver-vibration-full-shard-*' --dir "$RUNNER_TEMP/driver-shards"
          test "$(find "$RUNNER_TEMP/driver-shards" -name driver-pilot.json | wc -l)" = 15
          gh run download 42380212611 --repo "$GITHUB_REPOSITORY"             --pattern 'curious-progressive-B-causal-*' --dir "$RUNNER_TEMP/native"
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = 30

          gh api -H 'Accept: application/vnd.github+json'             "/repos/$GITHUB_REPOSITORY/actions/artifacts/13081202684/zip"             > "$RUNNER_TEMP/prior.zip"
          echo "fa410b014c38e5e6b39cbba2f63e52b80b97dd475cefe3259b9c44a80a49992e  $RUNNER_TEMP/prior.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/prior.zip" -d "$RUNNER_TEMP/prior"
          cp "$RUNNER_TEMP/prior/B/narration.wav" "$RUNNER_TEMP/source/B/audio/narration.wav"
          cp "$RUNNER_TEMP/prior/B/film.ass" "$RUNNER_TEMP/source/B/audio/film.ass"
          cp "$RUNNER_TEMP/prior/B/audio-validation.json" "$RUNNER_TEMP/source/B/audio/audio-validation.json"
          cp "$RUNNER_TEMP/prior/B/curious-mechanics-B-progressive-v3.mp4"             "$RUNNER_TEMP/source/B/curious-mechanics-B-mechanism-v2.mp4"
          cp "$RUNNER_TEMP/prior/B/film-validation.json" "$RUNNER_TEMP/source/B/revision-validation.json"
          echo "00f8bcb2c088d3104b5018bf22404f4db017449793c6c365e0995458609c39aa  $RUNNER_TEMP/source/B/audio/narration.wav" | sha256sum -c -
          echo "4eabcb1d61cafeefd15282f9300de315a37fa05bee27d049d4b9756ba5eb68b3  $RUNNER_TEMP/source/B/audio/film.ass" | sha256sum -c -
          echo "c5d259be6f2df13879b2a717b8b9ba0ab87ea736e2c0015559ac3aa7a115c537  $RUNNER_TEMP/source/B/audio/audio-validation.json" | sha256sum -c -
          echo "1cb57666230f809b012cd622ac8ac545540fc0df8075970eb9cc03b5efe182a8  $RUNNER_TEMP/source/B/curious-mechanics-B-mechanism-v2.mp4" | sha256sum -c -
      - name: Merge and verify all 90 preserved driver frames
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/driver-shards" "$RUNNER_TEMP/driver" <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path
          shards, out = map(Path, sys.argv[1:])
          receipts = sorted(shards.rglob("driver-pilot.json"))
          assert len(receipts) == 15
          template, hashes, poses = None, {}, []
          for receipt_path in receipts:
              receipt = json.loads(receipt_path.read_text())
              template = template or receipt
              assert receipt["renderer_sha256"] == template["renderer_sha256"]
              assert receipt["resolution"] == [1080, 1920]
              assert receipt["fps"] == 30 and receipt["samples"] == 32
              assert receipt["human_review"] == "UNVERIFIED"
              for name, expected in receipt["png_sha256"].items():
                  source = receipt_path.parent / name
                  assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
                  assert name not in hashes
                  hashes[name] = expected
                  shutil.copyfile(source, out / name)
              poses.extend(receipt["poses"])
          assert set(hashes) == {f"{frame:04d}.png" for frame in range(1, 91)}
          assert len(set(hashes.values())) == 90
          poses.sort(key=lambda row: row["frame"])
          assert [row["frame"] for row in poses] == list(range(1, 91))
          xs = [row["driver_vibration_x_m"] for row in poses]
          zs = [row["driver_vibration_z_m"] for row in poses]
          assert max(xs) - min(xs) >= 0.014
          assert max(zs) - min(zs) >= 0.020
          template["frame_count"] = 90
          template["frame_numbers"] = list(range(1, 91))
          template["poses"] = poses
          template["png_sha256"] = hashes
          template["full_driver_vibration_proof"] = {
              "status": "PASS",
              "lateral_range_m": max(xs) - min(xs),
              "vertical_range_m": max(zs) - min(zs),
              "camera_motion": False,
              "source_run": 42410986711,
          }
          (out / "driver-pilot.json").write_text(json.dumps(template, indent=2) + "\n")
          print("DRIVER_90_FRAME_VIBRATION_PASS", template["full_driver_vibration_proof"])
          PY
          ffmpeg -v error -framerate 30 -i "$RUNNER_TEMP/driver/%04d.png" -frames:v 90             -c:v ffv1 -level 3 "$RUNNER_TEMP/driver/driver-lossless.mkv"
          ffmpeg -v error -i "$RUNNER_TEMP/driver/driver-lossless.mkv"             -c:v libx264 -crf 17 -pix_fmt yuv420p "$RUNNER_TEMP/driver/driver-review.mp4"
      - name: Assemble B with preserved car render and run full QA
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/assemble_driver_cut.py             --native "$RUNNER_TEMP/native"             --source "$RUNNER_TEMP/source/B"             --driver "$RUNNER_TEMP/driver"             --out "$RUNNER_TEMP/final"             --variant B
          sha256sum "$RUNNER_TEMP/final/curious-mechanics-B-driver-cut.mp4"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-mechanics-B-driver-vibration-reaction-recovered
          path: |
            ${{ runner.temp }}/driver/driver-review.mp4
            ${{ runner.temp }}/driver/driver-pilot.json
            ${{ runner.temp }}/final/curious-mechanics-B-driver-cut.mp4
            ${{ runner.temp }}/final/film-validation.json
            ${{ runner.temp }}/final/edit-receipt.json
            ${{ runner.temp }}/final/semantic-results.json
            ${{ runner.temp }}/final/human-semantic-results.json
            ${{ runner.temp }}/final/human-semantic-*.png
          if-no-files-found: error
          retention-days: 14
