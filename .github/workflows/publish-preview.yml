name: Publish rendered preview via git (throwaway)
on:
  push:
    branches: [content/radium-girls]
    paths: [.github/workflows/publish-preview.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shorts-studio-radium-girls
          run-id: 36147484522
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit final.mp4 to a throwaway orphan branch for external retrieval
        run: |
          ls -la dist/
          git config user.name "radium-preview-bot"
          git config user.email "actions@github.com"
          git checkout --orphan preview/radium-girls-video
          git reset --hard
          mkdir -p out
          cp dist/final.mp4 out/final.mp4
          git add out/final.mp4
          git commit -m "Throwaway: publish rendered final.mp4 for external retrieval"
          git push -f origin HEAD:refs/heads/preview/radium-girls-video
