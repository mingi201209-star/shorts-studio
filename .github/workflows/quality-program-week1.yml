name: Quality-first W1 scorecard fail-closed
on:
  push:
    branches: [plan/2026-10-24-eight-week-quality]
    paths:
      - .github/workflows/quality-program-week1.yml
      - shorts_studio/quality_program.py
      - tests/test_quality_program.py
permissions:
  contents: read
  actions: read
jobs:
  week1-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Generate honest first-week baseline before final MP4 is available
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m shorts_studio.quality_program --out build/quality/week01.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/quality/week01.json').read_text())
          assert data['technical_status']=='NOT_MEASURED'
          assert data['human_review']['status']=='NOT_REVIEWED'
          assert data['editorial_decision']=='HOLD'
          assert data['upload_authorized'] is False
          assert data['render_metrics'] is None
          print('WEEK1_BASELINE_EVIDENCE_PENDING_NO_FALSE_PASS')
          PY
      - name: Record actual Episode 2 native runner wall time separately from video QA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/40084843910" > build/quality/episode2-run.json
          gh api "repos/$GH_REPO/actions/runs/40084843910/jobs?per_page=100" > build/quality/episode2-jobs.json
          python -S -m shorts_studio.quality_program --out build/quality/week01.json \
            --workflow-run-json build/quality/episode2-run.json \
            --workflow-jobs-json build/quality/episode2-jobs.json \
            --workflow-out build/quality/episode2-run-timing.json
          python - <<'PY'
          import json
          from pathlib import Path
          timing=json.loads(Path('build/quality/episode2-run-timing.json').read_text())
          assert timing['status'] in ('IN_PROGRESS', 'PASS_WORKFLOW', 'FAILED')
          assert timing['native']['total']==30
          assert timing['upload_authorized'] is False
          if timing['status']=='IN_PROGRESS':
              assert timing['workflow_elapsed_seconds'] is None
          print('WEEK1_REAL_JOB_TIMING_RECORD', timing['status'],
                timing['native']['success'])
          PY
      - name: Preserve quality baseline and factual job timing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eight-week-quality-W1-evidence-pending
          path: |
            build/quality/week01.json
            build/quality/episode2-run-timing.json
          retention-days: 14
          if-no-files-found: error
