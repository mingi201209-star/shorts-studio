name: Curious Mechanics real vibration-transfer close-up proof
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Existing proof run whose native artifacts should be reviewed
        required: true
        type: string
  push:
    branches: [fix/curious-mechanics-vibration-transfer-20261107]
    paths:
      - shorts_studio/factory/curious_mechanics_timeline.py
permissions:
  contents: read
  actions: read
concurrency:
  group: curious-mechanics-vibration-transfer-proof
  cancel-in-progress: false
env:
  RENDERER_SOURCE_SHA256: 04fdc326a6a8a874840072ce82529e777ff0956f5c17c991ad8f87b4e59ac765
jobs:
  native-proof:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - {start: 616, end: 626}
          - {start: 627, end: 637}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Blender and proof dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact pinned CC0 production scene
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render consecutive native Cycles32 frames across trough-to-crest motion
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-progressive-B.json --start ${{ matrix.start }} --end ${{ matrix.end }} --out "$RUNNER_TEMP/rumble" 2>&1 | tee "$RUNNER_TEMP/rumble/render.log"
      - name: Verify native geometry, contact, hashes and lossless intermediate
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_shard_artifact.py --out "$RUNNER_TEMP/rumble" --manifest examples/experiments/curious-mechanics-progressive-B.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibration-transfer-proof-${{ matrix.start }}
          path: ${{ runner.temp }}/rumble/
          if-no-files-found: error
          retention-days: 7

  review-clip:
    needs: native-proof
    if: ${{ always() && (needs.native-proof.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: vibration-transfer-proof-*
          path: ${{ runner.temp }}/proof
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run || github.run_id }}
      - name: Verify and assemble the actual consecutive frames
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pydantic
          mkdir -p "$RUNNER_TEMP/frames" "$RUNNER_TEMP/review"
          find "$RUNNER_TEMP/proof" -name 'frame_*.png' -exec cp {} "$RUNNER_TEMP/frames/" \;
          test "$(find "$RUNNER_TEMP/frames" -name 'frame_*.png' | wc -l)" = 22
          test "$(sha256sum "$RUNNER_TEMP"/frames/frame_*.png | cut -d' ' -f1 | sort -u | wc -l)" = 22
          ffmpeg -hide_banner -loglevel error -framerate 30 -start_number 616 -i "$RUNNER_TEMP/frames/frame_%04d.png" -frames:v 22 -c:v ffv1 -level 3 "$RUNNER_TEMP/review/vibration-transfer-lossless.mkv"
          ffmpeg -hide_banner -loglevel error -framerate 30 -start_number 616 -i "$RUNNER_TEMP/frames/frame_%04d.png" -frames:v 22 -c:v libx264 -crf 12 -preset slow -pix_fmt yuv420p -movflags +faststart "$RUNNER_TEMP/review/vibration-transfer-review.mp4"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from shorts_studio.factory.curious_mechanics_timeline import rumble_displacement
          review = Path(os.environ["RUNNER_TEMP"]) / "review"
          frames = list(range(616, 638))
          values = [rumble_displacement(f) for f in frames]
          report = {
              "frames": frames,
              "native_png_count": len(frames),
              "expected_sprung_body_range_m": round(max(values) - min(values), 7),
              "tyre_contact_policy": "wheel pivots counter-translate sprung-body bounce; original geometry retained",
              "quality": {"resolution": [1080, 1920], "fps": 30, "cycles_samples": 32},
              "lossless_sha256": hashlib.sha256((review / "vibration-transfer-lossless.mkv").read_bytes()).hexdigest(),
              "review_sha256": hashlib.sha256((review / "vibration-transfer-review.mp4").read_bytes()).hexdigest(),
              "upload_authorized": False,
              "human_first_view": "UNVERIFIED",
          }
          assert report["expected_sprung_body_range_m"] > .045
          (review / "vibration-transfer-proof.json").write_text(json.dumps(report, indent=2))
          print("VIBRATION_TRANSFER_NATIVE_PROOF_READY", json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibration-transfer-native-review
          path: ${{ runner.temp }}/review/
          if-no-files-found: error
          retention-days: 7
