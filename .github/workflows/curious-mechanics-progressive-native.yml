name: Curious Mechanics progressive native films
on:
  push:
    branches: [exp/curious-mechanics-production-20261029]
    paths: [.github/workflows/curious-mechanics-progressive-native.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: curious-mechanics-progressive-native
  cancel-in-progress: false
env:
  RENDERER_SOURCE_SHA256: 700c523fac79cbafac3e763e0e9bbace429c6deff89da1ddbf97616f143debae
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix:
        include:
          - {variant: B, start: 31, end: 60}
          - {variant: B, start: 61, end: 90}
          - {variant: B, start: 91, end: 120}
          - {variant: B, start: 151, end: 180}
          - {variant: B, start: 181, end: 210}
          - {variant: B, start: 211, end: 240}
          - {variant: B, start: 241, end: 270}
          - {variant: B, start: 271, end: 300}
          - {variant: B, start: 331, end: 360}
          - {variant: B, start: 361, end: 390}
          - {variant: B, start: 391, end: 420}
          - {variant: B, start: 421, end: 450}
          - {variant: B, start: 481, end: 510}
          - {variant: B, start: 511, end: 540}
          - {variant: B, start: 541, end: 570}
          - {variant: B, start: 571, end: 600}
          - {variant: B, start: 601, end: 630}
          - {variant: B, start: 631, end: 660}
          - {variant: B, start: 661, end: 690}
          - {variant: B, start: 691, end: 720}
          - {variant: B, start: 721, end: 750}
          - {variant: B, start: 781, end: 810}
          - {variant: B, start: 811, end: 840}
          - {variant: B, start: 841, end: 870}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 30 contiguous absolute original frames
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-progressive-${{ matrix.variant }}.json --start ${{ matrix.start }} --end ${{ matrix.end }} --out "$RUNNER_TEMP/rumble" 2>&1 | tee "$RUNNER_TEMP/rumble/render.log"
      - name: Native shard QA and lossless intermediate
        run: |
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_shard_artifact.py --out "$RUNNER_TEMP/rumble" --manifest examples/experiments/curious-mechanics-progressive-${{ matrix.variant }}.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-progressive-${{ matrix.variant }}-${{ matrix.start }}
          path: ${{ runner.temp }}/rumble/
          if-no-files-found: error
          retention-days: 7

  final:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [A, B, C]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve new native shards and preserved measured audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'curious-progressive-B-*' --dir "$RUNNER_TEMP/native"
          gh run download 41197516170 --repo "$GITHUB_REPOSITORY" --pattern 'curious-progressive-B-*' --dir "$RUNNER_TEMP/native"
          if [ '${{ matrix.variant }}' = A ]; then
            gh run download 41190640057 --repo "$GITHUB_REPOSITORY" --name curious-mechanics-causal-revision-A --dir "$RUNNER_TEMP/source"
          else
            gh run download 41191337000 --repo "$GITHUB_REPOSITORY" --name curious-mechanics-causal-revision-${{ matrix.variant }} --dir "$RUNNER_TEMP/source"
          fi
      - name: Install unchanged observed final QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchvision==0.29.1+cpu
          python -m pip install open-clip-torch==3.3.0 Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Verify every native PNG and lossless clip; assemble five single-use roles
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_progressive_delivery.py --native "$RUNNER_TEMP/native" --source "$RUNNER_TEMP/source/${{ matrix.variant }}" --variant '${{ matrix.variant }}' --out "$RUNNER_TEMP/final/${{ matrix.variant }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-progressive-review-${{ matrix.variant }}
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 7

