name: tts-continuity-render

on:
  push:
    branches: [exp/tts-naturalness-v2]
    paths:
      - 'shorts_studio/**'
      - 'tests/**'
      - 'scripts/build_hydroplaning_states.py'
      - 'scripts/build_tts_continuity_ab.py'
      - '.github/workflows/tts-continuity-render.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [exp/tts-subtle-breathing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render and vision dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'

      - name: Full regression
        run: pytest -q

      - name: Build shared hydroplaning production
        run: |
          set -o pipefail
          python scripts/build_hydroplaning_states.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf 2>&1 | tee hydroplaning-generator.log

      - name: Derive single-variable A/B manifests
        run: python scripts/build_tts_continuity_ab.py

      - name: Render A current unitized TTS
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/hydroplaning_tts_unitized.json 2>&1 | tee a-render.log
          mkdir -p continuity_ab
          cp dist/final.mp4 continuity_ab/A_current_unitized.mp4
          cp dist/qa_report.json continuity_ab/A_current_unitized_qa.json
          cp build/*.timing.json continuity_ab/ 2>/dev/null || true
          ffmpeg -y -i dist/final.mp4 -vn -acodec pcm_s16le -ar 24000 continuity_ab/A_current_unitized.wav
          rm -rf build dist

      - name: Rebuild shared visual assets for B
        run: |
          python scripts/build_hydroplaning_states.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf >/dev/null
          python scripts/build_tts_continuity_ab.py >/dev/null

      - name: Render B scene-continuous TTS
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/hydroplaning_tts_continuous.json 2>&1 | tee b-render.log
          cp dist/final.mp4 continuity_ab/B_scene_continuous.mp4
          cp dist/qa_report.json continuity_ab/B_scene_continuous_qa.json
          mkdir -p continuity_ab/B_timing
          cp build/*.timing.json continuity_ab/B_timing/ 2>/dev/null || true
          ffmpeg -y -i dist/final.mp4 -vn -acodec pcm_s16le -ar 24000 continuity_ab/B_scene_continuous.wav

      - name: Verify A and B pass existing production gates
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          summary = {}
          for label in ("A_current_unitized", "B_scene_continuous"):
              q = json.loads(Path(f"continuity_ab/{label}_qa.json").read_text())
              assert q["status"] == "PASS", (label, q)
              assert q["semantic_visual_qa"]["status"] == "PASS"
              fv = q["final_video_qa"]
              assert fv["status"] == "PASS", (label, fv)
              checks = fv["checks"]
              for key in (
                  "retention_contract",
                  "first_10s_retention",
                  "meaningful_visual_changes",
                  "visual_production_v2",
                  "visual_activity_real",
                  "visual_cut_cadence",
                  "captions_visible",
                  "safe_area_clean",
              ):
                  assert checks[key]["status"] == "PASS", (label, key, checks[key])

              video = Path(f"continuity_ab/{label}.mp4")
              probe = json.loads(subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-show_entries", "stream=codec_type,width,height",
                      "-of", "json", str(video),
                  ],
                  capture_output=True, text=True, check=True,
              ).stdout)
              vs = next(s for s in probe["streams"] if s["codec_type"] == "video")
              assert (vs["width"], vs["height"]) == (1080, 1920)
              assert any(s["codec_type"] == "audio" for s in probe["streams"])
              summary[label] = {
                  "duration_seconds": float(probe["format"]["duration"]),
                  "qa_status": q["status"],
                  "first_10s_retention": checks["first_10s_retention"],
                  "visual_activity_real": checks["visual_activity_real"],
              }

          Path("continuity_ab/summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tts-continuity-production-ab
          retention-days: 14
          path: |
            continuity_ab/
            examples/hydroplaning_tts_unitized.json
            examples/hydroplaning_tts_continuous.json
            hydroplaning-generator.log
            a-render.log
            b-render.log

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: tts-continuity-production-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            continuity_ab/
            build/
            dist/
            hydroplaning-generator.log
            a-render.log
            b-render.log
