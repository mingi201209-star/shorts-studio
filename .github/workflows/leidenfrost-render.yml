name: leidenfrost-render
on:
  pull_request:
    branches:
      - main
      - feat/prompt-v2-hook-story
    paths:
      - 'shorts_studio/**'
      - 'scripts/build_leidenfrost_states.py'
      - 'examples/leidenfrost_upload_description.txt'
      - '.github/workflows/leidenfrost-render.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render and semantic QA dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-nanum librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'
      - name: Full regression
        run: pytest -q
      - name: Generate Leidenfrost production
        run: |
          set -o pipefail
          python scripts/build_leidenfrost_states.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf 2>&1 | tee leidenfrost-generator.log
      - name: Verify success-pattern production features
        run: |
          grep -q '^PROMPT_V2_SELECTED_HOOK=' leidenfrost-generator.log
          grep -q '^STORY_PROMPT_V3_READY=' leidenfrost-generator.log
          grep -q '^MOVING_VISUAL_READY=' leidenfrost-generator.log
          grep -q '^PUBLIC_DOMAIN_CHART_READY=' leidenfrost-generator.log
          test -s assets/leidenfrost/opening_motion.mp4
          test -s build/leidenfrost_story_prompt.txt
      - name: Validate manifest
        run: python -m shorts_studio validate examples/leidenfrost.json
      - name: Verify curiosity contract
        run: |
          python - <<'PY'
          from shorts_studio.project import load_project
          from shorts_studio.hook_studio import verify_curiosity_maintained
          p=load_project('examples/leidenfrost.json')
          r=verify_curiosity_maintained(p)
          assert r['status']=='PASS',r
          print(r)
          PY
      - name: Render Leidenfrost short
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/leidenfrost.json 2>&1 | tee leidenfrost-render.log
      - name: Verify final deliverable and QA
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          video=Path('dist/final.mp4')
          assert video.is_file() and video.stat().st_size>0
          p=subprocess.run(['ffprobe','-v','error','-of','json','-show_entries','stream=codec_name,width,height','-show_entries','format=duration',str(video)],capture_output=True,text=True,check=True)
          probe=json.loads(p.stdout)
          vs=next(s for s in probe['streams'] if 'width' in s)
          assert (vs['width'],vs['height'])==(1080,1920)
          q=json.loads(Path('dist/qa_report.json').read_text())
          assert q['status']=='PASS',q
          assert q['semantic_visual_qa']['status']=='PASS',q['semantic_visual_qa']
          assert q['final_video_qa']['status']=='PASS',q['final_video_qa']
          assert q['final_video_qa']['checks']['retention_contract']['status']=='PASS'
          assert q['final_video_qa']['checks']['first_10s_retention']['status']=='PASS'
          print('Leidenfrost final QA PASS; duration=',probe['format']['duration'])
          PY
      - name: Sample frames
        if: success()
        run: |
          mkdir -p review_frames
          for t in 0.3 2.0 5.0 9.0 15.0 24.0 34.0 42.0; do
            ffmpeg -y -ss "$t" -i dist/final.mp4 -frames:v 1 "review_frames/t_$t.jpg"
          done
      - name: Prepare publish description
        if: success()
        run: cp examples/leidenfrost_upload_description.txt dist/upload-description.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: leidenfrost-success-patterns
          retention-days: 30
          path: |
            dist/
            review_frames/
            build/leidenfrost_story_prompt.txt
            leidenfrost-generator.log
            leidenfrost-render.log
            assets/leidenfrost/
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: leidenfrost-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/
            leidenfrost-generator.log
            leidenfrost-render.log
