name: EP03 speed bump FINAL film (preflight = low resolution, production = full resolution)
# 100% 3D: every picture element is a Blender object (render_speed_bump_3d.py); compose only stacks images. Starts only when the request file changes. mode "preflight": 360x187 panels, 7 samples, every QA gate, all failures in one report, never a deliverable.
# mode "production": 1080x560 panels, 24 samples, 16-frame shards, final assembly + every gate + a 540x960 review copy. Never uploads.
on:
  push:
    branches: [ep03-speed-bump-build-20261115]
    paths:
      - examples/experiments/speed-bump-final-request.json
permissions:
  contents: read
  actions: read
env:
  EP03_FILM: final
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      matrix: ${{ steps.p.outputs.matrix }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          mode = json.load(open("examples/experiments/speed-bump-final-request.json"))["mode"]
          assert mode in ("preflight", "production")
          size = 80 if mode == "preflight" else 16
          starts = list(range(1, 1051, size))
          print("mode=" + mode)
          print("shards=" + str(len(starts)))
          print("matrix=" + json.dumps({"include": [{"start": s, "end": min(s + size - 1, 930)} for s in starts]}))
          PY
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install edge-tts Pillow pydantic
      - name: Capture narration and build narration.wav + captions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/speech" "$RUNNER_TEMP/audio"
          # the free TTS service sometimes returns no audio; start from a clean folder and try up to 4 times
          export SPEECH_REQUEST_GAP=9
          ok=0
          for attempt in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/speech"; mkdir -p "$RUNNER_TEMP/speech"
            if PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_speech.py \
                 --plan examples/experiments/speed-bump-final-speech-plan.json --target-seconds 31.0 --out "$RUNNER_TEMP/speech"; then ok=1; break; fi
            echo "speech capture attempt $attempt failed"; sleep 20
          done
          test "$ok" = 1
          PYTHONPATH="$PWD" python -c "
          from pathlib import Path
          from benchmarks.road_safety.curious_mechanics_audio import build
          from benchmarks.speed_bump.captions import single_line_groups as phrase_groups
          build(Path('$RUNNER_TEMP/speech/speed-bump-shapes'), Path('$RUNNER_TEMP/audio'), target_seconds=31.0, grouper=phrase_groups)
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: speedbump-final-audio
          path: ${{ runner.temp }}/audio/
          if-no-files-found: error
          retention-days: 7
  frames:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          # official site first, then public mirrors: some runners get a persistent 403 from download.blender.org.
          # Whatever the source, the pinned SHA-256 below decides whether the file is accepted.
          got=0
          for base in https://download.blender.org/release https://ftp.nluug.nl/pub/graphics/blender/release \
                      https://mirror.clarkson.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release; do
            rm -f "$RUNNER_TEMP/blender.tar.xz"
            if curl -fLsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 280 "$base/Blender5.0/blender-5.0.1-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz" \
               && echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -; then
              echo "Blender downloaded from $base"; got=1; break
            fi
            echo "download from $base failed or did not match the pinned hash; trying the next source"
          done
          test "$got" = 1
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Download pinned CC0 car scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GITHUB_REPOSITORY" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render panels ${{ matrix.start }}-${{ matrix.end }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          flag=""; if [ "${{ needs.plan.outputs.mode }}" = "preflight" ]; then flag="--preview"; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/speed_bump/render_speed_bump_3d.py -- \
            --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" \
            --start ${{ matrix.start }} --end ${{ matrix.end }} $flag --out "$RUNNER_TEMP/native" > "$RUNNER_TEMP/native/render.log" 2>&1 || { tail -40 "$RUNNER_TEMP/native/render.log"; exit 1; }
          grep -c BUMP_FRAME "$RUNNER_TEMP/native/render.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: speedbump-final-panels-${{ matrix.start }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 7
  final:
    needs: [plan, audio, frames]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93 numpy
      - name: Retrieve panel shards and audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/audio"
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'speedbump-final-panels-*' --dir "$RUNNER_TEMP/native"
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = "${{ needs.plan.outputs.shards }}"
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --name speedbump-final-audio --dir "$RUNNER_TEMP/audio"
      - name: Compose the 930 film frames
        run: PYTHONPATH="$PWD" python benchmarks/speed_bump/compose_speed_bump.py --panels "$RUNNER_TEMP/native" --out "$RUNNER_TEMP/composed"
      - name: Assemble and run every QA gate
        id: gates
        continue-on-error: true
        run: |
          set -euo pipefail
          flag=""; if [ "${{ needs.plan.outputs.mode }}" = "preflight" ]; then flag="--preflight"; fi
          PYTHONPATH="$PWD" python benchmarks/speed_bump/assemble_speed_bump.py --frames "$RUNNER_TEMP/composed" --audio "$RUNNER_TEMP/audio" \
            --manifest examples/experiments/speed-bump-final-manifest.json --out "$RUNNER_TEMP/final" $flag
      - name: Contact sheet, spoken windows, loudness
        run: |
          set -euo pipefail
          f=$(ls "$RUNNER_TEMP"/final/*.mp4 | head -1)
          ffmpeg -v error -i "$f" -vf "fps=1,scale=180:320,tile=8x4" -frames:v 1 -q:v 4 "$RUNNER_TEMP/sheet.jpg"
          echo "SHEET_B64_START"; base64 -w0 "$RUNNER_TEMP/sheet.jpg"; echo ""; echo "SHEET_B64_END"
          ffmpeg -hide_banner -nostats -i "$f" -af ebur128 -f null - 2>&1 | grep -A3 "Integrated loudness" | sed 's/^/LOUDNESS_EBUR128 /' || true
          ffmpeg -v error -i "$f" -vf scale=540:960 -c:v libx264 -crf 24 -preset fast -c:a aac -b:a 96k "$RUNNER_TEMP/final/speed-bump-final-540x960-review.mp4"
          sha256sum "$RUNNER_TEMP"/final/*.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: speedbump-final-final-${{ needs.plan.outputs.mode }}
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 14
      - name: Fail the run if any gate failed
        if: steps.gates.outcome != 'success'
        run: exit 1
