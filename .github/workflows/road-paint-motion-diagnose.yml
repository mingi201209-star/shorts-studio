name: Road paint motion fix diagnose (cheap, samples=7, no full re-render)
# Debug-only: renders ONLY the three shots whose real visual_activity QA
# failed on run 42322407163 (night_wide: 0 real pixel changes in the first
# 5s; bead_macro_ray: 7.0s static; bead_macro_closing: 5.5s static), using
# road-paint-manifest-diagnose.json (cycles_samples=7, same resolution/fps/
# shot layout) so noise-free QA numbers come back in minutes instead of
# the ~1h a full 32-shard production-quality render costs. Delete this
# workflow (and the diagnose manifest) once the motion fix in
# render_road_paint.py is confirmed and the real production run passes.
on:
  push:
    branches: [road-paint-retroreflective-20261106]
    paths:
      - .github/workflows/road-paint-motion-diagnose.yml
      - examples/experiments/road-paint-manifest-diagnose.json
      - benchmarks/road_safety/render_road_paint.py
      - benchmarks/road_safety/motion_diagnose.py
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        start: [1, 31, 61, 91, 121, 151, 271, 301, 331, 361, 391, 421, 451, 481, 781, 811, 841, 871, 901, 931]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render 30 contiguous frames at cycles_samples=7
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          end=$((${{ matrix.start }} + 29))
          if [ "$end" -gt 960 ]; then end=960; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/road_safety/render_road_paint.py -- \
            --manifest examples/experiments/road-paint-manifest-diagnose.json \
            --start ${{ matrix.start }} --end "$end" \
            --out "$RUNNER_TEMP/native" 2>&1 | tee "$RUNNER_TEMP/native/render.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: road-paint-motion-diag-${{ matrix.start }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 3

  measure:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install opencv-python-headless==5.0.0.93
      - name: Download all diagnose shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'road-paint-motion-diag-*' --dir "$RUNNER_TEMP/native"
      - name: Build one silent clip per fixed shot and measure real visual_activity
        run: PYTHONPATH="$PWD" python benchmarks/road_safety/motion_diagnose.py
