name: Scout many more real Radium Girls images (throwaway)
on:
  push:
    branches: [content/radium-girls]
    paths: [.github/workflows/scout-images-2.yml]

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Discover a much broader set of real candidate images
        run: |
          set -o pipefail
          pip install requests >/dev/null
          python3 - <<'PY'
          import json, time
          import requests

          HEADERS = {"User-Agent": "shorts-studio-scout/1.0 (https://github.com/mingi201209-star/shorts-studio; one-off research script)"}
          WIKI = "https://en.wikipedia.org/w/api.php"
          COMMONS = "https://commons.wikimedia.org/w/api.php"

          file_titles = set()

          def article_images(title):
              r = requests.get(WIKI, params={
                  "action": "query", "titles": title, "prop": "images",
                  "imlimit": "200", "format": "json",
              }, headers=HEADERS, timeout=20)
              r.raise_for_status()
              for p in r.json()["query"]["pages"].values():
                  for im in p.get("images", []):
                      t = im["title"]
                      if t.lower().endswith((".jpg", ".jpeg", ".png")):
                          file_titles.add(t)

          def article_links(title):
              out = []
              plcontinue = None
              for _ in range(3):
                  params = {"action": "query", "titles": title, "prop": "links",
                            "pllimit": "200", "plnamespace": "0", "format": "json"}
                  if plcontinue:
                      params["plcontinue"] = plcontinue
                  r = requests.get(WIKI, params=params, headers=HEADERS, timeout=20)
                  r.raise_for_status()
                  j = r.json()
                  for p in j["query"]["pages"].values():
                      for l in p.get("links", []):
                          out.append(l["title"])
                  if "continue" in j:
                      plcontinue = j["continue"].get("plcontinue")
                  else:
                      break
              return out

          # 1. Direct articles.
          for title in ["Radium Girls", "United States Radium Corporation", "Radium Dial Company"]:
              try:
                  article_images(title)
              except Exception as e:
                  print("article_images FAIL", title, e)

          # 2. Biography pages linked from the main Radium Girls article --
          # picks up individual plaintiff portrait photos.
          try:
              linked = article_links("Radium Girls")
              candidate_people = [t for t in linked if any(k in t for k in [
                  "Fryer", "Hussman", "Schaub", "Maggia", "Larice", "McDonald",
                  "Donohue", "Looney", "Purcell", "Wiley",
              ])]
              print("candidate biography links:", candidate_people)
              for t in candidate_people:
                  try:
                      article_images(t)
                  except Exception as e:
                      print("article_images FAIL", t, e)
          except Exception as e:
              print("article_links FAIL", e)

          # 3. Commons categories.
          for cat in ["Category:Radium Girls", "Category:United States Radium Corporation",
                      "Category:Dial painters", "Category:Radium Dial Company"]:
              try:
                  r = requests.get(COMMONS, params={
                      "action": "query", "list": "categorymembers", "cmtitle": cat,
                      "cmlimit": "200", "cmtype": "file", "format": "json",
                  }, headers=HEADERS, timeout=20)
                  if r.status_code == 200:
                      members = r.json().get("query", {}).get("categorymembers", [])
                      titles = [m["title"] for m in members]
                      print(cat, "->", titles)
                      file_titles.update(titles)
              except Exception as e:
                  print("category FAIL", cat, e)

          # 4. Commons full-text file search for likely numbered variants of
          # the same 1922-23 Argonne photo shoot and other relevant terms.
          for term in ["USRadiumGirls", "radium dial painter", "Undark radium paint", "radium girls lawsuit"]:
              try:
                  r = requests.get(COMMONS, params={
                      "action": "query", "list": "search", "srsearch": term,
                      "srnamespace": "6", "srlimit": "50", "format": "json",
                  }, headers=HEADERS, timeout=20)
                  if r.status_code == 200:
                      hits = [h["title"] for h in r.json().get("query", {}).get("search", [])]
                      print("search", term, "->", hits)
                      file_titles.update(hits)
              except Exception as e:
                  print("search FAIL", term, e)

          file_titles = sorted(file_titles)
          print(f"total unique file titles: {len(file_titles)}")

          out = []
          for i in range(0, len(file_titles), 40):
              batch = file_titles[i:i+40]
              r = requests.get(COMMONS, params={
                  "action": "query", "titles": "|".join(batch), "prop": "imageinfo",
                  "iiprop": "url|size|mime", "format": "json",
              }, headers=HEADERS, timeout=20)
              if r.status_code != 200:
                  continue
              for p in r.json().get("query", {}).get("pages", {}).values():
                  title = p.get("title")
                  info = p.get("imageinfo")
                  if not info:
                      continue
                  out.append({"title": title, "url": info[0]["url"], "mime": info[0].get("mime"), "bytes": info[0].get("size")})

          with open("candidates.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print(f"resolved {len(out)} candidates")
          PY
          cat candidates.json
      - name: Download a small thumbnail of every reasonably-sized candidate for visual review
        run: |
          python3 - <<'PY'
          import json, os, requests
          cands = json.load(open("candidates.json", encoding="utf-8"))
          os.makedirs("thumbs", exist_ok=True)
          manifest = []
          HEADERS = {"User-Agent": "shorts-studio-scout/1.0 (https://github.com/mingi201209-star/shorts-studio; one-off research script)"}
          for i, c in enumerate(cands):
              # Skip huge raw scans (e.g. multi-MB HAER TIFFs) -- not useful
              # for a quick visual pass and slow to fetch.
              if c.get("bytes") and c["bytes"] > 3_000_000:
                  print("SKIP (too large)", c["title"], c["bytes"])
                  continue
              if c.get("mime") not in ("image/jpeg", "image/png"):
                  print("SKIP (not jpg/png)", c["title"], c.get("mime"))
                  continue
              url = c["url"]
              try:
                  r = requests.get(url, timeout=20, headers=HEADERS)
                  r.raise_for_status()
                  ext = ".jpg" if c["mime"] == "image/jpeg" else ".png"
                  fname = f"thumbs/{i:03d}{ext}"
                  with open(fname, "wb") as f:
                      f.write(r.content)
                  manifest.append({"file": fname, **c})
                  print("OK", fname, c["title"], len(r.content))
              except Exception as e:
                  print("FAIL", c["title"], e)
          json.dump(manifest, open("thumbs/manifest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
      - name: Publish candidates + thumbnails to a throwaway orphan branch
        run: |
          git config user.name "radium-scout-bot"
          git config user.email "actions@github.com"
          git checkout --orphan scout/radium-girls-candidates-2
          git reset --hard
          git add thumbs candidates.json
          git commit -m "Throwaway: broader candidate real images for visual review"
          git push -f origin HEAD:refs/heads/scout/radium-girls-candidates-2
