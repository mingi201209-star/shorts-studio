name: Curious Mechanics B native re-render (current timeline.py, full 900 frames)
# Approved re-render (user sign-off 2026-11-05) to unblock the driver_response
# shot replacement: run 42033820281's assembly failed with
# "Experiment input binding mismatch: timeline_source_sha256" because
# shorts_studio/factory/curious_mechanics_timeline.py changed on this branch
# (commits 380b8ff/26b3213/4188225: road_cut top/side camera framing,
# rumble_displacement amplitude 8mm->24mm) after the existing native asset
# bed (runs 41274189435/41298025251) was rendered.
#
# curious_mechanics_native_qa.verify() binds EVERY shard to timeline.py's own
# sha256 at assembly time -- curious-mechanics-b-causal-shot.yml's own
# comment documents this exact principle for the manifest hash ("every
# existing shard is still re-rendered here... because verify() binds each
# shard to the [file]'s own sha256... any edit... changes that hash... this
# is not worked around here: it is an existing integrity check... kept
# intact"). The same reasoning applies to timeline_source_sha256, so ALL 30
# shards (all 900 frames) are re-rendered here, not just the shots whose
# camera actually moved. A and C are not touched or reassembled.
on:
  push:
    branches: [native-b-rerender-20261105]
    paths:
      - ".github/workflows/curious-mechanics-b-timeline-rerender.yml"
permissions:
  contents: read
  actions: read
env:
  RENDERER_SOURCE_SHA256: 04fdc326a6a8a874840072ce82529e777ff0956f5c17c991ad8f87b4e59ac765
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        start: [1, 31, 61, 91, 121, 151, 181, 211, 241, 271, 301, 331, 361, 391, 421, 451, 481, 511, 541, 571, 601, 631, 661, 691, 721, 751, 781, 811, 841, 871]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 30 contiguous absolute frames under the current timeline.py
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          end=$((${{ matrix.start }} + 29))
          if [ "$end" -gt 900 ]; then end=900; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-progressive-B.json --start ${{ matrix.start }} --end "$end" --out "$RUNNER_TEMP/rumble" 2>&1 | tee "$RUNNER_TEMP/rumble/render.log"
      - name: Native shard QA and lossless intermediate
        run: |
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_shard_artifact.py --out "$RUNNER_TEMP/rumble" --manifest examples/experiments/curious-mechanics-progressive-B.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-progressive-B-causal-${{ matrix.start }}
          path: ${{ runner.temp }}/rumble/
          if-no-files-found: error
          retention-days: 14

  final:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve all 30 freshly rendered shards from this run and the preserved B source/audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/source"
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'curious-progressive-B-causal-*' --dir "$RUNNER_TEMP/native"
          ls "$RUNNER_TEMP/native" | sort
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = 30
          gh run download 41191337000 --repo "$GITHUB_REPOSITORY" --name curious-mechanics-causal-revision-B --dir "$RUNNER_TEMP/source"
      - name: Install unchanged observed final QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchvision==0.29.1+cpu
          python -m pip install open-clip-torch==3.3.0 Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Verify every native PNG and lossless clip; assemble the native-only (non-driver) variant B first
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_progressive_delivery.py --native "$RUNNER_TEMP/native" --source "$RUNNER_TEMP/source/B" --variant B --out "$RUNNER_TEMP/final/B"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-progressive-B-timeline-rerender-native-only
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 14
