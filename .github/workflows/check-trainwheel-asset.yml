name: check-trainwheel-asset
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the two scene_04 SVG redirect URLs
        run: |
          for url in \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Wheelset_vs_single_wheels_in_curves.svg" \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Wheelset_vs_single_wheels_in_curves%3B_single_wheels.svg" \
            "https://commons.wikimedia.org/wiki/Wheelset_vs_single_wheels_in_curves;_single_wheels.svg" \
          ; do
            echo "=== $url ==="
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -A "shorts-studio/0.1 (probe)" -L "$url")
              echo "attempt $i: HTTP $code"
              sleep 1
            done
          done
          echo "=== search commons for the real filename ==="
          curl -s -A "shorts-studio/0.1 (probe)" "https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=Wheelset_vs_single_wheels_in_curves&srnamespace=6&format=json"
