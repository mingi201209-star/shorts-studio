name: One-shot multi-topic Blender render proof
on:
  push:
    branches: [feat/rumble-flex-duration-20261107]
    paths:
      - .github/workflows/motion-recipes-native-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blender-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render four real 3D motion subjects
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motion-smoke"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_motion_recipes_smoke.py -- --out "$RUNNER_TEMP/motion-smoke"
          test -s "$RUNNER_TEMP/motion-smoke/motion-proof.json"
          test "$(find "$RUNNER_TEMP/motion-smoke" -name 'motion_*.png' | wc -l)" -eq 5
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-topics-blender-render-proof
          path: ${{ runner.temp }}/motion-smoke/
          if-no-files-found: warn
          retention-days: 7
