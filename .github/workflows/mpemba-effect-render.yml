name: mpemba-effect-render
on:
  push:
    branches: [main]
    paths:
      - 'shorts_studio/**'
      - 'scripts/build_mpemba_effect_states.py'
      - '.github/workflows/mpemba-effect-render.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'shorts_studio/**'
      - 'scripts/build_mpemba_effect_states.py'
      - '.github/workflows/mpemba-effect-render.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering and semantic QA dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-nanum librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'
      - name: Full regression
        run: pytest -q
      - name: Generate Mpemba-effect production manifest and assets
        run: |
          set -o pipefail
          python scripts/build_mpemba_effect_states.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf 2>&1 | tee mpemba-generator.log
      - name: Verify real-photo assets were integrated
        run: |
          grep -q '^PHOTO_ASSETS_READY=' mpemba-generator.log
          test -s assets/mpemba_effect/source_photos/frost_window_cc0.jpg
          test -s assets/mpemba_effect/source_photos/boiling_water_steam_cc0.jpg
          test -s assets/mpemba_effect/source_photos/freezer_ice_tray_cc0.jpg
      - name: Verify Prompt V2 actually selected the production hook
        run: |
          grep -q '^PROMPT_V2_JUDGE=' mpemba-generator.log
          grep -q '^PROMPT_V2_SELECTED_STRATEGY=' mpemba-generator.log
          grep -q '^PROMPT_V2_SELECTED_HOOK=' mpemba-generator.log
      - name: Validate production manifests
        run: |
          for manifest in examples/*.json; do
            python -m shorts_studio validate "$manifest"
          done
      - name: Require Mpemba-effect production manifest
        run: test -f examples/mpemba_effect.json
      - name: Verify Story Prompt V2 curiosity contract
        run: |
          python - <<'PY'
          from shorts_studio.project import load_project
          from shorts_studio.hook_studio import verify_curiosity_maintained
          p = load_project('examples/mpemba_effect.json')
          result = verify_curiosity_maintained(p)
          assert result['status'] == 'PASS', result
          print('curiosity_maintained PASS:', result['evidence'])
          PY
      - name: Render Mpemba-effect short
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/mpemba_effect.json 2>&1 | tee mpemba-render.log
      - name: Verify final deliverable and QA
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          video=Path('dist/final.mp4')
          assert video.is_file() and video.stat().st_size > 0
          p=subprocess.run(['ffprobe','-v','error','-of','json','-show_entries','stream=codec_name,width,height','-show_entries','format=duration',str(video)],capture_output=True,text=True,check=True)
          probe=json.loads(p.stdout)
          vs=next(s for s in probe['streams'] if 'width' in s)
          assert (vs['width'],vs['height'])==(1080,1920),vs
          assert vs['codec_name']=='h264',vs
          q=json.loads(Path('dist/qa_report.json').read_text(encoding='utf-8'))
          assert q['status']=='PASS',q
          assert q['semantic_required'] is True
          assert q['semantic_visual_qa']['status']=='PASS',q['semantic_visual_qa']
          assert q['final_video_qa']['status']=='PASS',q['final_video_qa']
          assert all(x['status']=='PASS' for x in q['subtitle_reports'])
          rc = q.get('final_video_qa', {}).get('checks', {}).get('retention_contract')
          assert rc is None or rc['status']=='PASS', rc
          print('Mpemba-effect final deliverable QA PASS; duration=',probe['format']['duration'])
          PY
      - name: Sample frames for human review
        if: success()
        run: |
          mkdir -p review_frames
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 dist/final.mp4)
          ffmpeg -y -ss 0.3 -i dist/final.mp4 -frames:v 1 review_frames/01_open.jpg
          ffmpeg -y -ss 3.0 -i dist/final.mp4 -frames:v 1 review_frames/02_early.jpg
          ffmpeg -y -ss "$(python -c "print(float('$duration')*0.45)")" -i dist/final.mp4 -frames:v 1 review_frames/03_mid.jpg
          ffmpeg -y -ss "$(python -c "print(float('$duration')*0.75)")" -i dist/final.mp4 -frames:v 1 review_frames/04_late.jpg
          ffmpeg -y -ss "$(python -c "print(max(0,float('$duration')-0.7))")" -i dist/final.mp4 -frames:v 1 review_frames/05_end.jpg
      - name: Dump QA summary and review frames into the job log
        # Artifact downloads go through Azure Blob Storage, which is blocked
        # by this session's org egress policy, so the only retrievable path
        # for actual human visual review is small thumbnails printed into
        # the job log itself (kept small enough to fit a tail-based read;
        # see the microwave-door-render workflow's identical step).
        if: success()
        run: |
          python - <<'PY'
          import base64, io, json
          from pathlib import Path
          from PIL import Image

          q = json.loads(Path('dist/qa_report.json').read_text())
          fv = q['final_video_qa']
          m = fv['checks'].get('meaningful_visual_changes', {})
          summary = {
              'status': q['status'],
              'semantic_visual_qa': q['semantic_visual_qa']['status'],
              'final_video_qa': fv['status'],
              'retention_contract': fv['checks'].get('retention_contract', {}).get('status'),
              'probe_duration': q.get('probe', {}).get('format', {}).get('duration'),
              'first_5s_meaningful_changes': m.get('first_5s_meaningful_changes'),
              'event_count': len(m.get('events', [])),
              'events': [
                  {'scene': e['scene'], 'beat': e['beat'], 'start': round(e['start'], 2),
                   'kind': e['kind'], 'info': e['declared_information']}
                  for e in m.get('events', [])
              ],
          }
          print("===QA_SUMMARY_BEGIN===")
          print(json.dumps(summary, ensure_ascii=False))
          print("===QA_SUMMARY_END===")

          def dump_jpeg(label, img):
              img = img.convert('RGB')
              w = 420
              h = round(img.height * w / img.width)
              img = img.resize((w, h), Image.LANCZOS)
              buf = io.BytesIO()
              img.save(buf, format='JPEG', quality=60)
              data = base64.b64encode(buf.getvalue()).decode()
              print(f"===FRAME[{label}]_BEGIN===")
              for i in range(0, len(data), 160):
                  print(data[i:i+160])
              print(f"===FRAME[{label}]_END===")

          for p in sorted(Path('review_frames').glob('*.jpg')):
              dump_jpeg(p.stem, Image.open(p))

          events = sorted(m.get('events', []), key=lambda e: e['start'])
          picked = events[::max(1, len(events)//10)][:10]
          for e in picked:
              fp = Path(e['frame'])
              if fp.is_file():
                  dump_jpeg(f"evt_{e['scene']}_b{e['beat']}_t{e['start']:.1f}s", Image.open(fp))
          PY
      - name: Prepare publish description with real-photo sources
        if: success()
        run: |
          cp examples/mpemba_effect_upload_description.txt dist/upload-description.txt
          grep -q 'Ice crystals on a windowpane' dist/upload-description.txt
          grep -q '20250609 steam' dist/upload-description.txt
          grep -q 'Bottles of water and a tray of ice cubes' dist/upload-description.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mpemba-effect-publishable
          retention-days: 30
          path: |
            dist/
            review_frames/
            build/*.srt
            build/*.timing.json
            mpemba-generator.log
            mpemba-render.log
            assets/mpemba_effect/source_photos/
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: mpemba-effect-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/
            mpemba-generator.log
            mpemba-render.log
