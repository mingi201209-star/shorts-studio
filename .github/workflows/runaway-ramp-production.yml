name: Runaway truck ramp production (full render + real audio + QA)
# Full production run for the runaway-truck-ramp episode (gravel arrester bed):
# real narration capture (edge-tts, en-US-AndrewNeural), the full 960-frame
# cinematic render (32 shards of 30 frames, 32 samples, 1080x1920), final
# assembly and the real technical QA. Opened after the full-length preflight
# passed every gate (round 1: run 43452812617 attempt 2; round 2: run 43514943060 attempt 2; round 3: run 43559750857). content_screen_match is a
# simulation-state telemetry check, not image understanding. No upload.
on:
  push:
    branches: [road-paint-retroreflective-20261106]
    # Production only starts when THIS file changes (flipping the gates on
    # native/final below). Renderer, manifest and narration edits go through
    # runaway-ramp-preflight.yml first: three production runs in a row were
    # spent discovering failures a ten-minute low-resolution pass would have
    # shown, because every such edit used to start a full render by itself.
    paths:
      - .github/workflows/runaway-ramp-production.yml
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  speech:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install edge-tts
      - name: Capture real narration (edge-tts, Andrew voice, real WordBoundary timing)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/speech"
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_speech.py \
            --plan examples/experiments/runaway-ramp-speech-plan.json \
            --target-seconds 32.0 \
            --out "$RUNNER_TEMP/speech"
          cat "$RUNNER_TEMP/speech/runaway-truck-ramp/capture.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runaway-ramp-speech-capture
          path: ${{ runner.temp }}/speech/
          if-no-files-found: error
          retention-days: 14

  audio:
    needs: speech
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow pydantic
      - name: Download the captured narration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --name runaway-ramp-speech-capture --dir "$RUNNER_TEMP/speech"
      - name: Assemble narration.wav + captions from the real captured beats
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio"
          PYTHONPATH="$PWD" python -c "
          from pathlib import Path
          from benchmarks.road_safety.curious_mechanics_audio import build
          from benchmarks.road_safety.caption_phrases import phrase_groups
          build(Path('$RUNNER_TEMP/speech/runaway-truck-ramp'), Path('$RUNNER_TEMP/audio'), target_seconds=32.0, grouper=phrase_groups)
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runaway-ramp-audio
          path: ${{ runner.temp }}/audio/
          if-no-files-found: error
          retention-days: 14

  native:
    if: false
    # Gate closed again: combined round 3+4 production run 43314073897 completed with every
    # gate PASS (preflight 43311238590). Re-open only after a new preflight PASS.
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        start: [1, 31, 61, 91, 121, 151, 181, 211, 241, 271, 301, 331, 361, 391, 421, 451, 481, 511, 541, 571, 601, 631, 661, 691, 721, 751, 781, 811, 841, 871, 901, 931]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          # official site first, then public mirrors: some runners get a persistent 403 from download.blender.org.
          # Whatever the source, the pinned SHA-256 below decides whether the file is accepted.
          got=0
          for base in https://download.blender.org/release https://ftp.nluug.nl/pub/graphics/blender/release \
                      https://mirror.clarkson.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release; do
            rm -f "$RUNNER_TEMP/blender.tar.xz"
            if curl -fLsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 280 "$base/Blender5.0/blender-5.0.1-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz" \
               && echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -; then
              echo "Blender downloaded from $base"; got=1; break
            fi
            echo "download from $base failed or did not match the pinned hash; trying the next source"
          done
          test "$got" = 1
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Download pinned CC0 car scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GITHUB_REPOSITORY" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 30 contiguous absolute frames
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          end=$((${{ matrix.start }} + 29))
          if [ "$end" -gt 960 ]; then end=960; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/road_safety/render_runaway_ramp.py -- \
            --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" \
            --manifest examples/experiments/runaway-ramp-manifest.json \
            --start ${{ matrix.start }} --end "$end" \
            --out "$RUNNER_TEMP/native" 2>&1 | tee "$RUNNER_TEMP/native/render.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runaway-ramp-native-${{ matrix.start }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 14

  final:
    if: false
    needs: [native, audio]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install ffmpeg and fonts (apt, else a static build from PyPI)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          if timeout 150 sudo apt-get $opts update && timeout 240 sudo apt-get $opts install -y ffmpeg fonts-dejavu-core; then
            echo "ffmpeg from apt"
          else
            # The Ubuntu mirror stalled three runs in a row on 2026-11-11.
            # Same tools from PyPI instead: static ffmpeg/ffprobe, and the
            # DejaVu Sans files matplotlib ships (the same typeface the
            # caption builder measured with).
            echo "apt unavailable; using static-ffmpeg from PyPI"
            python -m pip install static-ffmpeg==2.13 matplotlib
            python -c "
          import os, subprocess, static_ffmpeg.run as r
          ffmpeg, ffprobe = r.get_or_fetch_platform_executables_else_raise()
          for src, name in ((ffmpeg, 'ffmpeg'), (ffprobe, 'ffprobe')):
              src = os.path.abspath(src)
              assert os.path.isfile(src), src
              subprocess.check_call(['sudo', 'ln', '-sf', src, '/usr/local/bin/' + name])
          "
            if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
              font_dir="$(python -c 'import matplotlib, os; print(os.path.join(matplotlib.get_data_path(), "fonts", "ttf"))')"
              sudo mkdir -p /usr/share/fonts/truetype/dejavu
              sudo cp "$font_dir"/DejaVuSans*.ttf /usr/share/fonts/truetype/dejavu/
              sudo fc-cache -f || true
            fi
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
          ffmpeg -hide_banner -filters | grep -E " ass |loudnorm|blackdetect" 
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - run: python -m pip install Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Retrieve all 32 native shards and the real audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/audio"
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'runaway-ramp-native-*' --dir "$RUNNER_TEMP/native"
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = 32
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --name runaway-ramp-audio --dir "$RUNNER_TEMP/audio"
      - name: Assemble final MP4 and run real technical QA
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/assemble_runaway_ramp.py \
            --native "$RUNNER_TEMP/native" \
            --audio "$RUNNER_TEMP/audio" \
            --manifest examples/experiments/runaway-ramp-manifest.json \
            --out "$RUNNER_TEMP/final"
          sha256sum "$RUNNER_TEMP/final/runaway-truck-ramp.mp4"
      - name: Print the final MP4 as base64 (so it can be retrieved from the log)
        run: |
          set -euo pipefail
          echo "MP4_B64_START runaway-truck-ramp.mp4"
          base64 -w0 "$RUNNER_TEMP/final/runaway-truck-ramp.mp4"
          echo ""
          echo "MP4_B64_END runaway-truck-ramp.mp4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runaway-ramp-final
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 14
