name: Curious Mechanics B assemble preserved vibration-transfer render
# Assembly-only recovery for full native run 42380212611. All 30 native
# shards succeeded there; its final job failed before QA because older source
# assets no longer resolve by artifact name. This workflow uses immutable,
# unexpired artifact IDs and verifies both archive digests before assembly.
+# It never runs Blender and never changes the preserved render inputs.
on:
  push:
    branches: [fix/curious-mechanics-vibration-transfer-20261107]
    paths:
      - ".github/workflows/curious-mechanics-vibration-transfer-assemble-b.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: curious-mechanics-vibration-transfer-assemble-b
  cancel-in-progress: false
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve 30 preserved shards and exact source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/source/B/audio" "$RUNNER_TEMP/driver" "$RUNNER_TEMP/prior"
          gh run download 42380212611 --repo "$GITHUB_REPOSITORY" --pattern 'curious-progressive-B-causal-*' --dir "$RUNNER_TEMP/native"
          ls "$RUNNER_TEMP/native" | sort
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = 30

          # The unexpired prior B film carries the exact approved Andrew +5%
          # narration/captions used by this manifest. Rebuild only the legacy
          # source-folder layout expected by the unchanged assembler.
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/13081202684/zip" \
            > "$RUNNER_TEMP/prior.zip"
          echo "fa410b014c38e5e6b39cbba2f63e52b80b97dd475cefe3259b9c44a80a49992e  $RUNNER_TEMP/prior.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/prior.zip" -d "$RUNNER_TEMP/prior"
          cp "$RUNNER_TEMP/prior/B/narration.wav" "$RUNNER_TEMP/source/B/audio/narration.wav"
          cp "$RUNNER_TEMP/prior/B/film.ass" "$RUNNER_TEMP/source/B/audio/film.ass"
          cp "$RUNNER_TEMP/prior/B/audio-validation.json" "$RUNNER_TEMP/source/B/audio/audio-validation.json"
          cp "$RUNNER_TEMP/prior/B/curious-mechanics-B-progressive-v3.mp4" "$RUNNER_TEMP/source/B/curious-mechanics-B-mechanism-v2.mp4"
          cp "$RUNNER_TEMP/prior/B/film-validation.json" "$RUNNER_TEMP/source/B/revision-validation.json"
          echo "00f8bcb2c088d3104b5018bf22404f4db017449793c6c365e0995458609c39aa  $RUNNER_TEMP/source/B/audio/narration.wav" | sha256sum -c -
          echo "4eabcb1d61cafeefd15282f9300de315a37fa05bee27d049d4b9756ba5eb68b3  $RUNNER_TEMP/source/B/audio/film.ass" | sha256sum -c -
          echo "c5d259be6f2df13879b2a717b8b9ba0ab87ea736e2c0015559ac3aa7a115c537  $RUNNER_TEMP/source/B/audio/audio-validation.json" | sha256sum -c -
          echo "1cb57666230f809b012cd622ac8ac545540fc0df8075970eb9cc03b5efe182a8  $RUNNER_TEMP/source/B/curious-mechanics-B-mechanism-v2.mp4" | sha256sum -c -

          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/13415651768/zip" \
            > "$RUNNER_TEMP/driver.zip"
          echo "1bdf3ca82798a55f063a1e1e05ae93d40eec61d1aafdb45ec68a6186ca7aebfd  $RUNNER_TEMP/driver.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/driver.zip" -d "$RUNNER_TEMP/driver"
          test -f "$RUNNER_TEMP/driver/driver-pilot.json"
          test -f "$RUNNER_TEMP/driver/0001.png"
          test -f "$RUNNER_TEMP/driver/0090.png"
      - name: Install unchanged observed final QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchvision==0.29.1+cpu
          python -m pip install open-clip-torch==3.3.0 Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Verify pixels; assemble narration-matched cut; run full QA
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/assemble_driver_cut.py \
            --native "$RUNNER_TEMP/native" \
            --source "$RUNNER_TEMP/source/B" \
            --driver "$RUNNER_TEMP/driver" \
            --out "$RUNNER_TEMP/final" \
            --variant B
          sha256sum "$RUNNER_TEMP/final/curious-mechanics-B-driver-cut.mp4"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-mechanics-B-vibration-transfer-driver-cut-assembly-recovery
          path: |
            ${{ runner.temp }}/final/curious-mechanics-B-driver-cut.mp4
            ${{ runner.temp }}/final/film-validation.json
            ${{ runner.temp }}/final/edit-receipt.json
            ${{ runner.temp }}/final/semantic-results.json
            ${{ runner.temp }}/final/human-semantic-results.json
            ${{ runner.temp }}/final/human-semantic-*.png
          if-no-files-found: error
          retention-days: 14
