name: scout-molasses-sources
on:
  push:
    branches: [feat/idea-gate-retention-engine]

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Search Wikimedia Commons for real Boston Molasses Flood sources
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse

          def api(params):
              url = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": "shorts-studio-research/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          queries = [
              "Boston Molasses Flood",
              "Boston Molasses Disaster",
              "Great Molasses Flood",
              "Purity Distilling",
              "molasses tank Boston 1919",
          ]
          seen = {}
          for q in queries:
              data = api({"action": "query", "list": "search", "srsearch": q, "srnamespace": "6", "srlimit": "30", "format": "json"})
              for hit in data.get("query", {}).get("search", []):
                  title = hit["title"]
                  seen[title] = seen.get(title, 0) + 1
              time.sleep(1)

          # Also pull the category directly -- more reliable than free-text search.
          cat = api({"action": "query", "list": "categorymembers", "cmtitle": "Category:Boston Molasses Flood", "cmlimit": "200", "cmtype": "file", "format": "json"})
          for m in cat.get("query", {}).get("categorymembers", []):
              seen[m["title"]] = seen.get(m["title"], 0) + 1

          titles = sorted(seen.keys())
          print(f"Found {len(titles)} candidate files")
          results = []
          for title in titles:
              time.sleep(0.5)
              info = api({
                  "action": "query", "titles": title, "prop": "imageinfo",
                  "iiprop": "url|size|mime|extmetadata", "format": "json",
              })
              pages = info.get("query", {}).get("pages", {})
              for _, page in pages.items():
                  ii = (page.get("imageinfo") or [{}])[0]
                  meta = ii.get("extmetadata", {})
                  results.append({
                      "title": title,
                      "url": ii.get("url"),
                      "descriptionurl": ii.get("descriptionurl"),
                      "width": ii.get("width"), "height": ii.get("height"),
                      "mime": ii.get("mime"),
                      "description": (meta.get("ImageDescription", {}) or {}).get("value", "")[:500],
                      "date": (meta.get("DateTimeOriginal", {}) or meta.get("DateTime", {}) or {}).get("value", ""),
                      "credit": (meta.get("Credit", {}) or {}).get("value", "")[:300],
                      "licenseshortname": (meta.get("LicenseShortName", {}) or {}).get("value", ""),
                  })

          with open("molasses_candidates.json", "w", encoding="utf-8") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)
          print(f"Wrote {len(results)} entries")
          PY
      - name: Publish results to an orphan branch
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@example.com"
          git checkout --orphan scout/molasses-sources-2
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p published
          cp molasses_candidates.json published/
          git add published/molasses_candidates.json
          git commit -m "Scout: Boston Molasses Flood candidate sources"
          git push -f origin HEAD:scout/molasses-sources-2
