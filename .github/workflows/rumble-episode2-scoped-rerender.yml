name: Rumble episode 2 scoped shot re-render (changed shots only)
# Manual only. Measures the real revision-time win from re-rendering ONLY the
# shards that cover the named shots, instead of all 30. Produces per-shard
# QA-verified proof + lossless frames for those shots and a timing summary --
# it does NOT assemble a final video (that needs merging with the untouched
# shots' previously-verified frames from a durable store, a separate step)
# and it uploads nothing anywhere outside this run's own artifacts.
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact 40-character commit SHA being dispatched
        required: true
      shot_ids:
        description: Comma-separated shot ids to re-render (e.g. hook_warning,tire_contact)
        required: true
env:
  RENDERER_SOURCE_SHA256: 5e52499a7e048f254bbfe30a017c6d4e48cb6cb203fbdbd3b14b183629d173d3
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require exact dispatched head and pinned renderer source
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_rumble_episode2.py" | sha256sum -c -
  plan:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frames: ${{ steps.compute.outputs.frames }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compute the shard starts covering the named shots
        id: compute
        env:
          SHOT_IDS: ${{ inputs.shot_ids }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -c "
          import json, os
          from pathlib import Path
          from shorts_studio.factory.rumble_episode2 import load_episode, shard_starts_for_shots
          episode = load_episode(Path('examples/factory/rumble-episode2-30s.json'))
          shot_ids = {s.strip() for s in os.environ['SHOT_IDS'].split(',') if s.strip()}
          starts = shard_starts_for_shots(episode, shot_ids)
          print(f'Rendering {len(starts)}/30 shards for shots: {sorted(shot_ids)}')
          print(f'frames={json.dumps(starts)}')
          " | tee /tmp/plan.log
          grep '^frames=' /tmp/plan.log >> "$GITHUB_OUTPUT"
  speech:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow pydantic
      - run: PYTHONPATH=. python benchmarks/road_safety/episode2_film.py speech --out build/speech-preflight
  native:
    needs: [guard, plan, speech]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        frame: ${{ fromJson(needs.plan.outputs.frames) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_rumble_episode2.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 30 contiguous absolute original frames
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_rumble_episode2.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/factory/rumble-episode2-30s.json --start ${{ matrix.frame }} --end $(( ${{ matrix.frame }} + 29 )) --out "$RUNNER_TEMP/rumble"
      - name: Native shard QA and lossless intermediate
        run: |
          PYTHONPATH="$PWD" python benchmarks/road_safety/episode2_film.py shard --out "$RUNNER_TEMP/rumble"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rumble-scoped-${{ matrix.frame }}
          path: |
            ${{ runner.temp }}/rumble/episode-proof.json
            ${{ runner.temp }}/rumble/native-lossless.mkv
          if-no-files-found: error
          retention-days: 7
  report:
    needs: [plan, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rumble-scoped-*
          path: build/scoped-chunks
      - name: Summarize real measured time vs a full 30-shard run
        env:
          SHOT_IDS: ${{ inputs.shot_ids }}
          FRAMES: ${{ needs.plan.outputs.frames }}
        run: |
          set -euo pipefail
          python -c "
          import json, os
          from pathlib import Path
          proofs = sorted(Path('build/scoped-chunks').glob('*/episode-proof.json'))
          shards = [json.loads(p.read_text()) for p in proofs]
          rendered_shards = len(shards)
          render_seconds_total = sum(sum(s['render_seconds']) for s in shards)
          report = {
              'shot_ids': sorted({s.strip() for s in os.environ['SHOT_IDS'].split(',') if s.strip()}),
              'shards_rendered': rendered_shards,
              'shards_in_full_film': 30,
              'shard_fraction': round(rendered_shards / 30, 4),
              'frame_starts': json.loads(os.environ['FRAMES']),
              'render_seconds_total_across_shards': round(render_seconds_total, 1),
              'render_seconds_wall_estimate_at_max_parallel_20': round(
                  render_seconds_total / min(rendered_shards, 20), 1),
              'note': 'wall estimate assumes shards run concurrently up to the '
                      '20-job cap; actual wall time also includes guard/speech/'
                      'queueing overhead -- read it from this run\'s own duration too.',
          }
          Path('build/scoped-rerender-report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rumble-scoped-rerender-report
          path: build/scoped-rerender-report.json
          if-no-files-found: error
          retention-days: 14
