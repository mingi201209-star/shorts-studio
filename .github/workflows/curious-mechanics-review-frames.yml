name: Curious Mechanics review frames (base64-in-log, no artifact download needed)
# This sandbox cannot download GitHub Actions artifact ZIPs (the blob
# -storage redirect target is policy-blocked), so this prints small
# thumbnail JPEGs as base64 directly into the job's own log -- a text API
# this session CAN read. Read-only: downloads already-rendered native B
# shards; renders nothing new.
#
# Current use: verify the second shot-boundary fix made during the causal-
# shot re-render (run 41266614904) by eye, using its own already-completed
# shards -- frames 716-723 across the rumble_mechanism_close(607-719)/
# driver_response(720+) cut, and 752-756, the old frame-754 clipping failure
# point, now safely inside the extended driver_response.
on:
  push:
    branches: [feat/curious-mechanics-b-causal-shot-20261101]
    paths:
      - ".github/workflows/curious-mechanics-review-frames.yml"
      - "benchmarks/road_safety/extract_review_frames_b64.py"
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Download the shards covering the rumble_mechanism_close/driver_response boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shards"
          for start in 691 721 751; do
            gh run download 41266614904 --repo "$GITHUB_REPOSITORY" --name "curious-progressive-B-causal-$start" --dir "$RUNNER_TEMP/shards/$start"
          done
      - name: rumble_mechanism_close/driver_response cut (716-723) and the old frame-754 failure point (752-756)
        run: python benchmarks/road_safety/extract_review_frames_b64.py --shards "$RUNNER_TEMP/shards" --frames 716 717 718 719 720 721 722 723 752 753 754 755 756
