name: Curious Mechanics review frames (base64-in-log, no artifact download needed)
# This sandbox cannot download GitHub Actions artifact ZIPs (the blob
# -storage redirect target is policy-blocked), so this prints small
# thumbnail JPEGs as base64 directly into the job's own log -- a text API
# this session CAN read. Read-only: downloads already-rendered native B
# shards; renders nothing new.
#
# Current use: verify the two shot-boundary fixes made during the causal-
# shot re-render (run 41266614904) by eye, using its own already-completed
# shards -- frames 47-53 across the hook_warning(1-50)/shoulder_location(51+)
# cut, and 73-75, the old frame-74 clipping failure point, now safely inside
# shoulder_location.
on:
  push:
    branches: [feat/curious-mechanics-b-causal-shot-20261101]
    paths:
      - ".github/workflows/curious-mechanics-review-frames.yml"
      - "benchmarks/road_safety/extract_review_frames_b64.py"
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Download the shards covering the hook_warning/shoulder_location boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shards"
          for start in 31 61; do
            gh run download 41266614904 --repo "$GITHUB_REPOSITORY" --name "curious-progressive-B-causal-$start" --dir "$RUNNER_TEMP/shards/$start"
          done
      - name: hook_warning/shoulder_location cut (47-53) and the old frame-74 failure point (73-75)
        run: python benchmarks/road_safety/extract_review_frames_b64.py --shards "$RUNNER_TEMP/shards" --frames 47 48 49 50 51 52 53 73 74 75
