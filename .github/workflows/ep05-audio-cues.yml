name: EP05 audio cues (real TTS timing only, no render)
# Captures the EP.05 narration with the free TTS, levels and builds it exactly like the preview, and prints every caption cue so the picture timeline is planned against real timing.
on:
  push:
    branches: [ep04-crumple-build-20261116, fix/ep04-narration-visual-contract-20261117]
    paths:
      - examples/experiments/belt-audio-request.json
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          # the runner's package mirror sometimes stalls for many minutes: skip apt when ffmpeg is already installed, otherwise bounded attempts
          if ! command -v ffmpeg >/dev/null 2>&1; then
            for i in 1 2 3; do timeout 120 sudo apt-get update -qq && timeout 300 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg fonts-dejavu-core && break; echo "apt attempt $i failed"; done
          fi
          command -v ffmpeg
      - run: python -m pip install edge-tts Pillow pydantic
      - name: Capture narration and build narration.wav + captions
        run: |
          set -euo pipefail
          TARGET=$(python3 -c "import json;print(json.load(open('examples/experiments/belt-audio-request.json')).get('target_seconds', 26.0))")
          mkdir -p "$RUNNER_TEMP/speech" "$RUNNER_TEMP/audio"
          # the free TTS service sometimes returns no audio; finished beats are reused on a retry; up to 6 attempts
          export SPEECH_REQUEST_GAP=20
          ok=0
          for attempt in 1 2 3 4 5 6; do
            rm -rf "$RUNNER_TEMP/speech"; mkdir -p "$RUNNER_TEMP/speech"
            if PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_speech.py \
                 --plan examples/experiments/belt-speech-plan.json --target-seconds "$TARGET" --out "$RUNNER_TEMP/speech"; then ok=1; break; fi
            echo "speech capture attempt $attempt failed"
            # keep the beats that were captured completely: the capture script reuses them from speech-v*/<variant>/ on the next attempt
            mkdir -p "$RUNNER_TEMP/speech-v$attempt/belt-limiter"; cp "$RUNNER_TEMP"/speech/belt-limiter/beat_*.json "$RUNNER_TEMP"/speech/belt-limiter/beat_*.mp3 "$RUNNER_TEMP/speech-v$attempt/belt-limiter/" 2>/dev/null || true
            sleep 20
          done
          test "$ok" = 1
          PYTHONPATH="$PWD" python benchmarks/crumple_zone/level_beats.py --folder "$RUNNER_TEMP/speech/belt-limiter"
          PYTHONPATH="$PWD" python -c "
          from pathlib import Path
          from benchmarks.road_safety.curious_mechanics_audio import build
          from benchmarks.crumple_zone.captions import single_line_groups as phrase_groups
          build(Path('$RUNNER_TEMP/speech/belt-limiter'), Path('$RUNNER_TEMP/audio'), target_seconds=$TARGET, grouper=phrase_groups)
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: belt-preview-audio
          path: ${{ runner.temp }}/audio/
          if-no-files-found: error
          retention-days: 7
      - name: Print the real cues
        run: |
          python3 - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/audio/audio-validation.json"))
          print("CUES_JSON " + json.dumps(r["cues"]))
          print("BEATS_JSON " + json.dumps([{"start": b["start"], "end": b["end"], "text": b["narration_en"]} for b in r["beats"]]))
          PY
