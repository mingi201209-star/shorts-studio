name: Road rumble episode 2 six-shot native Cycles32 proof
on:
  push:
    branches: [feat/rumble-episode2-production-20261018, nightshift/episode2-editorial-20261022, feat/rumble-episode2-qa-port-20261024, feat/episode2-road-profile-macro-20261024]
permissions:
  contents: read
jobs:
  native-original-2-frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        frame: [1, 151, 301, 451, 601, 751]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render one original frame in each of six story beats
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_rumble_episode2.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/factory/rumble-episode2-30s.json --start ${{ matrix.frame }} --end ${{ matrix.frame }} --out "$RUNNER_TEMP/rumble"
      - name: Verify native resolution samples 3D motion and source provenance
        run: |
          PYTHONPATH="$PWD" python -m shorts_studio.factory.rumble_native_shard_qa --out "$RUNNER_TEMP/rumble" --manifest examples/factory/rumble-episode2-30s.json --renderer benchmarks/road_safety/render_rumble_episode2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rumble-episode2-cycles32-shot-${{ matrix.frame }}
          path: |
            ${{ runner.temp }}/rumble/episode-proof.json
            ${{ runner.temp }}/rumble/frame_*.png
          if-no-files-found: error
          retention-days: 3
