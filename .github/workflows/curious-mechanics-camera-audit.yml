name: Curious Mechanics camera audit no render
on:
  push:
    branches: [exp/curious-mechanics-production-20261029]
    paths: [.github/workflows/curious-mechanics-camera-audit.yml, benchmarks/road_safety/curious_mechanics_camera_audit.py]
permissions:
  contents: read
concurrency:
  group: curious-mechanics-camera-audit
  cancel-in-progress: false
env:
  RENDERER_SOURCE_SHA256: 700c523fac79cbafac3e763e0e9bbace429c6deff89da1ddbf97616f143debae
jobs:
  camera-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Reproduce camera mismatch and candidate anchor without rendering
        run: |
          python benchmarks/road_safety/curious_mechanics_camera_audit.py --blender "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --out "$RUNNER_TEMP/camera-audit" --inventory --production-fixed
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-camera-audit
          path: ${{ runner.temp }}/camera-audit/
          if-no-files-found: error
          retention-days: 7
