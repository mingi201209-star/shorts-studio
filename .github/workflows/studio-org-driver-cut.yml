name: Studio org narration-matched driver cut
on:
  push:
    branches: [fix/studio-org-integration-20261102]
    paths:
      - .github/workflows/studio-org-driver-cut.yml
      - shorts_studio/studio_org/driver_cut.py
      - benchmarks/road_safety/assemble_driver_cut.py
      - benchmarks/road_safety/curious_mechanics_progressive_delivery.py
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-org-driver-cut
  cancel-in-progress: false
jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[panel-free]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A
            source_run: 41190640057
          - variant: B
            source_run: 41191337000
          - variant: C
            source_run: 41191337000
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: (matrix.variant == 'A' && contains(github.event.head_commit.message, '[A-only]')) || (matrix.variant == 'C' && contains(github.event.head_commit.message, '[C-only]')) || (!contains(github.event.head_commit.message, '[A-only]') && !contains(github.event.head_commit.message, '[C-only]'))
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: (matrix.variant == 'A' && contains(github.event.head_commit.message, '[A-only]')) || (matrix.variant == 'C' && contains(github.event.head_commit.message, '[C-only]')) || (!contains(github.event.head_commit.message, '[A-only]') && !contains(github.event.head_commit.message, '[C-only]'))
        with:
          python-version: '3.12'
      - if: (matrix.variant == 'A' && contains(github.event.head_commit.message, '[A-only]')) || (matrix.variant == 'C' && contains(github.event.head_commit.message, '[C-only]')) || (!contains(github.event.head_commit.message, '[A-only]') && !contains(github.event.head_commit.message, '[C-only]'))
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchvision==0.29.1+cpu
          python -m pip install open-clip-torch==3.3.0 Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Download already verified native sources
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
          SOURCE_RUN: ${{ matrix.source_run }}
        if: (matrix.variant == 'A' && contains(github.event.head_commit.message, '[A-only]')) || (matrix.variant == 'C' && contains(github.event.head_commit.message, '[C-only]')) || (!contains(github.event.head_commit.message, '[A-only]') && !contains(github.event.head_commit.message, '[C-only]'))
        run: |
          set -euo pipefail
          gh run download 41274189435 --repo "$GITHUB_REPOSITORY" --pattern 'curious-progressive-B-causal-*' --dir "$RUNNER_TEMP/native"
          gh run download 41298025251 --repo "$GITHUB_REPOSITORY" --pattern 'curious-progressive-B-causal-*' --dir "$RUNNER_TEMP/steered"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "curious-mechanics-causal-revision-$VARIANT" --dir "$RUNNER_TEMP/source"
          gh run download 41424164628 --repo "$GITHUB_REPOSITORY" --name studio-org-driver-action-native-complete --dir "$RUNNER_TEMP/driver"
      - name: Replace only the five steered shards
        if: (matrix.variant == 'A' && contains(github.event.head_commit.message, '[A-only]')) || (matrix.variant == 'C' && contains(github.event.head_commit.message, '[C-only]')) || (!contains(github.event.head_commit.message, '[A-only]') && !contains(github.event.head_commit.message, '[C-only]'))
        run: |
          set -euo pipefail
          for start in 751 781 811 841 871; do
            find "$RUNNER_TEMP/native" -type d -name "curious-progressive-B-causal-$start" -prune -exec rm -rf {} +
          done
          cp -a "$RUNNER_TEMP/steered"/. "$RUNNER_TEMP/native"/
      - name: Assemble narration-matched edit and run full QA
        env:
          GITHUB_ACTIONS: 'true'
          VARIANT: ${{ matrix.variant }}
        if: (matrix.variant == 'A' && contains(github.event.head_commit.message, '[A-only]')) || (matrix.variant == 'C' && contains(github.event.head_commit.message, '[C-only]')) || (!contains(github.event.head_commit.message, '[A-only]') && !contains(github.event.head_commit.message, '[C-only]'))
        run: |
          PYTHONPATH="$PWD" python benchmarks/road_safety/assemble_driver_cut.py \
            --native "$RUNNER_TEMP/native" \
            --source "$RUNNER_TEMP/source/$VARIANT" \
            --driver "$RUNNER_TEMP/driver" \
            --out "$RUNNER_TEMP/out" \
            --variant "$VARIANT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ((matrix.variant == 'A' && contains(github.event.head_commit.message, '[A-only]')) || (matrix.variant == 'C' && contains(github.event.head_commit.message, '[C-only]')) || (!contains(github.event.head_commit.message, '[A-only]') && !contains(github.event.head_commit.message, '[C-only]'))) && always()
        with:
          name: studio-org-driver-cut-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/out/curious-mechanics-${{ matrix.variant }}-driver-cut.mp4
            ${{ runner.temp }}/out/film-validation.json
            ${{ runner.temp }}/out/edit-receipt.json
            ${{ runner.temp }}/out/semantic-results.json
            ${{ runner.temp }}/out/human-semantic-results.json
            ${{ runner.temp }}/out/review-*.jpg
          retention-days: 14
