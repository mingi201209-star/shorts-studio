name: Retry fetching Undark luminous paint thumbnail (throwaway)
on:
  push:
    branches: [content/radium-girls]
    paths: [.github/workflows/retry-undark-paint.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch single image politely
        run: |
          mkdir -p thumbs
          curl -sS -A "shorts-studio-scout/1.0 (https://github.com/mingi201209-star/shorts-studio; one-off research script)" \
            -o thumbs/undark_paint.jpg \
            "https://upload.wikimedia.org/wikipedia/commons/a/a3/Undark_luminous_paint.jpg"
          ls -la thumbs/
          file thumbs/undark_paint.jpg
      - name: Publish to throwaway branch
        run: |
          git config user.name "radium-scout-bot"
          git config user.email "actions@github.com"
          git checkout --orphan scout/undark-paint
          git reset --hard
          git add thumbs/undark_paint.jpg
          git commit -m "Throwaway: single retry fetch"
          git push -f origin HEAD:refs/heads/scout/undark-paint
