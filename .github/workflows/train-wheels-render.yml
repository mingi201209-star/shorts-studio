name: train-wheels-render
on:
  push:
    branches: [content/train-wheel-conicity]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk librsvg2-bin
      - name: Warm the fontconfig cache
        run: time fc-cache -f -v
      - name: Install semantic vision QA dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'
      - name: Full pytest suite
        run: pytest -q
      - name: Validate Train Wheels manifest
        run: python -m shorts_studio validate examples/train_wheels.json
      - name: Render Train Wheels with required semantic QA
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m shorts_studio render examples/train_wheels.json 2>&1 | tee render-result.json
      - name: Verify final deliverable and QA
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          video = Path('dist/final.mp4')
          assert video.is_file() and video.stat().st_size > 0
          p = subprocess.run(['ffprobe','-v','error','-of','json','-show_entries','stream=codec_name,width,height,r_frame_rate','-show_entries','format=duration',str(video)],capture_output=True,text=True,check=True)
          probe = json.loads(p.stdout)
          vs = next(s for s in probe['streams'] if 'width' in s)
          assert (vs['width'], vs['height']) == (1080,1920), vs
          assert vs['codec_name'] == 'h264', vs
          assert float(probe['format']['duration']) > 1.0
          report = json.loads(Path('dist/qa_report.json').read_text(encoding='utf-8'))
          assert report['status'] == 'PASS', report
          assert report['semantic_required'] is True
          assert report['semantic_visual_qa']['results']
          assert all(x['status'] == 'PASS' for x in report['semantic_visual_qa']['results'])
          assert all(x['status'] == 'PASS' for x in report['subtitle_reports'])
          assert report['visual_qa']['structural_status'] == 'PASS'
          assert report['final_video_qa']['status'] == 'PASS'
          print('Train Wheels final deliverable QA PASS')
          PY
      - name: Upload publishable Train Wheels artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-train-wheels
          retention-days: 30
          path: |
            dist/
            build/*.srt
            build/*.timing.json
            build/*_qa.jpg
            build/_titleqa_*.jpg
            build/_capqa_*.jpg
            build/_safeqa_*.jpg
            render-result.json
      - name: Upload diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-train-wheels-diagnostics
          retention-days: 7
          path: |
            dist/qa_report.json
            build/*_qa.jpg
            build/_titleqa_*.jpg
            build/_capqa_*.jpg
            build/_safeqa_*.jpg
            render-result.json
