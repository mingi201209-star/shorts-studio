name: Scout and verify Titanic sources (throwaway)
on:
  push:
    branches: [content/titanic-fourth-funnel]
    paths: [.github/workflows/scout-titanic-sources.yml]

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e '.[dev]'
      - name: Hash-verify every unique existing asset through the real production path
        run: |
          python3 - <<'PY'
          import json, hashlib, shutil, sys
          sys.path.insert(0, ".")
          from pathlib import Path
          from shorts_studio.render import _resolve_asset

          data = json.loads(Path("examples/titanic_fourth_funnel.json").read_text(encoding="utf-8"))
          urls = {}
          for s in data["scenes"]:
              for b in s["visual_beats"]:
                  urls[b["asset_url"]] = None
          build = Path("build_tmp"); build.mkdir(exist_ok=True)
          out = {}
          for i, url in enumerate(urls):
              bounded = url + ("&" if "?" in url else "?") + "width=1280" if "width=" not in url else url
              try:
                  path = _resolve_asset({"asset_url": bounded}, build, "existing", i)
                  data_bytes = path.read_bytes()
                  digest = hashlib.sha256(data_bytes).hexdigest()
                  shutil.copy(path, f"existing_{i}.jpg")
                  out[url] = {"sha256": digest, "size": len(data_bytes), "preview": f"existing_{i}.jpg", "status": "ok"}
                  print(i, url[-60:], "->", digest[:16], len(data_bytes), "bytes")
              except Exception as e:
                  out[url] = {"error": str(e), "status": "failed"}
                  print(i, url[-60:], "FAILED", e)
          json.dump(out, open("existing_hashes.json", "w"), indent=2)
          PY
      - name: Search Commons for additional real Titanic engineering material
        run: |
          pip install requests >/dev/null
          python3 - <<'PY'
          import json, requests
          HEADERS = {"User-Agent": "shorts-studio-scout/1.0 (https://github.com/mingi201209-star/shorts-studio; one-off research script)"}
          COMMONS = "https://commons.wikimedia.org/w/api.php"
          queries = [
              "Titanic turbine engine",
              "Olympic turbine engine room",
              "Titanic reciprocating engine",
              "Harland and Wolff gantry Titanic",
              "Titanic keel laying Belfast",
              "British Wreck Commissioner inquiry Titanic 1912",
              "Titanic Board of Trade inquiry report",
              "Titanic deck plan",
              "Olympic class deck plan funnels",
              "Titanic Southampton departure 1912",
              "Titanic propellers Belfast",
          ]
          results = {}
          for q in queries:
              r = requests.get(COMMONS, params={
                  "action": "query", "list": "search", "srsearch": q,
                  "srnamespace": "6", "srlimit": "12", "format": "json",
              }, headers=HEADERS, timeout=20)
              hits = [h["title"] for h in r.json().get("query", {}).get("search", [])]
              results[q] = hits
              print(q, "->", hits)
          titles = sorted({t for hits in results.values() for t in hits})
          out = []
          for i in range(0, len(titles), 40):
              chunk = titles[i:i+40]
              r = requests.get(COMMONS, params={
                  "action": "query", "titles": "|".join(chunk), "prop": "imageinfo",
                  "iiprop": "url|size|mime", "iiurlwidth": "800", "format": "json",
              }, headers=HEADERS, timeout=20)
              for p in r.json().get("query", {}).get("pages", {}).values():
                  info = p.get("imageinfo")
                  if info:
                      out.append({"title": p.get("title"), "url": info[0].get("url"), "thumburl": info[0].get("thumburl"), "mime": info[0].get("mime"), "width": info[0].get("width"), "height": info[0].get("height")})
          json.dump({"search_results": results, "candidates": out}, open("scout_results.json", "w"), indent=2)
          PY
      - name: Download small previews of scouted candidates
        run: |
          python3 - <<'PY'
          import json, requests
          HEADERS = {"User-Agent": "shorts-studio-scout/1.0 (https://github.com/mingi201209-star/shorts-studio; one-off research script)"}
          data = json.load(open("scout_results.json"))
          for i, c in enumerate(data["candidates"]):
              url = c.get("thumburl")
              mime = c.get("mime") or ""
              if not url or not mime.startswith("image/"):
                  continue
              try:
                  r = requests.get(url, headers=HEADERS, timeout=20)
                  r.raise_for_status()
              except Exception as e:
                  print("skip", c.get("title"), e)
                  continue
              open(f"scout_{i}.jpg", "wb").write(r.content)
              print("saved", f"scout_{i}.jpg", "<-", c.get("title"), len(r.content), "bytes")
          PY
          ls -la
      - name: Publish everything to a throwaway orphan branch
        run: |
          git config user.name "titanic-scout-bot"
          git config user.email "actions@github.com"
          git checkout --orphan scout/titanic-sources
          git reset --hard
          git add existing_hashes.json existing_*.jpg scout_results.json scout_*.jpg 2>/dev/null || git add existing_hashes.json scout_results.json
          git commit -m "Throwaway: existing-asset hashes/previews + candidate new Titanic sources"
          git push -f origin HEAD:refs/heads/scout/titanic-sources
