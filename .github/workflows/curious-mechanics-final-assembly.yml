name: Curious Mechanics final assembly and QA
on:
  push:
    branches: [exp/curious-mechanics-production-20261029]
    paths: [.github/workflows/curious-mechanics-final-assembly.yml]
permissions:
  contents: read
concurrency:
  group: curious-mechanics-final-assembly
  cancel-in-progress: false
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Private read-only verified source transfer
        env:
          EXPORT_KEY: ${{ secrets.CM_EXPORT_KEY_20261030 }}
          EXPORT_HOST: ${{ secrets.CM_EXPORT_HOST_20261030 }}
          EXPORT_KNOWN_HOSTS: ${{ secrets.CM_EXPORT_KNOWN_HOSTS_20261030 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          printf '%s\n' "$EXPORT_KEY" > "$RUNNER_TEMP/export-key"
          chmod 600 "$RUNNER_TEMP/export-key"
          printf '%s\n' "$EXPORT_KNOWN_HOSTS" > "$RUNNER_TEMP/export-known-hosts"
          ssh -T -i "$RUNNER_TEMP/export-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/export-known-hosts" -o ConnectTimeout=30 "ubuntu@$EXPORT_HOST" | tar -xf - -C "$RUNNER_TEMP/bundle"
          rm -f "$RUNNER_TEMP/export-key"
          echo "c7395f37b02735d8c1637d9364d30fb471e984e0f64d1da14020888aacc731b7  $RUNNER_TEMP/bundle/manifest.json" | sha256sum -c -
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'bundle'
          for name,expected in json.loads((root/'manifest.json').read_text())['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          PY
      - name: Install observed CPU QA versions and original font dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchvision==0.29.1+cpu
          python -m pip install open-clip-torch==3.3.0 Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Assemble and strictly validate all three real films
        run: |
          set -euo pipefail
          status=0
          for variant in A B C; do
            PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_delivery.py assemble --bundle "$RUNNER_TEMP/bundle" --variant "$variant" --out "$RUNNER_TEMP/final-review/$variant" || status=1
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-mechanics-three-review-films
          path: ${{ runner.temp }}/final-review/
          if-no-files-found: error
          retention-days: 7
      - if: always()
        name: Remove temporary runner credential
        run: rm -f "$RUNNER_TEMP/export-key"
