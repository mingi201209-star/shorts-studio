name: Road paint retroreflective production (full render + real audio + QA)
# Full production run for the new retroreflective-road-paint episode:
# real narration capture (edge-tts, en-US-AndrewNeural, same voice/rate as
# every other episode in this project), the full 900-frame procedural
# render (30 shards, matching the house shard layout), and final assembly
# + the real technical QA this project uses everywhere (no CLIP semantic
# gate yet -- content_screen_match stays explicitly NOT_IMPLEMENTED).
on:
  push:
    branches: [road-paint-retroreflective-20261106]
    paths:
      - .github/workflows/road-paint-production.yml
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  speech:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install edge-tts
      - name: Capture real narration (edge-tts, Andrew voice, real WordBoundary timing)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/speech"
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_speech.py \
            --plan examples/experiments/road-paint-speech-plan.json \
            --out "$RUNNER_TEMP/speech"
          cat "$RUNNER_TEMP/speech/road-paint-retroreflective/capture.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: road-paint-speech-capture
          path: ${{ runner.temp }}/speech/
          if-no-files-found: error
          retention-days: 14

  audio:
    needs: speech
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow pydantic
      - name: Download the captured narration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --name road-paint-speech-capture --dir "$RUNNER_TEMP/speech"
      - name: Assemble narration.wav + captions from the real captured beats
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio"
          PYTHONPATH="$PWD" python -c "
          from pathlib import Path
          from benchmarks.road_safety.curious_mechanics_audio import build
          build(Path('$RUNNER_TEMP/speech/road-paint-retroreflective'), Path('$RUNNER_TEMP/audio'))
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: road-paint-audio
          path: ${{ runner.temp }}/audio/
          if-no-files-found: error
          retention-days: 14

  native:
    # TEMPORARILY DISABLED: validating the cheap speech/audio steps first,
    # before spending the expensive 30-shard render. Flip this back to true
    # once speech+audio are confirmed real PASS.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        start: [1, 31, 61, 91, 121, 151, 181, 211, 241, 271, 301, 331, 361, 391, 421, 451, 481, 511, 541, 571, 601, 631, 661, 691, 721, 751, 781, 811, 841, 871]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render 30 contiguous absolute frames
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          end=$((${{ matrix.start }} + 29))
          if [ "$end" -gt 900 ]; then end=900; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/road_safety/render_road_paint.py -- \
            --manifest examples/experiments/road-paint-manifest.json \
            --start ${{ matrix.start }} --end "$end" \
            --out "$RUNNER_TEMP/native" 2>&1 | tee "$RUNNER_TEMP/native/render.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: road-paint-native-${{ matrix.start }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 14

  final:
    needs: [native, audio]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow pydantic
      - name: Retrieve all 30 native shards and the real audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/audio"
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'road-paint-native-*' --dir "$RUNNER_TEMP/native"
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = 30
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --name road-paint-audio --dir "$RUNNER_TEMP/audio"
      - name: Assemble final MP4 and run real technical QA
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/assemble_road_paint.py \
            --native "$RUNNER_TEMP/native" \
            --audio "$RUNNER_TEMP/audio" \
            --manifest examples/experiments/road-paint-manifest.json \
            --out "$RUNNER_TEMP/final"
          sha256sum "$RUNNER_TEMP/final/road-paint-retroreflective.mp4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: road-paint-final
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 14
