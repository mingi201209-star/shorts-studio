name: Verify hashes for the 3 new ending sources (throwaway)
on:
  push:
    branches: [claude/shorts-studio-production-5cvg1r]
    paths: [.github/workflows/verify-ending-sources.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e '.[dev]'
      - name: Download, normalize, and hash each candidate through the real production path
        run: |
          python3 - <<'PY'
          import sys, hashlib, json, shutil
          sys.path.insert(0, ".")
          from pathlib import Path
          from shorts_studio.render import _resolve_asset

          build = Path("build_tmp")
          build.mkdir(exist_ok=True)

          candidates = {
              "dorsey": "https://www.nist.gov/sites/default/files/images/2022/04/04/NoahE.Dorsey.png",
              "banner": "https://www.nist.gov/sites/default/files/images/2022/04/20/Exhibit%20Title%20Banner-01.png",
              "poster": "https://www.nist.gov/sites/default/files/images/2022/04/04/service-pnp-cph-3f00000-3f05000-3f05300-3f05353v.jpg",
          }
          results = {}
          for i, (name, url) in enumerate(candidates.items()):
              try:
                  path = _resolve_asset({"asset_url": url}, build, "verify", i)
                  data = path.read_bytes()
                  digest = hashlib.sha256(data).hexdigest()
                  shutil.copy(path, f"preview_{name}.jpg")
                  results[name] = {"url": url, "sha256": digest, "size": len(data), "status": "ok"}
                  print(name, "OK", digest, len(data), "bytes")
              except Exception as e:
                  results[name] = {"url": url, "error": str(e), "status": "failed"}
                  print(name, "FAILED:", e)
          json.dump(results, open("ending_source_hashes.json", "w"), indent=2)
          PY
      - name: Publish to a throwaway orphan branch
        run: |
          git config user.name "ending-sources-bot"
          git config user.email "actions@github.com"
          git checkout --orphan verify/ending-sources
          git reset --hard
          git add ending_source_hashes.json preview_*.jpg 2>/dev/null || git add ending_source_hashes.json
          git commit -m "Throwaway: real hashes + previews for the 3 new ending sources"
          git push -f origin HEAD:refs/heads/verify/ending-sources
