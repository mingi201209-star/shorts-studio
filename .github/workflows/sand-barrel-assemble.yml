# retrigger: previous run stuck in queue
name: Sand barrel cushion assemble-only (reuse rendered shards)
# Production run 43027922317 rendered all 32 shards successfully, but its
# final job was cancelled twice by its own 30-minute timeout while
# `apt-get update` hung (15:12-15:43 UTC on the second attempt; no step of
# ours had started). This assembles from that run's shard and audio
# artifacts instead of re-rendering, with bounded, retried package
# installation so a stalled mirror fails in minutes, not half an hour.
# Same assembler, same gates, nothing relaxed.
on:
  push:
    branches: [road-paint-retroreflective-20261106]
    paths:
      - .github/workflows/sand-barrel-assemble.yml
permissions:
  contents: read
  actions: read
env:
  SOURCE_RUN_ID: "43210308630"
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install ffmpeg and fonts (apt, else a static build from PyPI)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          if timeout 150 sudo apt-get $opts update && timeout 240 sudo apt-get $opts install -y ffmpeg fonts-dejavu-core; then
            echo "ffmpeg from apt"
          else
            # The Ubuntu mirror stalled three runs in a row on 2026-11-11.
            # Same tools from PyPI instead: static ffmpeg/ffprobe, and the
            # DejaVu Sans files matplotlib ships (the same typeface the
            # caption builder measured with).
            echo "apt unavailable; using static-ffmpeg from PyPI"
            python -m pip install static-ffmpeg==2.13 matplotlib
            python -c "
          import os, subprocess, static_ffmpeg.run as r
          ffmpeg, ffprobe = r.get_or_fetch_platform_executables_else_raise()
          for src, name in ((ffmpeg, 'ffmpeg'), (ffprobe, 'ffprobe')):
              src = os.path.abspath(src)
              assert os.path.isfile(src), src
              subprocess.check_call(['sudo', 'ln', '-sf', src, '/usr/local/bin/' + name])
          "
            if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
              font_dir="$(python -c 'import matplotlib, os; print(os.path.join(matplotlib.get_data_path(), "fonts", "ttf"))')"
              sudo mkdir -p /usr/share/fonts/truetype/dejavu
              sudo cp "$font_dir"/DejaVuSans*.ttf /usr/share/fonts/truetype/dejavu/
              sudo fc-cache -f || true
            fi
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
          ffmpeg -hide_banner -filters | grep -E " ass |loudnorm|blackdetect" 
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - run: python -m pip install Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Retrieve the 32 rendered shards and the audio from the production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/audio"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'sand-barrel-native-*' --dir "$RUNNER_TEMP/native"
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = 32
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name sand-barrel-audio --dir "$RUNNER_TEMP/audio"
      - name: Assemble final MP4 and run every gate
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/assemble_crash_cushion.py \
            --native "$RUNNER_TEMP/native" \
            --audio "$RUNNER_TEMP/audio" \
            --manifest examples/experiments/sand-barrel-manifest.json \
            --out "$RUNNER_TEMP/final"
          sha256sum "$RUNNER_TEMP/final/sand-barrel-cushion.mp4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sand-barrel-final
          path: |
            ${{ runner.temp }}/final/*.mp4
            ${{ runner.temp }}/final/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Print the mp4 as base64 (this sandbox cannot download artifacts)
        run: |
          set -euo pipefail
          echo "MP4_B64_START sand-barrel-cushion.mp4"
          base64 -w0 "$RUNNER_TEMP/final/sand-barrel-cushion.mp4"
          echo ""
          echo "MP4_B64_END sand-barrel-cushion.mp4"
