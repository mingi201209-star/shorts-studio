name: Curious Mechanics B preflight projection/clipping check (manual + self-only)
# Cheap, no-Cycles-cost projection/clipping check against the CURRENTLY
# COMMITTED B manifest, using render_curious_mechanics.py's own --preview
# mode (7 Cycles samples, 450x800 instead of the production 32/1080x1920) --
# the exact same real Blender projection math the full render uses, just
# without the expensive Cycles pass -- on a small, analytically-selected set
# of frames (critical_preview_frames() in
# benchmarks/road_safety/curious_mechanics_select_preview_frames.py: each
# shot's own start/end plus any global kinematic breakpoint inside it).
#
# Two real CI failures while developing the causal-shot structure (frame 74,
# then frame 754, both in .github/workflows/curious-mechanics-b-causal-shot.yml)
# were exactly the class of bug this would have caught in a couple of
# minutes instead of 20-40 minutes into the real 30-shard matrix.
#
# Deliberately NOT wired to auto-trigger curious-mechanics-b-causal-shot.yml,
# and deliberately NOT triggered by changes to the manifest/timeline/renderer
# themselves (only by changes to this workflow or the selection script) --
# this is intentionally a standalone, on-demand tool. Run it manually
# (workflow_dispatch) against the current committed manifest BEFORE pushing
# any change to the B manifest's shot boundaries or camera parameters, and
# review its result, before pushing that change to the production workflow's
# own trigger paths. Automatically gating the full matrix behind this would
# need a workflow_run-based restructure of curious-mechanics-b-causal-shot.yml
# itself; that is deliberately not done here to avoid any risk of chaining
# into an unwanted full re-render as a side effect of adding this checker.
on:
  workflow_dispatch: {}
  push:
    branches: [feat/curious-mechanics-b-causal-shot-20261101]
    paths:
      - ".github/workflows/curious-mechanics-b-preflight-check.yml"
      - "benchmarks/road_safety/curious_mechanics_select_preview_frames.py"
permissions:
  contents: read
  actions: read
env:
  RENDERER_SOURCE_SHA256: 04fdc326a6a8a874840072ce82529e777ff0956f5c17c991ad8f87b4e59ac765
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow pydantic
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Select critical frames (own start/end + kinematic breakpoints per shot)
        run: |
          PYTHONPATH="$PWD" python3 benchmarks/road_safety/curious_mechanics_select_preview_frames.py --manifest examples/experiments/curious-mechanics-progressive-B.json | tee "$RUNNER_TEMP/chunks.txt"
      - name: Low-res/low-sample preview of every critical frame -- real Blender projection, no Cycles cost
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preview"
          grep '^CHUNK_' "$RUNNER_TEMP/chunks.txt" | cut -d' ' -f2 | while read -r chunk; do
            echo "Previewing frames: $chunk"
            xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-progressive-B.json --preview --frame-list "$chunk" --out "$RUNNER_TEMP/preview"
          done
      - name: Preserve preview frames for actual visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-mechanics-B-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/preview/
            ${{ runner.temp }}/chunks.txt
          if-no-files-found: warn
          retention-days: 7
