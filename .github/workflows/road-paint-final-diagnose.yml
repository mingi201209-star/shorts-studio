name: Road paint final QA diagnose (reuse past render, no re-render)
# Debug-only: reuses the already-completed native (32 shards) + audio
# artifacts from run 42322407163 -- which rendered and encoded cleanly but
# failed real technical QA on original_video_qa['visual_activity'] -- to
# print the actual measured evidence (cut_timestamps, max_static_visual_
# seconds, first_5s_visual_changes) without spending another ~1h on a full
# 32-shard re-render. Delete this workflow once the real content fix lands.
on:
  push:
    branches: [road-paint-retroreflective-20261106]
    paths:
      - .github/workflows/road-paint-final-diagnose.yml
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Retrieve the already-rendered native shards and audio from run 42322407163
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/audio"
          gh run download 42322407163 --repo "$GITHUB_REPOSITORY" --pattern 'road-paint-native-*' --dir "$RUNNER_TEMP/native"
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = 32
          gh run download 42322407163 --repo "$GITHUB_REPOSITORY" --name road-paint-audio --dir "$RUNNER_TEMP/audio"
      - name: Assemble + run real QA, printing the actual evidence (failure expected, that's the point)
        run: |
          set +e
          PYTHONPATH="$PWD" python benchmarks/road_safety/assemble_road_paint.py \
            --native "$RUNNER_TEMP/native" \
            --audio "$RUNNER_TEMP/audio" \
            --manifest examples/experiments/road-paint-manifest.json \
            --out "$RUNNER_TEMP/final"
          echo "exit code: $?"
          exit 0
