name: EP03 speed bump preview (two cars, same speed, low resolution)
# Renders 12 preview stills of the comparison shot and prints a contact sheet + telemetry. Preview only; never a deliverable.
on:
  push:
    branches: [ep03-speed-bump-build-20261115]
    paths:
      - .github/workflows/ep03-speed-bump-preview.yml
      - benchmarks/speed_bump/**
permissions:
  contents: read
  actions: read
env:
  BLENDER_TARBALL_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update -qq && sudo apt-get install -y imagemagick
      - name: Install hash-pinned Blender 5.0.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
          # official site first, then public mirrors: some runners get a persistent 403 from download.blender.org.
          # Whatever the source, the pinned SHA-256 below decides whether the file is accepted.
          got=0
          for base in https://download.blender.org/release https://ftp.nluug.nl/pub/graphics/blender/release \
                      https://mirror.clarkson.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release; do
            rm -f "$RUNNER_TEMP/blender.tar.xz"
            if curl -fLsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 280 "$base/Blender5.0/blender-5.0.1-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz" \
               && echo "$BLENDER_TARBALL_SHA256  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -; then
              echo "Blender downloaded from $base"; got=1; break
            fi
            echo "download from $base failed or did not match the pinned hash; trying the next source"
          done
          test "$got" = 1
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Download pinned CC0 car scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GITHUB_REPOSITORY" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 12 preview frames
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 \
            -P benchmarks/speed_bump/render_speed_bump_cc0.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --out "$RUNNER_TEMP/out" \
            --frames 48,62,76,90,104,118,132,146,160,174,188,202 > "$RUNNER_TEMP/render.log" 2>&1 || { tail -40 "$RUNNER_TEMP/render.log"; exit 1; }
          grep BUMP_FRAME "$RUNNER_TEMP/render.log"
      - name: Contact sheet
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          for f in $(ls frame_*_hump.png | sed 's/_hump.png//'); do convert ${f}_hump.png ${f}_short.png -append comp_${f#frame_}.png; done
          montage comp_*.png -tile 6x2 -geometry 240x427+2+2 -background black sheet.png
          convert sheet.png -quality 62 sheet.jpg
          echo "SHEET_BYTES $(stat -c %s sheet.jpg)"
          echo SHEET_B64_START; base64 -w 0 sheet.jpg; echo; echo SHEET_B64_END
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ep03-speed-bump-preview
          path: ${{ runner.temp }}/out/
          retention-days: 3
