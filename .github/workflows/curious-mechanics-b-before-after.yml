name: Curious Mechanics B before/after frame comparison (base64-in-log)
# Read-only: downloads the two already-assembled, already-QA-passed B final
# videos -- the Phase C reverify ("before", run 41217915732,
# curious-progressive-reverify-B, pre-dating any causal-shot change) and
# this PR's causal-shot result ("after", run 41283956286,
# curious-progressive-causal-shot-B-reassembled) -- and prints base64 JPEG
# stills from each at matching timestamps, since this sandbox cannot
# download artifact ZIPs directly. Renders nothing new.
on:
  push:
    branches: [feat/curious-mechanics-b-causal-shot-20261101]
    paths:
      - ".github/workflows/curious-mechanics-b-before-after.yml"
      - "benchmarks/road_safety/extract_video_timestamps_b64.py"
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download the before (Phase C reverify) and after (causal-shot) final B videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"
          gh run download 41217915732 --repo "$GITHUB_REPOSITORY" --name curious-progressive-reverify-B --dir "$RUNNER_TEMP/before"
          gh run download 41283956286 --repo "$GITHUB_REPOSITORY" --name curious-progressive-causal-shot-B-reassembled --dir "$RUNNER_TEMP/after"
          find "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" -iname '*.mp4'
      - name: First 3 seconds (before vs after)
        run: |
          set -euo pipefail
          python benchmarks/road_safety/extract_video_timestamps_b64.py --video "$(find "$RUNNER_TEMP/before" -iname '*progressive-v3.mp4')" --label BEFORE_open --timestamps 0.5 1.0 1.5 2.0 2.5
          python benchmarks/road_safety/extract_video_timestamps_b64.py --video "$(find "$RUNNER_TEMP/after" -iname '*progressive-v3.mp4')" --label AFTER_open --timestamps 0.5 1.0 1.5 2.0 2.5
      - name: 15.5-25.5s region (before vs after)
        run: |
          set -euo pipefail
          python benchmarks/road_safety/extract_video_timestamps_b64.py --video "$(find "$RUNNER_TEMP/before" -iname '*progressive-v3.mp4')" --label BEFORE_mid --timestamps 16 18 20 22 24
          python benchmarks/road_safety/extract_video_timestamps_b64.py --video "$(find "$RUNNER_TEMP/after" -iname '*progressive-v3.mp4')" --label AFTER_mid --timestamps 16 18 20 22 24
