name: Curious Mechanics A+C native re-render (current timeline.py, full 900 frames)
# Same root cause as curious-mechanics-b-timeline-rerender.yml, applied to the
# remaining two variants: shorts_studio/factory/curious_mechanics_timeline.py
# changed (commits 380b8ff/26b3213/4188225: road_cut top/side camera framing,
# rumble_displacement amplitude 8mm->24mm) after A and C's existing native
# asset beds (curious-mechanics-progressive-native.yml, 2026-10-29/30) were
# rendered.
#
# curious_mechanics_native_qa.verify() binds EVERY shard to timeline.py's own
# sha256 at assembly time, regardless of which variant is being assembled --
# the same file is shared by A/B/C, so this staleness is not B-specific. The
# B re-render (run 42038281331) already proved the fix; this workflow repeats
# it for A and C so the approved idle-motion driver-cut splice (already
# defined for A and C in shorts_studio/studio_org/driver_cut.py's
# INSERTS_BY_VARIANT, unmodified, never run before) can be assembled against
# a bed that actually matches the current timeline.py.
on:
  push:
    branches: [driver-cut-idle-motion-ac-20261106]
    paths:
      - ".github/workflows/curious-mechanics-ac-timeline-rerender.yml"
permissions:
  contents: read
  actions: read
env:
  RENDERER_SOURCE_SHA256: 04fdc326a6a8a874840072ce82529e777ff0956f5c17c991ad8f87b4e59ac765
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 35
      matrix:
        variant: [A, C]
        start: [1, 31, 61, 91, 121, 151, 181, 211, 241, 271, 301, 331, 361, 391, 421, 451, 481, 511, 541, 571, 601, 631, 661, 691, 721, 751, 781, 811, 841, 871]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned Blender 5.0.1 and QA dependencies
        run: |
          set -euo pipefail
          echo "$RENDERER_SOURCE_SHA256  benchmarks/road_safety/render_curious_mechanics.py" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 ffmpeg
          python -m pip install Pillow pydantic
          curl -fLsS --retry 2 --max-time 200 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Fetch exact CC0 production scene without binary commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download rumble-episode2-scene-a82e0582-20261018 -R "$GH_REPO" -p 'guardrail-car-cc0-pinned-a82e0582.blend' -D "$RUNNER_TEMP/source"
          echo "a82e05825f907cc99678ab12855527552e34323b31ae801625af4a0f563ed877  $RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" | sha256sum -c -
      - name: Render 30 contiguous absolute frames under the current timeline.py
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rumble"
          end=$((${{ matrix.start }} + 29))
          if [ "$end" -gt 900 ]; then end=900; fi
          xvfb-run -a "$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" -b -t 4 --python-exit-code 1 -P benchmarks/road_safety/render_curious_mechanics.py -- --source "$RUNNER_TEMP/source/guardrail-car-cc0-pinned-a82e0582.blend" --manifest examples/experiments/curious-mechanics-progressive-${{ matrix.variant }}.json --start ${{ matrix.start }} --end "$end" --out "$RUNNER_TEMP/rumble" 2>&1 | tee "$RUNNER_TEMP/rumble/render.log"
      - name: Native shard QA and lossless intermediate
        run: |
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_shard_artifact.py --out "$RUNNER_TEMP/rumble" --manifest examples/experiments/curious-mechanics-progressive-${{ matrix.variant }}.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-progressive-${{ matrix.variant }}-causal-${{ matrix.start }}
          path: ${{ runner.temp }}/rumble/
          if-no-files-found: error
          retention-days: 14

  final:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [A, C]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve this variant's 30 freshly rendered shards and its preserved source/audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/source"
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern "curious-progressive-${{ matrix.variant }}-causal-*" --dir "$RUNNER_TEMP/native"
          ls "$RUNNER_TEMP/native" | sort
          test "$(ls "$RUNNER_TEMP/native" | wc -l)" = 30
          if [ '${{ matrix.variant }}' = A ]; then
            gh run download 41190640057 --repo "$GITHUB_REPOSITORY" --name curious-mechanics-causal-revision-A --dir "$RUNNER_TEMP/source"
          else
            gh run download 41191337000 --repo "$GITHUB_REPOSITORY" --name curious-mechanics-causal-revision-${{ matrix.variant }} --dir "$RUNNER_TEMP/source"
          fi
      - name: Install unchanged observed final QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu torchvision==0.29.1+cpu
          python -m pip install open-clip-torch==3.3.0 Pillow==13.0.0 pydantic==2.14.1 opencv-python-headless==5.0.0.93
      - name: Verify every native PNG and lossless clip; assemble the native-only (non-driver) variant first
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python benchmarks/road_safety/curious_mechanics_progressive_delivery.py --native "$RUNNER_TEMP/native" --source "$RUNNER_TEMP/source/${{ matrix.variant }}" --variant '${{ matrix.variant }}' --out "$RUNNER_TEMP/final/${{ matrix.variant }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curious-progressive-${{ matrix.variant }}-timeline-rerender-native-only
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 14
