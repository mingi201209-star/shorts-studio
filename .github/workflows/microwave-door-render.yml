name: microwave-door-render
on:
  push:
    branches: [content/microwave-door-mesh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering and semantic QA dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-nanum librsvg2-bin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,vision]'
      - name: Full regression
        run: pytest -q
      - name: Generate microwave production manifest and assets
        run: |
          set -o pipefail
          python scripts/build_microwave_door_states.py --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf 2>&1 | tee microwave-generator.log
      - name: Validate production manifests
        run: |
          for manifest in examples/*.json; do
            python -m shorts_studio validate "$manifest"
          done
      - name: Require microwave production manifest
        run: test -f examples/microwave_door_mesh.json
      - name: Render microwave short
        env:
          SHORTS_REQUIRE_SEMANTIC_QA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m shorts_studio render examples/microwave_door_mesh.json 2>&1 | tee microwave-render.log
      - name: Verify final deliverable and QA
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          video=Path('dist/final.mp4')
          assert video.is_file() and video.stat().st_size > 0
          p=subprocess.run(['ffprobe','-v','error','-of','json','-show_entries','stream=codec_name,width,height','-show_entries','format=duration',str(video)],capture_output=True,text=True,check=True)
          probe=json.loads(p.stdout)
          vs=next(s for s in probe['streams'] if 'width' in s)
          assert (vs['width'],vs['height'])==(1080,1920),vs
          assert vs['codec_name']=='h264',vs
          q=json.loads(Path('dist/qa_report.json').read_text(encoding='utf-8'))
          assert q['status']=='PASS',q
          assert q['semantic_required'] is True
          assert q['semantic_visual_qa']['status']=='PASS',q['semantic_visual_qa']
          assert q['final_video_qa']['status']=='PASS',q['final_video_qa']
          assert all(x['status']=='PASS' for x in q['subtitle_reports'])
          print('Microwave final deliverable QA PASS; duration=',probe['format']['duration'])
          PY
      - name: Sample frames for human review
        if: success()
        run: |
          mkdir -p review_frames
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 dist/final.mp4)
          ffmpeg -y -ss 0.3 -i dist/final.mp4 -frames:v 1 review_frames/open.jpg
          ffmpeg -y -ss 3.0 -i dist/final.mp4 -frames:v 1 review_frames/hook.jpg
          ffmpeg -y -ss "$(python -c "print(float('$duration')/2)")" -i dist/final.mp4 -frames:v 1 review_frames/mid.jpg
          ffmpeg -y -ss "$(python -c "print(max(0,float('$duration')-0.7))")" -i dist/final.mp4 -frames:v 1 review_frames/end.jpg
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: microwave-door-mesh-publishable
          retention-days: 30
          path: |
            dist/
            review_frames/
            build/*.srt
            build/*.timing.json
            microwave-generator.log
            microwave-render.log
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: microwave-door-mesh-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/
            microwave-generator.log
            microwave-render.log
